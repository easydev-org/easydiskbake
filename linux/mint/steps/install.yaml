# Linux Mint Cinnamon: Ubiquity's seven panes, as a sequence.
#
#     python3 lib/steps.py linux/mint/steps/install.yaml --qmp /work/drive.sock.qmp
#
# WHAT THIS REPLACES
#
# linux/mint/install.py's walk_ubiquity() and stop_the_screensaver(). install.py keeps
# the machine, the kernel and initrd, the frames, the recording and the publish.
#
# THE FIRST STEP IS THE ONE THAT KEEPS THE WHOLE RUN ALIVE, AND IT HAS ITS OWN HISTORY
#
# A CLICK PER POLL DID NOT KEEP THIS SESSION AWAKE. Measured twice: run 42408624906 read
# `14:25`, `14:26`, `14:34` for ten minutes and run 42414965231 read `15:58`, `15:59`,
# `16:00` - both times a full-window Mint LOCK SCREEN with a large clock and the Mint logo,
# no installer anywhere, while a correct install finished underneath it. The screen saver
# engages on this live session within about two minutes of the last real input, and
# synthetic clicks from QMP are evidently not what its idle timer counts.
#
# So it is DISABLED rather than raced, and every mechanism that can blank this screen is
# turned off in one line - see the `run` step below, which is the same command the driver
# typed into a terminal.
#
# THE END IS A MEASURED WAIT, AND THE REASON IS THAT THIS ISO'S LAST MODAL IS UNREADABLE
#
# Ubiquity's last screen is a modal - `Installation Complete`, `Installation has finished.
# You can continue testing Linux Mint now...`, `Continue Testing` / `Restart Now` - and on
# this ISO tesseract reads THE WHOLE MODAL AS AN EMPTY LINE:
#
#     $ tesseract frame.jpg stdout --psm 3
#     Install Linux Mint
#
#     (©) i | oo ii (-} 2 4) o7:16
#
# A local run copied files, configured hardware, configured the bootloader and put that modal
# up - a complete, correct install - while the log said `installing: (©) i | | | 6 4)` every
# twenty seconds. Any completion test built on those words would have thrown the disk away.
#
# So this walk waits a MEASURED TIME, the same way ubuntu and kubuntu do. The
# measurement: from `Continue` on the Who-are-you pane to the completion modal is about
# 25 minutes on this ISO - 22:51 to 23:16 in the local run that ended in the frame above, and
# 21:20 to 22:0x in CI. FORTY MINUTES is that with room for a slower runner.

name: mint - the ubiquity walk
resolution: [1920, 1080]

vars:
  # THE FIRST WORD OF THIS IS THE LOGIN NAME. Ubiquity on Mint lowercases the first word of
  # the full name and uses it as the account, so `VM User` becomes `vm` - see the note at the
  # full-name step. Pop!_OS' installer behaves differently with the same string.
  display_name: Vmuser User
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin

steps:
  # =======================================================================================
  # 0. TURN THE SCREEN SAVER, ITS LOCK AND THE DPMS BLANK OFF
  # =======================================================================================
  #
  # EVERY MECHANISM IN ONE COMMAND, because gsettings alone was not enough: the first
  # attempt set all three Cinnamon keys and the session still came up locked (`16:39`,
  # `16:41`, `16:45` on run 42418654318). Cinnamon's screen saver and the X server's own
  # DPMS blank are SEPARATE timers here, and the second one is not in gsettings at all:
  #
  #     gsettings ... idle-delay 0                 never blank
  #     gsettings ... lock-enabled false           never lock
  #     gsettings ... idle-activation-enabled false
  #     xset s off; xset -dpms; xset s noblank     the X server's own blank
  #
  # AND A KEEPALIVE OF LAST RESORT, because the settings path has failed once already.
  # `xdotool` moves the pointer from INSIDE the session, which is the only kind of event every
  # idle timer on this build agrees about - QMP's synthetic clicks from outside are not it.
  # The loop runs detached and stops itself after six hours; it is started here so that it is
  # already ticking while Ubiquity copies files.
  - name: disable the screen saver, its lock and the dpms blank
    run: "gsettings set org.cinnamon.desktop.session idle-delay 0; gsettings set org.cinnamon.desktop.screensaver lock-enabled false; gsettings set org.cinnamon.desktop.screensaver idle-activation-enabled false; xset s off; xset -dpms; xset s noblank; ( for i in $(seq 1 1080); do xdotool mousemove_relative -- 1 0 2>/dev/null; xdotool mousemove_relative -- -1 0 2>/dev/null; sleep 20; done ) >/dev/null 2>&1 & exit"
    terminal_wait: 8
    settle: 10

  # =======================================================================================
  # 1. THE INSTALLER. A DOUBLE-CLICK ON THE DESKTOP ICON.
  # =======================================================================================
  #
  # Ubiquity is not running when the session settles; its icon is on the desktop at (114,47).
  # The double-click matters: a single press only selects the icon on this desktop.
  #
  # `optional` BECAUSE THE ORIGINAL DRIVER DID NOT FAIL HERE EITHER: it double-clicked, and
  # let the sequence tell the truth - a wizard that never opened leaves every later click on
  # the desktop and the empty-disk check says so loudly. This reading is a log line.
  - name: install linux mint
    double: [114, 47]
    settle: 25
    optional: true
    expect_any:
      - [welcome]
      - [install]

  # =======================================================================================
  # 2. THE PANES THAT ONLY NEED `Continue`
  # =======================================================================================
  #
  # Quit / Back / Continue are right-aligned inside the window, which Ubiquity centres on a
  # fixed-size 1920x1080 screen: Continue is (1306,727) on every pane that has it.
  - name: welcome
    at: [1306, 727]
    settle: 12

  # The checkbox for multimedia codecs ships OFF and stays off: a bake does not need them,
  # and enabling them is a download this run does not have to make.
  - name: keyboard
    at: [1306, 727]
    settle: 12

  - name: multimedia codecs
    at: [1306, 727]
    settle: 12

  # `Erase disk and install Linux Mint` is already selected.
  - name: installation type
    at: [1306, 727]
    settle: 15

  # =======================================================================================
  # 3. THE CONFIRMATION, CLICKED WHETHER OR NOT THE SCREEN WAS READ
  # =======================================================================================
  #
  # Run 42372449152 stopped here: a conditional decided from an OCR read whether the `Write
  # the changes to disks?` dialog had appeared, did not see it, and skipped the click - then
  # spent the rest of the run on the Installation type pane with the modal possibly open
  # behind it.
  #
  # A CONDITIONAL THAT GATES A CLICK IS THE SAME MISTAKE AS A LOOKUP THAT CHOOSES ONE, and
  # this repository has paid for it four times. The click costs nothing when the dialog is
  # absent: (1269,659) is blank space on the pane, so a stray click there selects nothing.
  # MEASURED ON THIS IMAGE'S OWN MODAL (local run, 2026-11-09): the `Continue` button inside
  # `Write the changes to disks?` is x=1180..1352, y=645..681 - centre (1266, 663). The old
  # (1269, 659) is inside that box too, so the press was not the whole story: the modal was
  # still on screen when the walk reached the next pane, which means the press was delivered
  # before the dialog had finished drawing. `settle` before the press, and again after.
  - name: write the changes to disks
    at: [1266, 663]
    settle: 25

  # AND `Install Now` A SECOND TIME, BECAUSE THE MODAL DOES NOT LEAVE THE PANE.
  #
  # MEASURED, AND IT IS WHY THE ACCOUNT PANE WAS NEVER FILLED. On this image `Install Now`
  # opens the `Write the changes to disks?` modal; dismissing that modal returns to the SAME
  # `Installation type` pane, and only a SECOND press of `Install Now` starts the copy.
  #
  # Run after run pressed `Install Now` once, pressed `Continue` in the modal, and then typed
  # the four account fields into an `Installation type` pane that had no text fields at all -
  # every keystroke went nowhere. The disk was then installed with the installer's own
  # defaults, which is why its LightDM kept answering
  #
  #     Invalid password, please try again
  #
  # to `admin` and to seven other candidates: the password on that disk was never set by this
  # walk. The frame that proves the pane is still there after the modal comes from a local run
  # on 2026-11-09.
  - name: installation type - install now, after the modal
    at: [1307, 726]
    settle: 30

  # The time zone default is kept: on this cluster it is Shanghai, and changing it is one
  # more text field that can go wrong for no gain.
  - name: where are you
    at: [1306, 727]
    settle: 15

  # =======================================================================================
  # 4. WHO ARE YOU? THE ACCOUNT, IN THE SAME SHAPE EVERY LINUX BAKE HERE USES.
  # =======================================================================================
  #
  # THE HOSTNAME IS DERIVED FROM THE MACHINE MODEL - `docker-Standard-PC-Q35` - and is
  # replaced with the user name so the disk has one canonical name in it.
  # THE FULL NAME IS A DISPLAY NAME, AND THE HOST NAME IS DERIVED FROM IT.
  #
  # This walk used to type `docker` into BOTH fields. Ubiquity capitalises the full name as
  # it goes - `VMUSER` - and seeds the host name from it, so the second press appended the
  # walk's `docker` to what Ubiquity had already put there. Measured on run 42577663888's
  # own lightdm title bar:
  #
  #     VMUSERvmuser-Standard-PC-Q35-ICH9-2009
  #
  # and the login name on that disk is `VMUSERvmuser`, not `docker`.
  #
  # `VM User` WAS THE WRONG SHAPE, AND RUN 6eeff43 MEASURED WHAT UBUNTU'S UBIQUITY ACTUALLY
  # DOES WITH IT. The comment that used to sit here said "a human name with a space, from
  # which a clean login name follows" - and the disk that run published answers differently:
  #
  #     vm@vmuser:~$          <- the login is `vm`, the FULL NAME's FIRST WORD
  #
  # Ubiquity on Mint derives the login from the first word of the full name, lowercased. It
  # does NOT strip the spaces the way Pop!_OS' installer does (`VM User` -> `vmuser` there,
  # `vm` here), and the difference is invisible until a stage tries to log in: the disk's own
  # terminal is the evidence, and ssh answered `Permission denied` for `vmuser` against a disk
  # whose account is `vm`.
  #
  # SO THE FIRST WORD HAS TO BE THE WHOLE LOGIN NAME. `Vmuser User` derives `vmuser`; `vmuser`
  # and `Vmuser` do too, and the space is what keeps the display name a human name.
  - name: who are you - full name
    at: [965, 347]
    type: "{{ display_name }}"
    settle: 2
  # THE COMPUTER NAME FIELD IS ALREADY FILLED BY UBUNTU, AND APPENDING TO IT CORRUPTS IT.
  #
  # Measured on this image in a local run on 2026-11-09. When the pane opens, Ubiquity has
  # already put `docker-Standard-PC-Q35-ICH9-2009` in `Your computer's name`. The walk then
  # clicked it once and typed `docker`, and the field read
  #
  #     docker-Standockerdard-F
  #
  # - `docker` INSERTED INTO the middle of the existing text, not appended and not replacing
  # it. `type_into` does ctrl+a and 24 backspaces before typing, so the select-all did not
  # take on this field; what did happen is the insertion point landing inside the string.
  #
  # A CORRUPTED COMPUTER NAME IS NOT COSMETIC. Ubiquity derives the login name from the name
  # fields, and the disk that ships from here is the one whose LightDM shows `VMUSER` and
  # rejects `admin`. This is the leading explanation for mint's ssh stage failing on a disk
  # whose password this walk had set.
  #
  # SO THE FIELD IS CLEARED PROPERLY FIRST: click, select all, and DELETE, as separate steps
  # with a settle after each, then type. That is three steps instead of one because the
  # one-step form is what produced the corruption.
  - name: who are you - host name, select all
    at: [877, 375]
    settle: 2

  - name: who are you - host name, clear it
    key: ctrl+a
    settle: 2

  - name: who are you - host name, delete the selection
    key: backspace
    settle: 2

  - name: who are you - host name
    type: "{{ user }}"
    settle: 2
    # THE LOGIN NAME IS CHECKED HERE, WHERE THE DISK GETS IT. Run 6eeff43 published an image
    # whose account was `vm` while every step below reported success; Ubiquity derives the
    # login from the FIRST WORD of the full name above, and nothing in this file read the
    # result. If the derivation is not `{{ user }}`, the walk now stops on the pane that
    # caused it instead of at a `Permission denied` ten minutes later.
    expect: ["{{ user }}"]
  - name: who are you - password
    at: [877, 458]
    type: "{{ password }}"
    settle: 2
  - name: who are you - confirm password
    at: [877, 492]
    type: "{{ password }}"
    settle: 3

  # `Short password` is shown in red beside the field for `admin`, and Continuing anyway is
  # the measured, working answer.
  - name: who are you
    at: [1306, 727]
    settle: 20

  # =======================================================================================
  # 5. UNTIL THE MEASURED END, BECAUSE THE MODAL THAT WOULD SAY IT IS UNREADABLE
  # =======================================================================================
  #
  # See the file header: this ISO's completion modal OCRs as a blank line, so any test built
  # on its words throws a correct disk away. Forty minutes is the measured 25 with room.
  #
  # THE KEEP-ALIVE CLICK IS PART OF THE WAIT, and here it is not a nicety: this is the
  # session whose screen saver was racing the installer, and the `run` step above is the
  # other half of the same defence.
  - name: the install runs, as measured
    wait: 2400
    keep_alive: true

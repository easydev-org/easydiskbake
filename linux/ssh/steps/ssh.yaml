# Stage three for every GUI distribution: put sshd on the disk and prove ssh works.
#
#     python3 lib/steps.py linux/ssh/steps/ssh.yaml --qmp /work/drive.sock.qmp --ssh-port 2222 \
#         --var script="<the install script>"
#
# WHY THIS IS A YAML WALK AND NOT A PYTHON DRIVER
#
# Every GUI stage in this repository is a YAML walk now - the bakes, the launches, macOS's
# whole ssh stage (`macos/15/steps/ssh.yaml`, which is `python:` for the Settings switch then
# `require_ssh: true` then `ssh: <command>`). This is the same shape, so that "install sshd on
# a desktop disk" is one file every distribution shares instead of thirteen copies of the same
# twenty lines.
#
# WHAT IT DOES, IN THREE ACTIONS AND NO MORE
#
#     1. run:          open the session's terminal (ctrl+alt+t) and type the install script.
#                      The script is per-family - apt, dnf, pacman, zypper, nixos-rebuild,
#                      FreeBSD's sysrc - and arrives already base64-encoded, so nothing in it
#                      has to survive a terminal's line discipline.
#     2. require_ssh:  wait for the daemon that script just enabled. This is the step macOS's
#                      file added for exactly this purpose, and it replaces what used to be a
#                      flat `wait:` for a number nobody could measure.
#     3. ssh:          run a command IN THE GUEST over the forwarded port. An exit status is
#                      the verdict - a port that accepts a connection and then refuses every
#                      command is not the thing being claimed.
#
# THE TRANSPORT IS THE DESKTOP. These disks have no getty on ttyS0 - measured on run
# 42551299241, whose console said `BdsDxe: starting Boot0001` and then nothing for the rest of
# the run - so `run:` is the only way in, and it is the same way mint's screen-saver commands
# and macOS's `run:` steps go in.
#
# `vars` CARRIES THE TWO STRINGS THE SCRIPT NEEDS. `script` is the base64 blob and `password`
# is the account's, because `sudo -S` is what these systems need where there is no tty.

name: sshd on a desktop disk
resolution: [1920, 1080]

vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: docker
  script:
    from: args.script
    default: ""

steps:
  # =======================================================================================
  # 1. THE INSTALL, TYPED INTO THE SESSION'S OWN TERMINAL
  # =======================================================================================
  #
  # THE BLOB IS WRITTEN FIRST AND RUN SECOND, in one `run:` line, because the second half has
  # to see the file the first half wrote and `run:` types its text into one shell.
  #
  # `terminal_wait` IS A MEASUREMENT, NOT A GUESS. A desktop that has just painted has not yet
  # started its terminal emulator or its portal; ctrl+alt+t sent into that gap goes nowhere.
  # 12 s is what the GUI launches' own `--desktop-settle` covers, and it is what the Pop!_OS
  # run needed before its terminal opened.
  - name: install sshd
    run: "echo {{ script }} | base64 -d > /tmp/easy-ssh.sh; echo {{ password }} | sudo -S sh /tmp/easy-ssh.sh 2>&1"
    terminal_wait: 12
    settle: 20

  # FREEBSD HAS NO sudo AT ALL, so the step above cannot be the one that works there. This is
  # the `su` form, and it is `optional` and last so that on a Linux disk - where the blob has
  # already been run by the step above - its only effect is to type one harmless line into the
  # same terminal.
  - name: install sshd (with su, for FreeBSD)
    run: "test -f /tmp/easy-ssh.sh && echo {{ password }} | su -m root -c 'sh /tmp/easy-ssh.sh' 2>&1 || true"
    terminal_wait: 12
    settle: 15
    optional: true

  # =======================================================================================
  # 2. WAIT FOR THE DAEMON THE STEP ABOVE ENABLED
  # =======================================================================================
  #
  # NO FIXED `wait:`. The number would be a guess about a package install and a `nixos-rebuild`
  # that share nothing; `require_ssh` asks the only question that matters and reports how long
  # it took, which is the measurement the next person needs.
  - name: wait for sshd
    require_ssh: true
    timeout: 600

  # =======================================================================================
  # 3. THE PROOF, AND IT IS THE GUEST ANSWERING OVER THE FORWARDED PORT
  # =======================================================================================
  #
  # AN EXIT STATUS IS THE VERDICT. `uname -a` proves a shell ran; `id -un` proves it ran as the
  # account the objective names; `hostname` proves it is this guest and not the runner.
  - name: prove the kernel over ssh
    ssh: uname -a
    timeout: 120

  - name: prove the account over ssh
    ssh: id -un; hostname
    timeout: 120

  # A READ-MEANT-TO-SUCCEED, NOT A READ-MEANT-TO-FAIL: this is the one that would catch a
  # sudoers or firewall mistake, because it is what a user actually does after logging in.
  - name: prove a privileged command over ssh
    ssh: sudo -n true && echo sudo-ok || echo sudo-needs-a-password
    timeout: 120

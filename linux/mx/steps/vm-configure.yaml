# Stage four for linux-mx: everything a finished disk needs before the
# toolchain - a name, the host share, and an agent that can shut the machine down.
#
#     python3 lib/steps.py linux/fedora-workstation/steps/vm-configure.yaml \
#         --qmp /work/drive.sock.qmp --ssh-port 2222
#
# WHY THIS STAGE EXISTS, AND WHY IT COMES AFTER ssh
#
# It is macOS' stage four, for the same three reasons and in the same order. Before ssh there is
# no way in that is not a keyboard and a screen; after it, everything here is ordinary remote
# work. So the stages are ordered install -> ssh -> vm-configure -> dev, and nothing in this
# file clicks anything.
#
# WHAT IT DOES
#
#     the machine's name        `vm`, set with the system's own tool
#     the host share            ~/shared, mounted from the smbd `share_serve:` starts
#     the qemu guest agent      a shutdown that is a request, not a power button
#
# THE NAME IS `vm` AND NOT THE ACCOUNT'S NAME. Every distribution in this repository answers
# `hostname` with something different today - `fedora`, `nixos`, `mx`, `pop-os`,
# `localhost.localdomain`, `vmuser`, `vmuser-ghostbsd` - because each installer has its own idea
# of what to derive one from, and the account rename moved some of them and not others. One name
# for the machine makes `ssh vm` and a prompt that means the same thing on all thirteen, and it
# is set HERE rather than in each installer so there is one place that decides it.
#
# WHAT THIS FILE INSTALLS IS NOT A TOOLCHAIN. No compiler, no interpreter, no package that a
# person would use. If a step here needs something that is not in a stock desktop, it belongs in
# `dev.yaml`.

name: linux-mx - configure the vm (name, share, guest agent)
resolution: [1920, 1080]

vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  # THE MACHINE'S NAME, IN ONE PLACE. Written once here and read by every step below that has
  # to prove it, so a stage cannot disagree with itself about what it set.
  hostname:
    from: args.hostname
    default: vm
  # THE SERVER, SO NO PROOF BELOW HARD-CODES AN ADDRESS. Same var, same reason, as macOS'
  # vm-configure.yaml: a literal typed into an ssh command bakes the CI network into a disk.
  host:
    from: args.host
    default: 172.30.0.1

ssh_user: vmuser
ssh_port: 2222

steps:

  # =======================================================================================
  # 0. THE MACHINE
  # =======================================================================================
  #
  # THE STAGE STARTS QEMU, NOT THIS FILE, and that is macOS' arrangement rather than a choice
  # made here: `boot:`/`shutdown:` need a MachineSession, and the stage is what owns the machine.
  # So this file is pure remote work over a connection the caller has already made - which is
  # also why it can be run against any sshd, and why every step below is `ssh:` or a host-side
  # service.
  #
  # `require_ssh:` STILL BELONGS HERE. "QEMU is running" and "the guest answers" are different
  # facts with different timeouts, and this is the file that needs the second one.
  - name: wait for sshd
    require_ssh: true
    timeout: 900

  # =======================================================================================
  # 1. THE MACHINE'S NAME
  # =======================================================================================
  #
  # `hostnamectl set-hostname` IS THE SYSTEM'S OWN TOOL on every systemd distribution here, and
  # it writes /etc/hostname as well as calling the kernel - so the name survives a reboot, which
  # a bare `hostname` does not. It needs root, and the password goes through `sudo -S` on STDIN.
  #
  # THE NAME IS ALSO PUT IN /etc/hosts. systemd's own man page says to: `hostnamectl` sets the
  # static name and leaves the loopback line alone, and some programs resolve the local name
  # through /etc/hosts and then fail to find it. Replacing the `127.0.1.1` line rather than
  # appending is what keeps the file from growing a line per boot.
  - name: set the machine's name
    ssh: |
      printf '%s\n' '{{ password }}' | sudo -S -p '' hostnamectl set-hostname {{ hostname }}
    timeout: 120

  - name: point the loopback line at that name
    ssh: |
      printf '%s\n' '{{ password }}' | sudo -S -p '' sh -c '
        if grep -q "^127\.0\.1\.1" /etc/hosts; then
          sed -i "s/^127\.0\.1\.1.*/127.0.1.1\t{{ hostname }}/" /etc/hosts
        else
          printf "127.0.1.1\t%s\n" "{{ hostname }}" >> /etc/hosts
        fi'
    timeout: 120

  # THE PROOF IS THE VALUE, READ BACK FROM THE SYSTEM THAT HOLDS IT. A `hostnamectl` that
  # answered 0 and a name that did not change is exactly the failure this catches.
  #
  # NO `expect:` ON AN ssh STEP, and that is a rule of this engine rather than a preference: a
  # pure-ssh walkthrough runs headless, and `HeadlessDriver.says()` raises rather than reading a
  # screen that does not exist. The verdict here is the shell's own exit status, so the comparison
  # is inside the command - `test ... || exit 1` is what makes a wrong name a failed step.
  - name: prove the name
    ssh: |
      set -e
      echo "static: $(hostnamectl --static)"
      echo "kernel: $(hostname)"
      echo "hosts:  $(grep -c '{{ hostname }}' /etc/hosts) line(s)"
      test "$(hostnamectl --static)" = "{{ hostname }}"
      test "$(hostname)" = "{{ hostname }}"
      grep -q '{{ hostname }}' /etc/hosts
    timeout: 60

  # =======================================================================================
  # 2. THE QEMU GUEST AGENT
  # =======================================================================================
  #
  # WHY A GUEST AGENT AT ALL, WHEN ssh ALREADY WORKS.
  #
  # Because a clean shutdown is a different operation from a command. qmp's
  # `system_powerdown` is an ACPI event, and a desktop answers it with whatever its session
  # policy says - on macOS a dialog nobody clicks, on GNOME a confirmation the user has to
  # accept. `guest-shutdown` over qga is a REQUEST the guest's own agent executes, and it is
  # acknowledged, which is what lets a stage say "the disk was closed" instead of "qemu was
  # killed".
  #
  # THE PACKAGE NAME IS THE SAME ON EVERY FAMILY (`qemu-guest-agent`); what differs is the
  # command that installs it. This file is per-distribution because that line, and the cifs one
  # below, are the two things that are not shared - see the note on `install the cifs client`.
  #
  # `--now` BECAUSE `enable` ALONE DOES NOT START IT. The same mistake opensuse's sshd install
  # made, and the proof below is what would catch it again.
  - name: refresh the package index
    ssh: |
      printf '%s\n' '{{ password }}' | sudo -S -p '' sh -c 'DEBIAN_FRONTEND=noninteractive apt-get update -o DPkg::Lock::Timeout=600' 2>&1 | tail -3
    timeout: 600

  - name: install the guest agent
    ssh: |
      printf '%s\n' '{{ password }}' | sudo -S -p '' DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-guest-agent 2>&1 | tail -5
    timeout: 600

  - name: enable the guest agent
    ssh: |
      printf '%s\n' '{{ password }}' | sudo -S -p '' systemctl enable --now qemu-guest-agent 2>&1 | tail -3
    timeout: 120

  # THE DEVICE AND THE PROCESS, BECAUSE THEY FAIL DIFFERENTLY - the same pair macOS' file
  # checks. A unit that is active with no /dev/virtio-ports/... behind it is an agent that will
  # never answer, and `systemctl is-active` would call that success.
  - name: prove the guest agent is running
    ssh: |
      systemctl is-active qemu-guest-agent &&
      ls -l /dev/virtio-ports/org.qemu.guest_agent.0 2>&1 &&
      systemctl show -p MainPID --value qemu-guest-agent
    timeout: 120

  # =======================================================================================
  # 3. THE HOST SHARE
  # =======================================================================================
  #
  # THE SAME SERVER macOS AND WINDOWS USE, THROUGH THE KERNEL CLIENT THIS FAMILY HAS. SMB is
  # what `share_serve:` starts; Linux reaches it with `mount.cifs`, which is in `cifs-utils` -
  # NOT installed on a stock desktop, so the first step here puts it there.
  #
  # THE PACKAGE IS THE ONE THING THAT DIFFERS between the Debian, Arch and RPM families, and it
  # is the reason this file is copied rather than shared.
  - name: install the cifs client
    ssh: |
      printf '%s\n' '{{ password }}' | sudo -S -p '' DEBIAN_FRONTEND=noninteractive apt-get install -y cifs-utils 2>&1 | tail -5
    timeout: 600

  - name: serve the host share
    share_serve: true
    timeout: 60

  - name: mount the host share
    share_mount: true
    share_family: linux
    requires: [share]
    timeout: 180

  # A MOUNT THAT REPORTS SUCCESS AND A DIRECTORY THAT IS EMPTY ARE DIFFERENT FACTS. Writing a
  # file and reading it back is the only proof that the share is the one the host is serving and
  # that it is writable - a read-only mount answers `ls` happily.
  - name: prove the share is readable and writable
    ssh: |
      set -e
      mount | grep ' on ' | grep shared
      ls -la ~/shared | head -20
      printf 'written-by-%s\n' "$(hostname)" > ~/shared/from-guest.txt
      test "$(cat ~/shared/from-guest.txt)" = "written-by-{{ hostname }}"
      echo "round trip ok"
    timeout: 120

  # =======================================================================================
  # 4. THE BOOTSTRAP LAUNCHER
  # =======================================================================================
  #
  # WHAT THE DISK RUNS AT LOGIN, AND WHY IT IS A FILE RATHER THAN A TOOLCHAIN.
  #
  # `~/shared/bootstrap.sh` is a script a PERSON puts on the host. Nothing on this disk is
  # required to run it - that is the point of using the shell the guest already has. The launcher
  # below is what looks for it, once per login, and the probe `lib/bootstrap_probe.sh` is what
  # proves the whole chain worked.
  #
  # A SYSTEMD USER UNIT, NOT A DESKTOP FILE. Every distribution here runs systemd except the BSD,
  # so one unit type covers all twelve, and `systemctl --user` is what makes it run as the
  # account rather than as root - which matters because the script is the user's.
  - name: write the launcher
    python: bootstrap_files:launcher
    family: linux
    python_screen: false
    timeout: 60

  - name: copy the launcher in
    scp: ["bootstrap-launcher.sh", "/tmp/bootstrap-launcher.sh"]
    timeout: 300

  - name: install the launcher
    ssh: |
      set -e
      install -m 0755 /tmp/bootstrap-launcher.sh ~/bootstrap-launcher.sh
      mkdir -p ~/.config/systemd/user
      cat > ~/.config/systemd/user/org.vm.bootstrap.service <<'UNIT'
      [Unit]
      Description=Run ~/shared/bootstrap.sh at login

      [Service]
      Type=oneshot
      ExecStart=%h/bootstrap-launcher.sh

      [Install]
      WantedBy=default.target
      UNIT
      systemctl --user daemon-reload
      systemctl --user enable org.vm.bootstrap.service
      echo INSTALLED_FOR_NEXT_LOGIN
    timeout: 300

  # THE UNIT HAS TO BE ENABLED AND HAS TO NAME THE LAUNCHER. A unit file that is well formed and
  # points at nothing is found at the next boot, on a published disk - which is the failure this
  # catches while the disk is still here.
  - name: prove the launcher is installed
    ssh: |
      set -e
      ls -l ~/bootstrap-launcher.sh ~/.config/systemd/user/org.vm.bootstrap.service
      grep -q bootstrap-launcher.sh ~/.config/systemd/user/org.vm.bootstrap.service
      systemctl --user is-enabled org.vm.bootstrap.service
      test "$(systemctl --user is-enabled org.vm.bootstrap.service)" = "enabled"
    timeout: 60

  # THE MACHINE IS STOPPED BY THE STAGE, over ssh, for the reason macOS' file records: this
  # guest owns the real disk and its filesystem is what gets published, so a kill would leave the
  # last writes in the page cache. lib/vm_session.stop() is the one that does it, and it is
  # outside this file because it needs the MachineSession that started the guest.

#cloud-config
# Ubuntu Server, installed unattended by subiquity.
#
# THE FIRST LINE IS NOT A COMMENT. cloud-init dispatches on it, and a document that does
# not start with `#cloud-config` is ignored - subiquity then drops to the interactive
# installer, which on a bake with no screen is indistinguishable from a hang.
#
# WHAT THIS DOES NOT TRY TO DO
#
# It does not choose a desktop. This is the server image, and a desktop is a different
# flavour with a different document (linux/kubuntu/user-data-kde.yaml). Keeping them
# separate means a failure names one thing: the server install, or the desktop on top.
#
# WHY THE PACKAGES ARE THIS SHORT
#
# A GitHub Actions runner needs git, a compiler, node and python; openssh-server is what
# the next stage talks to. Anything else is a layer somebody applies later, and a gold
# disk that ships extra services is a gold disk that behaves differently from a plain
# Ubuntu when something goes wrong.

autoinstall:
  version: 1

  # NOT `interactive`. The default is to wait for a human at the confirmation prompt,
  # and with no screen that wait is forever.
  interactive-sections: []

  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Etc/UTC

  identity:
    # The account every image in this repository uses: docker, with admin as the
    # password. The hash below is `openssl passwd -6 admin` - a SHA-512 crypt, which is
    # what subiquity accepts here. A plain-text password is rejected.
    hostname: ubuntu
    username: docker
    password: "$6$pd.PhdrZh4fxnXbv$7LPpeBGe1v5ssVIxdvxvvHUf6uiyJI.jd5N5pyX3/DCy00eGRQ1FJMqCt.uhrUjPWGu2lO.ELB6IOzQpFWOpI/"
    # No ssh key: the next stage authenticates with this password over a forwarded port,
    # and a key here would be a second thing the guest trusts that nothing verifies.

  ssh:
    install-server: true
    # Password authentication stays on because that is how the ssh stage logs in. A disk
    # that only accepted keys would need the key injected into the image, which is a
    # build-time secret this pipeline does not have.

  # ONE PARTITION, THE WHOLE DISK, ext4. Not LVM and not ZFS: the point of this disk is
  # to be a plain Ubuntu, and a layout nobody asked for is a surprise in every later
  # stage that has to mount it.
  storage:
    layout:
      name: direct

  # NO UPDATES AT INSTALL TIME, AND THE KEY IS OMITTED RATHER THAN SET TO A VALUE.
  #
  # `updates: security` runs unattended-upgrades as subiquity's last step, and it was the
  # slowest part of the bake: run 41617045180's log ends on
  #
  #     run_unattended_upgrades: downloading and installing security updates
  #
  # ten minutes in, with the desktop already installed. It also writes two to three
  # gigabytes into the disk for packages a later `apt upgrade` would fetch anyway.
  #
  # `updates: none` DOES NOT WORK, AND IT FAILS IN THE WORST WAY. subiquity accepts only
  # `security` and `all`; anything else makes the whole document malformed:
  #
  #     finish: subiquity/Updates/load_autoinstall_data: Malformed autoinstall in
  #             'updates' section
  #     An error occurred. Press enter to start a shell
  #
  # and the installer sits at a prompt nobody answers while the bake polls a disk that
  # stays at 0 MiB. Run 41626200897 lost nine minutes to that.
  #
  # Leaving the key out is the supported way to say "do not update": the field's default
  # is empty. A gold disk is a starting point, not a patched fleet member.

  # ---------------------------------------------------------------------------
  # THE TOOLCHAIN, AND WHY EACH ENTRY IS HERE
  # ---------------------------------------------------------------------------
  packages:
    # WHAT THE SYSTEM NEEDS, NOT WHAT THE PIPELINE NEEDS.
    #
    # git, build-essential, python3, pip, curl, jq and unzip were here, and they made the
    # bake do two jobs at once: install a distribution, and put a toolchain on it. A bake
    # failure and a broken toolchain then look the same from outside, and adding a package
    # meant a forty-minute re-install.
    #
    # They are installed by linux/tools.py against the disk this bake publishes - a ten
    # minute stage that can be re-run without re-installing the system.
    #
    # WHAT STAYS IS WHAT THE SYSTEM IS:
    - openssh-server        # the ssh stage has to have something to talk to
    # --- the desktop ---------------------------------------------------------
    #
    # THIS USED TO BE A SERVER AND THAT WAS THE WRONG ANSWER TO "bake a disk you can
    # look at". A plain Ubuntu Server finishes at a text login prompt - there is no
    # GNOME, no display manager, nothing for a screenshot test to find - so a bake that
    # waited for a desktop would wait for ever, and one that accepted "the installer
    # rebooted" was accepting a disk nobody had ever seen run.
    #
    # ubuntu-desktop-minimal rather than ubuntu-desktop: the minimal metapackage is
    # GNOME, gdm3, the session and the settings modules, without the office suite and
    # the games. The difference is about 1.2 GiB of packages for nothing this disk needs.
    - ubuntu-desktop-minimal
    # THE DISPLAY DRIVER HAS TO MATCH THE ADAPTER, AND IT DID NOT.
    #
    # lib/vm.py gives this guest `-device VGA,xres=...,yres=...,vgamem_mb=32` - a
    # standard VGA adapter. KDE's document asked for xserver-xorg-video-qxl, which is
    # the driver for QXL, a different card. With no driver for the card it has, X falls
    # back to whatever it can find or fails to start at all, and the symptom is a black
    # screen after a login prompt that never arrives.
    #
    # vesa and fbdev both drive a standard VGA adapter; vesa is the one that works
    # before any kernel mode setting is available, fbdev after. Having both means X
    # comes up whichever path it takes.
    - xserver-xorg-video-vesa
    - xserver-xorg-video-fbdev
    - mesa-utils

  late-commands:
    # A NETPLAN THAT DOES NOT DEPEND ON WHAT THE INSTALLER GUESSED.
    #
    # There is no `network:` section above, so subiquity writes the target's netplan from
    # its OWN view of the machine - the interface name it saw in the installer's initramfs.
    # The installed system enumerates PCI in a different order, so that name can differ, and
    # when it does the disk boots to a login prompt with NO network at all:
    #
    #     [ FAILED ] Failed to start systemd-networkd-wait-online.service
    #     ... and not one `enp*` or `eth*` line in the whole console
    #
    # which is what runs 42205282393 and 42192264451 both did. The bake then failed its ssh
    # check with "No route to host" - and because the SECOND boot had no console until
    # 1b6fbc7, that looked like a disk that would not start.
    #
    # `match: {name: "en*"}` binds the config to whatever the kernel calls the virtio NIC,
    # so the name cannot disagree with the machine. DHCP is what the installer itself used.
    - >-
      curtin in-target -- sh -c "printf '%s\n' 'network:' '  version: 2' '  ethernets:'
      '    primary:' '      match:' '        name: en*' '      dhcp4: true' '      dhcp6: false'
      '      optional: true' > /etc/netplan/50-easydiskbake.yaml;
      chmod 0600 /etc/netplan/50-easydiskbake.yaml"
    # THE INSTALLER'S OWN FILE, IF IT WAS WRITTEN, IS REMOVED. Two netplan files that
    # disagree is a coin toss decided by filename order, and 50-easydiskbake must be the
    # only one that names an interface.
    - curtin in-target -- sh -c "rm -f /etc/netplan/00-installer-config.yaml /etc/netplan/00-installer-config.yaml.disabled || true"

    # SSH ON BOOT, WITH THE PORT THE REST OF THIS PIPELINE USES. Ubuntu's sshd listens
    # on 22; the host forwards 2222 to it (lib/vm.py). Nothing here changes the port -
    # this only makes sure the service is enabled, because `install-server: true`
    # installs it without starting it on first boot in every release.
    - curtin in-target -- systemctl enable ssh

    # AUTOLOGIN, BECAUSE A DISK THAT STOPS AT A GREETER HAS NO DESKTOP ON IT.
    #
    # Run 41671039091's second boot was healthy in every other way:
    #
    #     ssh answers after 21s
    #     sessions (id|type|class|active):
    #         ['1|unspecified|manager-early|yes', '72|tty|user|yes',
    #          '73|unspecified|manager|yes', 'c1|wayland|greeter|yes']
    #     === NO ACTIVE USER WAYLAND SESSION ===
    #
    # That `c1|wayland|greeter` is gdm sitting on its login screen. The Wayland session it
    # runs belongs to the greeter, not to docker, so the launch check correctly refused it
    # - the desktop had not started because nobody had logged in.
    #
    # GDM reads its configuration from /etc/gdm3/custom.conf and the keys are
    # [daemon] AutomaticLogin{,Enable}. Written with a here-doc rather than an echo so the
    # section header and the two keys cannot be mangled by quoting, and with `install` so
    # the mode is right for a file gdm reads at boot.
    - curtin in-target -- sh -c 'printf "%s\n" "[daemon]" "AutomaticLoginEnable=True" "AutomaticLogin=docker" > /etc/gdm3/custom.conf'

    # PASSWORDLESS sudo, BECAUSE THE LAUNCH CHECK RUNS `sudo ls` WITH NO TTY.
    #
    # subiquity puts identity.username in the sudo group, which still asks for a
    # password. Over ssh with no terminal there is nowhere to type it, so the
    # command fails silently and the check reports a missing Wayland socket on a
    # system whose socket is right there. Run 41675028701 is that: kwin_wayland
    # running with --socket wayland-0, and "NO WAYLAND SOCKET IN /run/user/1000".
    - curtin in-target -- sh -c 'printf "%s\n" "docker ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/90-docker-nopasswd'
    - curtin in-target -- chmod 0440 /etc/sudoers.d/90-docker-nopasswd

    # NO CLOUD-INIT ON THE FINISHED DISK. An installed system that still runs cloud-init
    # looks for a datasource on every boot and waits for one that is not there. The
    # install is done; the mechanism that did it is not part of the result.
    - curtin in-target -- touch /etc/cloud/cloud-init.disabled

    # THE PASSWORD IS NOT SET HERE, AND THAT LINE USED TO BREAK THE ONE IN identity.
    #
    # It read:
    #
    #     - curtin in-target -- usermod -p "$6$pd.PhdrZh...$7LPpeBGe..." docker
    #
    # late-commands are run by a SHELL, and a double-quoted crypt hash is full of `$`
    # signs that the shell reads as variables. All three of `$6`, `$pd` and
    # `$7LPpeBGe1v5ssVIxdvxvvHUf6uiyJI` expand to nothing, so usermod was handed
    #
    #     .PhdrZh4fxnXbvLPpeBGe1v5ssVIxdvxvvHUf6uiyJI.jd5N5pyX3/...
    #
    # and that became docker's password. The `identity` block above was correct all
    # along; this line overwrote it with a hash of nothing.
    #
    # The symptom is exactly what run 41665165958 saw on its second boot:
    #
    #     === SSH DID NOT ANSWER IN 600s ===
    #       last output: Permission denied, please try again.
    #
    # sshd was up, the network was up, the account existed - and its password was wrong.
    # That reads as a network problem and was a quoting problem.
    #
    # Removing the line rather than quoting it: `identity` already sets the password, and
    # a second write of the same value is a second thing that can disagree. If a future
    # release stops honouring `identity`, the bake's ssh check will say so directly.

    # THE REPO'S CONVENTION, RECORDED IN THE DISK. A disk that says what made it can be
    # told apart from one built by something else, without a manifest beside it.
    - curtin in-target -- sh -c "echo 'built by easydiskbake linux-ubuntu' > /etc/easydiskbake"


  shutdown: reboot

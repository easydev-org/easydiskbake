# OpenBSD's autoinstall answer file, at /etc/install.conf on the installed system.
#
# HOW THIS REACHES THE INSTALLER
#
# `bsd.rd` (the RAM-disk kernel on install80.iso) reads install.conf from a disk it can
# find, or the responder fetches it from a URL. The URL form is what this bake uses:
#
#     set image /8.0/amd64/install80.iso
#     ...
#
# No: the ISO carries no HTTP server. The transport is an EXTRA FAT IMAGE that the
# installer looks at, and the file on it is named install.conf. lib/bsdinstall.py writes
# that image with mtools, which is why the bake needs no ISO rebuild - and that matters,
# because rebuilding a 832 MiB ISO to change one text file is minutes of rsync-like work
# per bake.
#
# THE SYNTAX IS ONE DIRECTIVE PER LINE, and the responder reads it top to bottom. There
# are no sections and no quoting: a value runs to the end of its line.

# --- the medium ------------------------------------------------------------
# The installer asks which disk set to use. `http` would need a mirror; `disk` is the
# ISO the machine booted from, which is already attached and already verified.
Install from disk

# --- the disk --------------------------------------------------------------
# THE WHOLE DISK, ONE PARTITION, AUTO LAYOUT. The alternative is `custom`, which asks
# for a disklabel interactively - exactly what a bake cannot answer.
#
# Which disk: the machine has one virtio disk and OpenBSD names it sd0. The ISO is a
# cdrom and is not a candidate, so there is nothing to disambiguate.
Use the whole disk
sd0

# --- the sets --------------------------------------------------------------
# bsd.rd asks for a comma-separated list. `*` is every set on the medium, which includes
# X11 - and X11 is what a desktop needs, so it is not trimmed.
*
# The installer then asks whether to install the X11 sets; the answer is the same list.

# --- the network -----------------------------------------------------------
# THE HOSTNAME IS THE FIRST QUESTION THE RESPONDER ASKS.
# The interface is vio0 - OpenBSD's virtio-net name. dhcp is what lib/vm.py's user-mode
# network answers to; there is no static address and none is wanted, because the bake
# reaches the guest through a forwarded port on the host side.
vio0
dhcp
# No IPv6, no DNS override: the defaults the installer offers are correct for a machine
# that only has to reach the host's port forward.

# --- sshd ------------------------------------------------------------------
# ON, AND WITH PASSWORD AUTHENTICATION, because the next stage has the password and does
# not have a key. This is the same trade every image in this repository makes.
sshd=yes
# OpenBSD's own answer to "do you want sshd to start at boot" is this rc.conf.local line,
# and it is the ONLY place a bake needs to say so - the installer writes it.

# --- the account -----------------------------------------------------------
# THE SAME ACCOUNT AS EVERY OTHER IMAGE HERE. root logs in with admin; the installer
# creates no other user, so this bake adds one below with a doas rule, which is OpenBSD's
# sudo.
# root password
admin
# Root shell: the default ksh is fine and is what every OpenBSD document assumes.

# --- the timezone ----------------------------------------------------------
# UTC, so a disk behaves the same wherever it is booted. The installer accepts a zone
# name here.
UTC

# --- what happens at the end -----------------------------------------------
# The installer reboots when it finishes. NOT `halt`: a halted machine leaves the boot
# blocks unwritten on some media, and the disk is the artifact.
# (No directive needed - rebooting is the default and the bake detects the guest exiting.)

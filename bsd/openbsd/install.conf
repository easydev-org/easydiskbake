# OpenBSD 8.0 autoinstall(8) response file.
#
# NOT READ BY THIS BAKE, AND THAT IS WORTH SAYING PLAINLY.
#
# It was described as "the answers, which bsd.rd reads when it is booted as an installer",
# and that is not true of a file at /etc/install.conf on a CD. autoinstall(8) fetches its
# response over HTTP using DHCP options, or reads /auto_install.conf from bsd.rd's OWN
# RAMDISK - both of which require patching the ramdisk, which this bake does not do. A file
# on the ISO's filesystem is never opened.
#
# The bake drives the installer by typing at its serial console instead (bsd/openbsd/
# bake.py's answers()). This file is kept as the record of the same answers in the format
# autoinstall(8) documents, so that a person booting the medium by hand has something to
# follow, and so the two lists can be compared when one of them is wrong.
#
# THE FORMAT IS `question = answer`, and the question is a non-ambiguous part of what the
# installer prints, without the question mark. Values match answers() exactly.

Terminal type = vt220
System hostname = openbsd
Which network interface = vio0
IPv4 address for vio0 = dhcp
IPv6 address for vio0 = none
Start sshd by default = yes
Start ntpd by default = yes
Which disk is the root disk = sd0
Use (W)hole disk = W
Use (A)uto layout = a
Location of sets = cd0
Set name(s) = *
What timezone are you in = UTC
Password for root = admin
Password for root (again) = admin

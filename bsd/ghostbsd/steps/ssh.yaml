# Stage three for bsd-ghostbsd-mate: put sshd on THIS disk and prove ssh works.
#
#     python3 lib/steps.py bsd/ghostbsd/steps/ssh.yaml --qmp /work/drive.sock.qmp --ssh-port 2222
#
# WHY THIS FILE IS PER-DISTRIBUTION AND NOT ONE SHARED WALK
#
# Because the four things it does differ on every image, and a shared file would have to be
# written as a table of exceptions - which is what a per-distribution file already is, only
# with the exceptions where a reader can see them.
#
# WHAT DIFFERS, FOR THIS ONE
#
#     terminal    ctrl+alt+t, the session's own emulator
#     install    sysrc sshd_enable=YES
#     enable     service sshd restart || service sshd start
#     firewall   no pf rules are loaded by default on this image
#
# FREEBSD HAS NO sudo, so this walk uses `su -m root` and MATE's terminal. Its `sshd_enable` is an rc.conf knob, not a systemd unit, so the wait sees the daemon only after `service sshd start`.
#
# THE THREE ACTIONS ARE THE SAME EVERYWHERE, WHICH IS WHY THE SHAPE IS THE SAME:
#
#     run:          open this session's terminal and type the install
#     require_ssh:  wait for the daemon it enabled (the step macOS's own ssh.yaml added)
#     ssh:          run a command IN THE GUEST over the forwarded port - an exit status
#
# THE TRANSPORT IS THE DESKTOP. These disks have no getty on ttyS0 - measured on run
# 42551299241, whose console said `BdsDxe: starting Boot0001` and then nothing - so `run:`
# is the only way in.

name: bsd-ghostbsd-mate - sshd

resolution: [1920, 1080]

vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: docker

steps:
  # =======================================================================================
  # 1. THE INSTALL, TYPED INTO THIS SESSION'S OWN TERMINAL
  # =======================================================================================
  #
  # `run:` presses ctrl+alt+t to open the terminal, waits `terminal_wait`, types the text,
  # presses Return and waits `settle`. Every number here is this image's: a desktop that has
  # just painted has not started its session yet, so the wait comes before the shortcut.
  # =======================================================================================
  # 0b. THE TERMINAL, WHICH IS WHERE THE INSTALL IS TYPED
  # =======================================================================================
  #
  # ctrl+alt+t is this desktop's own shortcut. The step EXISTS on its own - rather than being
  # folded into the `run:` - because "did the terminal open" is the first question when an
  # install produces nothing, and the recording now answers it.
  # =======================================================================================
  # 0. THE GREETER, IF THIS DISK STOPS AT ONE
  # =======================================================================================
  #
  # GhostBSD's launch has so far photographed a MATE desktop rather than a greeter - its
  # gbi install sets no display-manager autologin, but the session has come up unasked. That
  # is luck rather than a guarantee: the same image on a slower runner can land on lightdm.
  #
  # `optional` for exactly that reason: on the desktop it is a click on the wallpaper and a
  # typed password that goes nowhere, and on a greeter it is the login.
  #
  # THE BOX IS NOT IN THE MIDDLE - IT IS AT THE LEFT, AND (960,640) WAS THE WALLPAPER.
  #
  # Measured on run 42573082305's own recording, the frame at t=20:
  #
  #     user tile      `docker`, rounded panel at x=88..432
  #     password box   white field   x=101..418  y=554..583   centre (259, 568)
  #
  # LightDM on MATE anchors this greeter top-left, not centred, so the press at (960,640)
  # landed on a mountain. The typed password went nowhere, the greeter timed out, and the
  # screen was black for the rest of the run.
  - name: greeter - the password box
    at: [259, 568]
    settle: 2
    optional: true

  - name: greeter - log in
    type: "{{ password }}"
    settle: 3
    optional: true

  - name: greeter - submit
    key: ret
    settle: 20
    optional: true

  # MATE HAS NO ctrl+alt+t BY DEFAULT, AND THIS IS THE PROOF.
  #
  # t=120 of the same recording is a MATE desktop with `docker's Home` on it - the login had
  # worked all along - and t=210 is BLACK: the screensaver had taken the screen while the
  # walk pressed a shortcut MATE does not bind. The terminal never opened.
  #
  # So the screen is woken first, and then the terminal is opened the way MATE actually does
  # it: the `Applications` menu at the top left, then `System Tools` -> `Terminal`. Both
  # presses are measured from that same frame (the menu bar runs along y=12).
  - name: wake the screen
    key: esc
    settle: 4

  - name: wake the screen again
    key: esc
    settle: 3

  - name: open the applications menu
    at: [72, 12]
    settle: 5

  - name: system tools
    at: [120, 60]
    settle: 4

  - name: terminal
    at: [160, 120]
    settle: 12

  - name: install sshd
    run: |
      echo {{ password }} | su -m root -c "sysrc sshd_enable=YES; service sshd restart || service sshd start" 2>&1
    terminal_wait: 0
    settle: 90
  - name: wait for sshd
    require_ssh: true
    timeout: 600

  # =======================================================================================
  # 3. THE PROOF, AND IT IS THIS GUEST ANSWERING OVER THE FORWARDED PORT
  # =======================================================================================
  - name: prove the kernel over ssh
    ssh: uname -a
    timeout: 120

  - name: prove the account over ssh
    ssh: id -un; hostname
    timeout: 120

  # MATE'S OWN sshd IS THE rc.conf ONE, so the wait only succeeds once
  # `service sshd start` has run - which the install step above does.

# Unattended configuration for MX Linux's installer, gazelle-installer (minstall).
#
# The manpage (src/man/minstall.1) documents the mode this relies on:
#
#   --auto           Install automatically using the configuration file
#   -c, --config <f> Load a configuration file. Default /etc/minstall.conf.
#   -f, --poweroff   Shut down automatically when done installing
#   --tui            Text interface (ncurses)
#
# and app.cpp checks for --tui BEFORE constructing a QApplication, so the install
# runs on the serial console with no display server.
#
# EVERY KEY HERE IS TAKEN FROM THE SOURCE. The first version of this file was wrong
# in a way the installer reports only as a dialog:
#
#   [!] Invalid settings found in configuration file
#       Please review marked fields as you encounter them.
#
# That came from autopart.cpp:
#
#   config.manageComboBox("System", gui.comboDriveSystem, true);
#   config.manageComboBox("Home",   gui.comboDriveHome,   true);
#   ...
#   bool AutoPart::validate(...) { if (!drvsystem || !drvhome) return false; }
#
# In other words [Storage] System is THE DRIVE TO INSTALL ON, not a filesystem
# type. The first draft had "System = ext4", so no drive was selected, validate()
# returned false, and the installer waited on a dialog nobody could answer.
#
# The file is an INI with [Section] headers, not dotted keys.
#
# MSettings wraps MIni, which has beginGroup() and a bracket parser - "Incomplete
# bracket set, empty section" are its own error strings. So the shape is:
#
#   [Section]
#   Key = value
#
# and manageComboBox writes plain strings, matching each drop-down entry by its
# itemData.

[Storage]
# The drive to install on. This is the key autopart.cpp reads:
#
#   config.manageComboBox("System", gui.comboDriveSystem, true);
#
# and manageComboBox marks the widget bad when findData() does not match:
#
#   if (icombo >= 0) combo->setCurrentIndex(icombo);
#   else markBadWidget(combo);
#
# which is what produced "[!] Invalid settings found in configuration file".
# The VALUE is the device name WITHOUT /dev/. partman.cpp builds every drive from
# lsblk's JSON:
#
#   const QString &jdName = jsonDrive["name"].toString();   // "vda"
#   const QString &jdPath = jsonDrive["path"].toString();   // "/dev/vda"
#   drive->name = jdName;
#
# and addToCombo stores that name as the item's data:
#
#   combo->addItem(QIcon(stricon), friendlyName(), name);
#
# so findData("/dev/vda") matches nothing while findData("vda") matches. That is the
# whole of the invalid-settings dialog.
System = vda
# The live session's home is not carried across.
OldHomeAction = new
# No encryption: nothing to protect on a bake disk, and a LUKS prompt is one more
# thing that would block an unattended install.
Encrypt = false

[GRUB]
Install = true
# A three-way radio: MBR, ESP, or the root partition. MBR is what a BIOS-booted qemu
# needs, and the smoke test boots under BIOS.
TargetType = MBR
# Same reason as Storage.System: bootman.cpp puts the drive list into the combo the
# same way, so the value is the device name without /dev/.
Location = vda
HostSpecific = false
# The serial console has to survive the boot, or the smoke test reads GRUB and then
# nothing until its deadline.
GRUB_CMDLINE_LINUX_DEFAULT = console=ttyS0,115200n8

[User]
Username = docker
UserPass = admin
RootPass = admin
Autologin = true
EnableRoot = true

[Localization]
Locale = en_US.UTF-8
Timezone = UTC

[Network]
ComputerName = mx-sandbox

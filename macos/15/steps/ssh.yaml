# macOS 15 ssh: turn Remote Login on through System Settings, then prove it from the host.
#
#     python3 lib/steps.py macos/15/steps/ssh.yaml --qmp /work/drive.sock.qmp --ssh-port 2222
#
# THIS IS THE STAGE THE `ssh:` STEP WAS ADDED FOR, AND IT IS THE CLEAREST CASE FOR EITHER
# MECHANISM BEING RIGHT.
#
# The first half is GUI and cannot be anything else: `systemsetup -setremotelogin on` is refused
# by TCC, and `launchctl` does not expose "Allow full disk access for remote users" - so the two
# switches have to be pressed in System Settings. macos/15/ssh.py records six runs of
# diagnostics that proved it.
#
# The second half is the opposite: once sshd answers, everything worth asserting is a command.
# "Is the port open", "does `sw_vers` run", "is the build the one we installed" are exit codes,
# not words on a screen - and a word on a screen is a weaker answer than a return code.
#
# SO THE FILE HAS A BOUNDARY IN IT, VISIBLE AT THE LINE WHERE `at:` STOPS AND `ssh:` STARTS.
# That boundary is exactly where Remote Login comes on, and a reader can see it.
#
# WHY THE GUI HALF IS STEPS AND NOT `python:`
#
# It used to be a Python step, argued for on two grounds - and both of them turn out to be
# expressible as a step, so it is now eleven of them with no code at all:
#
#   the search field      "has to be clicked AFTER Spotlight has drawn, and a click that
#                         arrives first leaves the pane on the Sharing overview" - that is a
#                         `settle:` of ten seconds, which is exactly what ssh.py did. The
#                         value is the measurement; the code was only holding it.
#   full disk access      IS ALREADY ON. Turning Remote Login on turns it on with it, and
#                         clicking it again turns it OFF - which is the bug that made the
#                         clean fail with `diskutil apfs trim WAS REFUSED`. The answer is not
#                         code: it is simply NOT A STEP. The sequence does not click it, and
#                         `the switch is on` reads the pane afterwards to prove the switch
#                         that DOES matter moved.
#
# The one thing that stayed in code is the state check at the top - "is sshd already
# answering" - because the switch is a TOGGLE and pressing it on a machine that is already on
# turns it off. That is a read followed by a decision, and it needs a socket, not a click.

name: macos 15 remote login
resolution: [1920, 1080]
# This is a sequence, not a pane set: the settings window does not skip panes, and each step
# depends on the one before it having landed.
vars:
  user:
    from: args.user
    default: docker
  password:
    from: args.password
    default: admin

steps:
  # --- 1. THE GUI, WHICH IS THE ONLY WAY TO TURN THIS ON --------------------------------
  #
  # `systemsetup -setremotelogin on` is refused by TCC and launchctl does not expose
  # "Allow full disk access for remote users", so the switch has to be pressed in System
  # Settings. Every coordinate and every wait below is a measurement from ssh.py, moved here
  # unchanged - the sequence is clicks and waits, and it never needed to be code.
  #
  # THE ESC IS THE FIRST ACTION, and it is not cosmetic: a notification banner or the keyboard
  # hint swallows the next keystroke, and this guest has just come from a login window.
  - name: dismiss anything over the desktop
    key: esc
    settle: 2

  # SPOTLIGHT, BY ITS FULL NAME. A short query's first row can be a web suggestion, and Return
  # takes the highlighted row - so "system settings", not "settings".
  - name: open spotlight
    key: meta_l+spc
    settle: 4
  - name: type the settings app name
    type: system settings
    settle: 7
  - name: open it
    key: ret
    settle: 14

  # THE WINDOW HAS TO BE UP BEFORE ANYTHING IS TYPED INTO IT, and every click below assumes a
  # layout that only exists once it is. Spotlight on a cold CI runner takes longer to resolve
  # than the four seconds above, and a Return that arrives too early opens whatever row was
  # highlighted - on one measured run that was a web suggestion, which opened Safari.
  #
  # This waits for the window's own title and is `optional` because a slow window is not a
  # failure yet: the clicks below are the real test, and this only costs time when it is right.
  - name: the settings window is up
    until_any:
      - [system, settings]
      - [general]
      - [wi-fi]
    timeout: 90
    poll: 3
    optional: true

  # THE SEARCH FIELD, AT ITS MEASURED PIXEL. (715, 267) is the centre of a box whose interior
  # spans x 630..800, y 250..284 at 1920x1080.
  - name: search for remote login
    at: [715, 267]
    settle: 2
  - name: type the search
    type: remote login
    settle: 10

  # THE RESULT ROW. The list puts "Sharing" as a header and "Remote Login" under it, and the
  # pane has to finish swapping - that swap is a whole page of layout, and a click that
  # arrives first selects the sidebar item while the right side still shows Sharing's
  # overview, putting every later click on a list row.
  - name: open the remote login pane
    at: [703, 336]
    settle: 12

  # THE SWITCH. It reads "Off" until it is pressed, and pressing it also turns
  # `Allow full disk access for remote users` ON - which is why nothing below presses that
  # one: pressing it again would turn it off, and a remote session without Full Disk Access
  # cannot run `diskutil` (measured: 'diskutil apfs trim WAS REFUSED (exit 1)').
  - name: turn remote login on
    at: [1145, 353]
    settle: 4

  # THE PANE SAYS SO. This is the read-only check the old Python step took a frame for, and
  # as a step it is also the one that fails loudly when the switch did not move.
  - name: the switch is on
    until_any:
      - [remote, login, on]
      - [allowing, remote, users]
    timeout: 60
    poll: 3
    optional: true

  # DONE, so the pane closes and the daemon settles rather than holding the change in a sheet.
  - name: close the pane
    at: [1145, 679]
    settle: 5

  # --- 2. THE HOST SIDE, WHERE EVERY ANSWER IS AN EXIT STATUS ---------------------------
  #
  # `require_ssh` waits for the daemon the step above just enabled, and reports how long it
  # took. It replaces the flat `wait: 120` this stage used to have, which was the weakness
  # ssh.py's own docstring names.
  - name: wait for sshd
    require_ssh: true
    timeout: 600

  # THE FIRST REAL PROOF. `sw_vers` is the guest answering a question about itself; a daemon
  # that accepted the TCP connection and then closed it on the password packet - which is what
  # six runs of diagnostics were about - fails here and nowhere earlier.
  - name: prove the build
    ssh: sw_vers -productVersion

  - name: prove the account
    ssh: id -un

  # THE DISK HAS TO BE REPAIRABLE BY LATER STAGES, and this is the check that a remote session
  # really does have the privilege the GUI switch granted. Without Full Disk Access, `diskutil`
  # is refused here - which is the failure that made this stage hard in the first place, so it
  # is asserted rather than assumed.
  - name: prove disk utility works over ssh
    ssh: diskutil list | head -5

  # THE MACHINE'S OWN NAME - AND `scutil` NEEDS ROOT FOR EVERY NAME IT SETS.
  #
  # Measured on the live guest: `scutil --set LocalHostName docker` answers
  #
  #     Permission denied.
  #
  # so the LocalHostName is not the unprivileged alternative it looks like. The password goes
  # through `sudo -S` on STDIN - `printf` in a pipe, not a here-string, because the remote shell
  # is `sh` and `<<<` is a bash extension that fails with "unexpected redirection".
  #
  # It is also `optional`: this step names the disk, it does not prove anything, and a naming
  # failure must not fail a stage whose real evidence is the three checks above it.
  - name: name the machine
    ssh: printf '%s\n' "{{ password }}" | sudo -S scutil --set LocalHostName docker
    optional: true

  # --- 3. A READ-MEANT-TO-FAIL IS NOT A FAILURE -----------------------------------------
  #
  # `optional` exists for exactly this: a check whose negative result is information. It is
  # used here to record what is NOT installed, so a later reader knows the disk never had it
  # rather than guessing from a silence.
  - name: note what is absent
    ssh: command -v brew || true
    optional: true

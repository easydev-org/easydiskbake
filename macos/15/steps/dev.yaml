# macOS 15 stage four: the developer toolchain, on a disk that already answers ssh.
#
#     python3 lib/steps.py macos/15/steps/dev.yaml --qmp /work/drive.sock.qmp --ssh-port 2222
#
# WHY THIS STAGE CAN BE ALL ssh: AND THE EARLIER ONES COULD NOT
#
# The ssh stage could not, because sshd was what it was creating. By this point the disk
# answers on a forwarded port, so everything below is ordinary remote work: no keyboard, no
# coordinates, no frames to read. That is the entire reason the stages are ordered
# desktop -> ssh -> dev.
#
# WHAT IS HERE, AND THE ORDER, WHICH IS NOT ALPHABETICAL
#
#     Xcode         FIRST, because Homebrew's installer checks for a compiler and its fallback
#                   is `sudo xcode-select --install` - a GUI prompt nobody can click over ssh
#     Homebrew      macOS ships no package manager; without one the disk cannot install
#                   anything later
#     git node      from Homebrew, because the system git is a stub and the system python3's
#     python        pip refuses to write (externally-managed-environment) - see section 4
#     cmake jq gh
#
# WHY XCODE IS NOT `brew install --cask xcode`
#
# WHY XCODE IS NOT `brew install --cask xcode`
#
# Because Apple's download endpoint refuses an unauthenticated request:
#
#     HTTP/2 302   location: https://developer.apple.com/unauthorized/
#
# measured on 2026-11-09, and the cookie trick that used to mint an `ADCDownloadAuth` now
# returns 403 as well. A CI job that needs a person's Apple ID and a 2FA code is a job that
# cannot run unattended, so the .xip comes from archive.org - which keeps Apple's own file
# byte for byte, and whose recorded sha1 is the same number Apple's release index publishes:
#
#     Xcode 26.3 Universal   sha1 cebf05ec2920111830af5e08a45f07961e36bfd6
#
# lib/xcode_asset.py refuses the download unless the bytes match, which is what makes this
# "Apple's file from an archive" rather than "a mirror, hopefully".
#
# WHY 26.3 AND NOT THE NEWEST
#
# Apple raises Xcode's minimum macOS with almost every release and the installer enforces
# it. 26.3 requires macOS 15.6; 26.4 requires macOS 26.2. This disk is Sequoia, so 26.3 is
# its ceiling - a later one would download 2.7 GiB and then refuse to install.
#
# WHY THE XIP IS COPIED IN RATHER THAN DOWNLOADED IN THE GUEST
#
# The guest reaches the internet through this container's NAT, and this container's
# outbound HTTPS goes through a proxy the guest knows nothing about. Downloading on the
# host means the proxy, the sha1 check and the retry all happen where they are already
# solved, and the guest only ever sees bytes that were verified. `xcode_fetch` is the
# step that does it; `scp` is the step that copies it; both name their numbers.

name: macos 15 - developer toolchain
resolution: [1920, 1080]

vars:
  user:
    from: args.user
    default: docker
  password:
    from: args.password
    default: admin

ssh_user: docker
ssh_port: 2222

steps:
  # --- 1. THE DISK HAS TO ANSWER BEFORE ANY OF THIS IS WORTH DOING ---------------------
  #
  # A banner is not a login: session.wait_for_ssh runs a command, because a socket that
  # accepts a connection and then refuses authentication is a different failure and has
  # been one here before.
  - name: wait for sshd
    require_ssh: true
    timeout: 900

  # --- 2. XCODE FIRST, BECAUSE HOMEBREW NEEDS A COMPILER AND WILL TRY TO POP A DIALOG -----
  #
  # Homebrew's installer checks for the command line tools and, finding none, runs
  #
  #     sudo xcode-select --install
  #
  # which is a GUI prompt. Over ssh there is nobody to click it, so the install script waits
  # and the stage times out with no clue why. Xcode ships the same tools (its clang IS the
  # toolchain), so putting it first means `xcode-select -p` already answers when Homebrew
  # looks.
  #
  # IT ALSO PUTS THE BEST FAILURE FIRST. A bad .xip stops the stage in ten minutes instead of
  # after forty minutes of brew.
  #
  # Fetched and verified on the host, then copied in. The sha1 is Apple's own number for this
  # build (see lib/xcode_asset.py); a byte that differs stops the step before 2.7 GiB has been
  # moved into a guest.
  #
  # THE DESTINATION IS THE USER'S HOME, not /tmp: this is a 2.7 GiB file on a disk that is
  # about to be published, and the step after it deletes the .xip once the app is expanded.
  - name: fetch xcode on the host
    python: macos_dev_asset:fetch_xcode

  - name: copy xcode into the guest
    python: macos_dev_asset:copy_xcode

  # EXPANDING AND SELECTING IS ONE SCRIPT BECAUSE IT IS ONE OPERATION. `xip -x` prints nothing
  # for twenty minutes, `xcodebuild -license accept` must come before anything asks Xcode a
  # question, and `-runFirstLaunch` installs the SDKs (another ten). Split into steps, a
  # failure in the middle leaves a selected Xcode with no SDK - which answers --version and
  # cannot build, the worst of both.
  - name: expand and select xcode
    script: |
      #!/bin/bash
      # THE PASSWORD IS AN ARGUMENT BECAUSE SUDO OVER SSH HAS NO TTY. See the note in
      # install-xcode.sh: `sudo` on this channel answers "a password is required" and the
      # expand/move/select step is where that would first bite.
      bash /Users/{{ user }}/install-xcode.sh /Users/{{ user }}/Xcode.xip '{{ password }}' /Applications /Users/{{ user }}/xcode-expand
    script_shell: sh
    script_name: run-xcode-install.sh
    timeout: 7200

  # THE .XIP IS 2.7 GiB AND THE DISK IS PUBLISHED. Leaving it behind makes every later artifact
  # bigger for a file nothing reads again.
  - name: remove the xip
    ssh: rm -f /Users/{{ user }}/Xcode.xip && df -h / | tail -1
    timeout: 300

  # --- 3. HOMEBREW, WHICH IS THE PREREQUISITE RATHER THAN ONE OF THE ENTRIES -------------
  #
  # macOS ships no package manager. Homebrew is what the ecosystem uses, and a disk without
  # one cannot install anything else later - which is why it is here at all and why the
  # installer's own "already installed" path is relied on rather than guarded against: it
  # exits 0 and says so.
  #
  # THE INSTALLER IS RUN AS THE ACCOUNT, NOT AS ROOT, and on this architecture it writes
  # /usr/local - which it must be allowed to create. `NONINTERACTIVE=1` stops the two
  # questions it would otherwise ask (confirm, and press Return); the CLT question cannot be
  # asked because Xcode answered it above.
  #
  # IT IS NOT STARTED WHEN THE TOOLS ARE ALREADY PRESENT, because the installer's fallback for
  # a missing compiler is exactly the dialog this stage cannot answer.
  - name: install homebrew
    script: |
      #!/bin/bash
      set -uo pipefail
      for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
        if [ -x "$candidate" ]; then
          echo "brew is already installed at $candidate"
          "$candidate" --version
          exit 0
        fi
      done

      # THE DEVELOPER DIRECTORY HAS TO RESOLVE OR HOMEBREW WILL TRY TO INSTALL THE TOOLS.
      if ! xcode-select -p >/dev/null 2>&1; then
        echo "=== xcode-select -p DOES NOT ANSWER; HOMEBREW WOULD ASK FOR A GUI ==="
        exit 1
      fi
      echo "developer dir: $(xcode-select -p)"

      NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" 2>&1 | tail -25

      for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
        if [ -x "$candidate" ]; then
          echo "brew at $candidate"
          "$candidate" --version
          exit 0
        fi
      done
      echo "=== HOMEBREW IS NOT USABLE ==="
      exit 1
    script_shell: sh
    script_name: install-homebrew.sh
    timeout: 2400

  # --- 4. THE PACKAGES, ONE STEP PER FORMULA SO THE FAILURE NAMES IT ---------------------
  #
  # NODE AND PYTHON COME FROM HOMEBREW, AND THAT IS A DECISION RATHER THAN A DEFAULT.
  #
  #   the system python3   ships with the command line tools and its pip refuses to write:
  #                        `error: externally-managed-environment`, and installing into it
  #                        needs sudo. A runner that cannot `pip install` is not a runner.
  #   the system git       is a stub that forwards to the same tools, so it exists but is not
  #                        the one `brew` manages - and a second `git` on PATH is how two
  #                        answers to "which git" start.
  #
  # So both are formulas, which is also what makes them upgradable on the published disk.
  #
  # THE PATH IS PREFIXED ON EVERY USE, AND THAT IS NOT COSMETIC. The installer writes
  # /opt/homebrew/bin into a shell profile and a `ssh host command` shell does not source one,
  # so without this prefix `python3` resolves to /usr/bin/python3 and `--version` still
  # succeeds. A check that only asked for a version number would pass on the wrong interpreter;
  # `prove the toolchain` asks `command -v` for the path.
  #
  # `brew install` is idempotent - a second run says "already installed" and exits 0 - so a
  # resumed bake costs nothing here.
  - name: install git
    ssh: export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; brew install git && command -v git && git --version
    timeout: 1800
  - name: install node
    ssh: export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; brew install node && command -v node && node --version && npm --version
    timeout: 1800
  - name: install python
    ssh: export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; brew install python && command -v python3 && python3 --version && pip3 --version
    timeout: 1800
  - name: install cmake
    ssh: export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; brew install cmake && cmake --version
    timeout: 1800
  - name: install jq
    ssh: export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; brew install jq && jq --version
    timeout: 900
  - name: install gh
    ssh: export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; brew install gh && gh --version
    timeout: 900


  # --- 5. THE PROOFS ------------------------------------------------------------------
  #
  # A brew exit code says an installer ran. These ask the disk.
  #
  # THE CHECK IS THE PATH, NOT THE VERSION, AND THAT IS THE WHOLE POINT OF THIS STEP.
  # `/usr/bin/python3` exists on every macOS and answers `--version` perfectly - it is the
  # one Xcode's command line tools install, and its pip refuses to write. A stage that only
  # printed a version number would report success while leaving a disk whose python cannot
  # install anything. So every tool has to resolve UNDER the Homebrew prefix.
  - name: prove the toolchain
    script: |
      #!/bin/bash
      set -uo pipefail
      export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH
      bad=0
      for t in git node npm python3 pip3 cmake jq gh; do
        path=$(command -v "$t" 2>/dev/null || true)
        if [ -z "$path" ]; then
          echo "MISSING  $t"
          bad=1
          continue
        fi
        case "$path" in
          /opt/homebrew/*|/usr/local/*)
            echo "ok       $t -> $path"
            ;;
          *)
            echo "WRONG    $t -> $path (not from Homebrew)"
            bad=1
            ;;
        esac
      done
      if [ "$bad" -ne 0 ]; then
        echo "=== THE TOOLCHAIN IS NOT THE ONE HOMEBREW INSTALLED ==="
        exit 1
      fi
      python3 --version
      node --version
      echo "TOOLCHAIN_OK"
    script_shell: sh
    script_name: prove-toolchain.sh
    timeout: 300

  - name: prove xcode is selected
    ssh: xcode-select -p && xcodebuild -version
    timeout: 300

  # SWIFT IS THE REASON XCODE IS HERE RATHER THAN THE COMMAND LINE TOOLS. A selected Xcode
  # with no SDK answers `swift --version` and cannot compile; this compiles.
  - name: prove swift compiles
    script: |
      #!/bin/bash
      set -uo pipefail
      work=$(mktemp -d)
      cat > "$work/hello.swift" <<'SWIFT'
      print("hello-from-swift")
      SWIFT
      if ! swiftc "$work/hello.swift" -o "$work/hello"; then
        echo "SWIFT_COMPILE_FAILED"
        exit 1
      fi
      "$work/hello" || exit 1
      echo "SWIFT_OK"
      rm -rf "$work"
    script_shell: sh
    script_name: swift-check.sh
    timeout: 1800

  - name: note what is present
    ssh: export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH; echo "brew=$(brew --version | head -1)"; echo "node=$(node --version)"; echo "python=$(python3 --version)"; echo "swift=$(swift --version 2>&1 | head -1)"; echo "xcode=$(xcodebuild -version | head -1)"
    timeout: 300

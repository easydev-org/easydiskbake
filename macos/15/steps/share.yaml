# A host directory the guest can mount, and a login hook that runs a script from it.
#
#     python3 lib/steps.py macos/15/steps/share.yaml --ssh-port 2222
#
# WHY THIS IS ITS OWN STAGE, BEFORE THE TOOLCHAIN
#
# Because it does not need one. The share is an SMB mount and the launcher is `/bin/sh`; neither
# wants python, node or Xcode. Splitting it out means a failure here is about the share rather
# than about a 2.7 GiB download, and the two can be re-run independently.
#
# WHAT THE LOGIN HOOK RUNS IS `~/shared/bootstrap.sh`, WHICH THE PERSON PUTS THERE. Nothing on
# this disk is required to make it work - that is the whole point of using the shell the guest
# already has rather than a toolchain installed two stages later.
#
# THIS FILE INSTALLS NOTHING ELSE. No package manager, no compiler, no interpreter. If a step
# here needs something that is not in a stock macOS, it is in the wrong file.

name: macos 15 - host share and login hook
resolution: [1920, 1080]

vars:
  user:
    from: args.user
    default: docker
  password:
    from: args.password
    default: admin

ssh_user: docker
ssh_port: 2222

steps:
  - name: wait for sshd
    require_ssh: true
    timeout: 900

  # THE SHARE, SERVED BY THE HOST AND MOUNTED HERE.
  #
  # SMB rather than 9p or virtiofs for the reason lib/hostshare.py records at length: Windows has
  # no 9p driver at all and macOS's 9p client is read-only, so SMB is the only protocol both
  # guests speak natively, read and write, with nothing installed.
  - name: mount the host share
    share_mount: true
    share_family: macos
    timeout: 180

  # A MOUNT THAT REPORTS SUCCESS AND A DIRECTORY THAT IS EMPTY ARE DIFFERENT FACTS.
  - name: prove the share is readable and writable
    ssh: |
      ls -la ~/shared | head -20 && printf 'written-by-%s\n' "$(hostname)" > ~/shared/from-guest.txt && cat ~/shared/from-guest.txt
    timeout: 120

  # THE LOGIN HOOK. A LaunchAgent in ~/Library/LaunchAgents is loaded by launchd at the next
  # graphical login - which is exactly when this is meant to run, and there is no gui domain to
  # load it into from an ssh session (see the note in lib/steps.py).
  - name: install the bootstrap launcher
    bootstrap_install: true
    share_family: macos
    timeout: 300

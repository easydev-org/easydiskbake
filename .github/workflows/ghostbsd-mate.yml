name: ghostbsd-mate

# Install GhostBSD from its official ISO, through gbi - its GTK graphical installer.
#
# WHY GHOSTBSD AND NOT FREEBBSD
#
# FreeBSD has no graphical installer. bsdinstall draws dialog(1) menus on a text console, and
# freebsd.yml already installs through its `script` target - which bsd/freebsd/installerconfig
# calls the same path as the menu wizard with the prompts skipped. There is no GUI to drive
# there, so freebsd.yml is unchanged.
#
# GhostBSD is FreeBSD with a desktop and its own GTK installer. It is the BSD-family entry that
# actually has a graphical install path, which makes it the one worth having a GUI workflow for.
#
# ONE WORKFLOW PER DESKTOP IMAGE, BECAUSE THEY ARE DIFFERENT DOWNLOADS.
#
# GhostBSD publishes two: the default (MATE, `GhostBSD-<release>.iso`) and an XFCE spin
# (`GhostBSD-<release>-XFCE.iso`). They are the same base with a different desktop, so
# `ghostbsd-mate.yml` and `ghostbsd-xfce.yml` are the same driver and the same flow - each
# pinned to its own file and its own sha256, which is the only thing that differs besides
# the tag it publishes under.
#
# THIS IS THE MATE ONE.
#
# UEFI, AND THAT IS NOT OPTIONAL. GhostBSD's loader is built for an EFI system partition; with
# SeaBIOS the image drops to a loader prompt instead of the installer. The frame runs on the
# same OVMF pair the macOS stages use, which is in the bake image.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      bake_run:
        description: "Install GhostBSD through gbi"
        type: boolean
        default: true
      release:
        description: "GhostBSD release (the ISO name carries it)"
        default: "24.10.1"
      iso_url:
        description: "ISO URL (empty for the pinned MATE image)"
        default: ""
      iso_sha256:
        description: "ISO sha256 (empty for the pinned value)"
        default: ""
      disk_size:
        description: "guest disk size"
        default: "64G"
      install_timeout:
        description: "seconds the installer may take"
        default: "5400"
      publish_tag:
        description: "tag to publish under; empty for bsd-ghostbsd-mate"
        default: "bsd-ghostbsd-mate"
      boot_timeout:
        description: "stage 2: seconds the booted disk has to reach its desktop"
        default: "900"
      launch_run:
        description: "stage 2: boot the finished disk and check the desktop comes up"
        type: boolean
        default: true
      publish:
        description: "publish the finished disk to ghcr"
        type: boolean
        default: true

concurrency:
  group: ghostbsd-mate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    if: inputs.bake_run
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ghostbsd-mate-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix bsd-

      - name: fetch the ISO
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ghostbsd-mate-iso
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out/iso
            # FROM ghcr, which is what artifacts-publish exists for: the image was fetched
            # once, verified three ways, and pushed as `iso-ghostbsd-mate`. This is a CDN pull.
            python3 lib/fetch_iso.py ghostbsd-mate "out/iso/GhostBSD-24.10.1.iso"

      - name: install through gbi
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ghostbsd-mate-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=2
            ISO=$(ls out/iso/*.iso | head -1)
            echo "iso: $ISO"
            python3 bsd/ghostbsd/install.py \
              --iso "$ISO" \
              --out out/ghostbsd-mate.qcow2 \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout "${{ inputs.install_timeout || '5400' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostbsd-mate-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: push the disk
        if: success() && inputs.publish
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/ghostbsd-mate.qcow2
          kind: bsd-ghostbsd-mate
          tag: ${{ inputs.publish_tag || 'bsd-ghostbsd-gui' }}
          token: ${{ github.token }}

  # ===========================================================================
  # STAGE TWO - BOOT THE DISK AND SEE THE DESKTOP. See lib/launch_linux.py.
  # ===========================================================================
  #
  # THE BAKE PROVES THE INSTALL; THIS PROVES THE ARTEFACT. A disk whose bootloader was never
  # written installs perfectly and then does nothing, and the only way to see it is to start
  # the disk with no installer attached - which is what this job does, through the same
  # lib/launch_linux.py the answer-file bakes use.
  #
  # IT PULLS FROM ghcr RATHER THAN TAKING AN ARTIFACT, because a 5 GiB file through the
  # artifact store is slower than the registry and expires. That is why the bake must publish
  # for this job to have anything to start.
  #
  # `--ssh skip` IS STAGE THREE'S QUESTION, NOT THIS ONE. None of these images carries sshd -
  # no GUI driver installs it - so this stage asks whether the desktop comes up, and the frame
  # is its verdict where no session exists to read.
  launch:
    needs: [bake]
    if: |
      always() && inputs.launch_run && inputs.bake_run
      && needs.bake.result == 'success' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      packages: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: launch it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ghostbsd-mate-launch
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/launch_linux.py \
              --tag "${{ needs.bake.outputs.tag || 'bsd-ghostbsd-mate' }}" \
              --kind ghostbsd-mate \
              --ssh skip \
              --artifacts "out/ghostbsd-mate-launch" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostbsd-mate-launch
          path: |
            out/ghostbsd-mate-launch/launch.txt
            out/ghostbsd-mate-launch/console.log
            out/ghostbsd-mate-launch/screen.png
          if-no-files-found: warn
          retention-days: 14

name: garuda-gui

# Install Garuda Linux from its official Live ISO, through Calamares, its graphical
# installer.
#
# GARUDA'S MEDIUM IS MISO, NOT ARCHISO. Its live session opens `Install Garuda Linux` as a
# desktop icon and runs Calamares; the boot is the ISO's own, with no kernel command line
# written by this workflow. A hand-written archiso line sends this image to an emergency
# shell - measured:
#
#     dracut-mount[358]: Warning: Can't mount root filesystem
#     Entering emergency mode.
#
# so the firmware finds the El Torito entry and the image boots exactly as it would on a
# USB stick. The same rule is why ubuntu-gui, fedora-gui and opensuse-gui boot the medium
# whole.
#
# THE MACHINE IS UEFI. lib/uefi.py attaches OVMF for every GUI driver here, and Garuda is
# the distribution that made it mandatory: on the BIOS path it refuses outright ("not
# booted in UEFI mode ... unsupported") and its partitioning falls back to MBR without an
# ESP.
#
# MANUAL ONLY: an installer driven by synthetic clicks is not something to run on every push.

on:
  workflow_dispatch:
    inputs:
      bake_run:
        description: "Install Garuda Linux through its graphical installer"
        type: boolean
        default: true
      iso_url:
        description: "ISO URL (empty for the pinned image)"
        default: ""
      iso_sha256:
        description: "ISO sha256 (empty for the pinned value)"
        default: ""
      disk_size:
        description: "guest disk size"
        default: "64G"
      install_timeout:
        description: "seconds the installer may take"
        default: "5400"
      publish_tag:
        description: "tag to publish under; empty for linux-garuda-gui"
        default: "linux-garuda-gui"
      publish:
        description: "publish the finished disk to ghcr"
        type: boolean
        default: true

concurrency:
  group: garuda-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    if: inputs.bake_run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: garuda-gui-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix linux-

      - name: fetch the Live ISO
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: garuda-gui-iso
          interval: "10"
          command: |
            set -euo pipefail
            URL="${{ inputs.iso_url }}"
            SHA="${{ inputs.iso_sha256 }}"
            if [ -z "$URL" ]; then
              URL="https://iso.builds.garudalinux.org/iso/garuda/kde-lite/260819/garuda-kde-lite-linux-garuda-260819.iso"
              SHA="686b69d506bcfa105cd09b873e6e6e5b7b5b5a45a72c7ed974f4999d5e682764"
            fi
            mkdir -p out/iso
            ISO_URL="$URL" ISO_SHA256="$SHA" DEST="out/iso/garuda-kde-lite-linux-garuda-260819.iso" \
              python3 lib/fetch_vendor_iso.py --segments 8

      - name: install through Calamares
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: garuda-gui-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=2
            ISO=$(ls out/iso/*.iso | head -1)
            echo "iso: $ISO"
            python3 linux/garuda-gui/install.py \
              --iso "$ISO" \
              --out out/garuda-gui.qcow2 \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout "${{ inputs.install_timeout || '5400' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-gui-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: push the disk
        if: success() && inputs.publish
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/garuda-gui.qcow2
          kind: linux-garuda-gui
          tag: ${{ inputs.publish_tag || 'linux-garuda-gui' }}
          token: ${{ github.token }}

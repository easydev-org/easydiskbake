name: artifacts-publish

# Download every pinned upstream artifact this repository needs, verify it, and push it to
# this repository's own ghcr package.
#
#     ghcr.io/easydev-org/easydiskbake:iso-windows11
#     ghcr.io/easydev-org/easydiskbake:macos-asset-opencore
#     ghcr.io/easydev-org/easydiskbake:macos-recovery-sequoia
#     ghcr.io/easydev-org/easydiskbake:sysimg-android-15-aosp
#
# ONE WORKFLOW, FOUR GROUPS. This replaces iso-publish, macos-assets-publish,
# macos-recovery-publish and android-15_aosp-publish. All four downloaded a pinned URL,
# verified it and pushed it to the same package; the differences were which table the pins
# came from and how the file is obtained, and neither of those needs a workflow of its own.
#
#     iso        the installer images every bake starts from           (20 artifacts)
#     macos      OpenCore, its template, and the two OVMF blobs        ( 4)
#     recovery   Apple's recovery images, one per macOS release        ( 3)
#     android    an AVD built from Google's AOSP system image          ( 1)
#
# lib/publish_artifacts.py is the dispatcher: it owns the tag-to-group table, the ordering
# and the keep-going behaviour, and each publisher keeps the code only it can have. See its
# docstring for why the fetching is NOT shared - a macOS recovery image is a session cookie,
# a five-field POST and a token exchange, and an AVD is a directory rather than a file.
#
# MANUAL ONLY. These are pinned inputs: they change when a version is deliberately bumped, so
# running this is a decision rather than a side effect of a commit.

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which group to publish"
        type: choice
        options:
          - all
          - iso
          - macos
          - recovery
          - android
        default: all
      which:
        description: >-
          One exact tag, overriding `group`. Empty publishes the group. The tags are listed
          by `python3 lib/publish_artifacts.py --list`.
        default: ""
      keep:
        description: "Keep the downloaded files on the runner (they are otherwise deleted after push)"
        type: boolean
        default: false

concurrency:
  group: artifacts-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # ANDROID - a job of its own, on the runner, because it needs a DIFFERENT image.
  # ===========================================================================
  #
  # avdmanager refuses to create an AVD unless the SDK's `emulator` package is present, and
  # the bake image does not carry the SDK - by the time a bake runs, the AVD already exists
  # and was published to ghcr. Shipping 1.5 GB of JDK, sdkmanager and system image into
  # every Windows and Linux bake to use it once is the trade android/15/Containerfile.builder
  # exists to avoid.
  #
  # So this cannot share the `publish` job below, which runs INSIDE the bake image (and a
  # container job cannot start another container). It runs on the runner and starts the
  # builder image with docker, which is what the workflow this replaced did. That is also
  # why the failure was "emulator package must be installed": the group was routed through
  # the bake image, where it never could have worked.
  android:
    # `all` and `android` both include it; a `which` includes it only when it names a
    # sysimg- tag, because every other tag belongs to the job below.
    if: |
      inputs.group == 'all'
      || inputs.group == 'android'
      || startsWith(inputs.which, 'sysimg-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          # The AVD is built and packed here; nothing is booted for that, but the emulator's
          # first start is, so KVM is required.
          kvm: true
          disk-gb: '20'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-prepare
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            python3 lib/android_pin.py

      - name: build the AVD and publish it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-avd
          interval: "20"
          command: |
            set -euo pipefail
            # THE BUILDER IMAGE, NOT THE BAKE ONE. See the job's comment.
            docker run --rm \
              --device /dev/kvm \
              --volume "$PWD:/repo:ro" \
              --volume "$PWD/out:/out" \
              --workdir /out \
              --env GITHUB_TOKEN="${{ github.token }}" \
              --env GITHUB_ACTOR="${{ github.actor }}" \
              --env GITHUB_REPOSITORY="${{ github.repository }}" \
              ghcr.io/${{ github.repository }}:android-builder \
              python3 /repo/lib/publish_android.py \
                --image sysimg:android-15-aosp \
                --artifacts /out \
                --repository "${{ github.repository }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-recording
          path: |
            out/install.mp4
            out/last-frame.png
            out/emulator.log
          if-no-files-found: warn
          retention-days: 14

  publish:
    # THE `iso`, `macos` AND `recovery` GROUPS; android is the job above.
    #
    # A `which` THAT NAMES A sysimg- TAG BELONGS TO THE ANDROID JOB TOO - `which` overrides
    # `group`, so `--which sysimg-android-15-aosp` with group=all would otherwise reach this
    # job and fail on the emulator package the same way.
    if: |
      !startsWith(inputs.which, 'sysimg-')
      && (inputs.which != '' || inputs.group != 'android')
    runs-on: ubuntu-latest
    # A full run fetches twenty installer images and three recovery images - a few hours of
    # downloads. A single group is well under this.
    timeout-minutes: 300
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: false
          # THE RECOVERY IMAGES ARE THE LARGE ONES: Apple serves ~900 MiB per release and the
          # publisher verifies before pushing, so the file and its copy both exist.
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: artifacts-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            # THE WHOLE CATALOGUE IS PRINTED FIRST, so the run says what it is about to do
            # rather than only what it did.
            echo "=== the catalogue, tag and group ==="
            python3 lib/publish_artifacts.py --list

      - name: publish
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: artifacts-publish
          interval: "30"
          command: |
            set -euo pipefail
            # GITHUB_TOKEN is what lib/iso.py authenticates with when it pushes, and what
            # lib/ci.py login has already exchanged for a registry session.
            export GITHUB_TOKEN="${{ github.token }}"

            # THE SELECTION IS RESOLVED IN PYTHON, NOT IN SHELL. `which` wins over `group`,
            # and an unknown tag fails with the list of real ones - a shell branch would have
            # to reproduce that logic in a second place.
            #
            # `--all` HERE MEANS EVERY GROUP BUT ANDROID, which is a separate job. Passing
            # `--all` would make this job try to build an AVD inside the bake image and fail
            # on the emulator package - the failure this split exists to remove.
            if [ -n "${{ inputs.which }}" ]; then
              ARGS="${{ inputs.which }}"
            elif [ "${{ inputs.group }}" = "all" ]; then
              ARGS="--group iso --group macos --group recovery"
            else
              ARGS="--group ${{ inputs.group }}"
            fi

            KEEP=""
            if [ "${{ inputs.keep }}" = "true" ]; then KEEP="--keep"; fi

            # KEEP GOING, BECAUSE ONE UPSTREAM SHOULD NOT COST THE OTHERS.
            #
            # Run 41567486415 stopped at iso-cachyos on a 403 and never published the rest,
            # and the failed ones are always a mirror being briefly wrong rather than a pin
            # that is broken. --keep-going attempts everything and reports the failures at
            # the end, which is the only list that matters when the run is over.
            python3 lib/publish_artifacts.py $ARGS $KEEP --keep-going \
              --repository "${{ github.repository }}"

      - name: what is in the package
        if: always()
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: artifacts-listing
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix iso-
            python3 lib/ci.py tags --prefix macos-
            python3 lib/ci.py tags --prefix sysimg-

name: tests

# Run the unit tests, in the same image every bake uses.
#
# WHY THIS DID NOT EXIST UNTIL NOW, AND WHY THAT MATTERED
#
# tests/ has held several hundred assertions for a while and nothing ran them. Every
# "unittest passed" in a commit message was a local run, which means a test could not
# fail unless somebody remembered to run it - and several regressions that those tests
# describe (the FAT32 cluster floor, the bootindex, the raster size) were found in CI
# instead, by a bake doing twenty minutes of work.
#
# WHAT RUNS IN THE CONTAINER RATHER THAN ON THE RUNNER
#
# The image is the environment: qemu, mtools, 7z and the firmware live there, and a test
# that asks qemu whether it accepts a device has to ask the same qemu the bake uses.
# tests/test_qemu_devices.py skips itself when qemu is missing, so running on the bare
# runner would silently skip the checks most likely to catch the next device-string bug.
#
# NO KVM NEEDED. Nothing here boots a guest; `-S` and a timeout are how the qemu tests
# ask their question without starting one.
#
# MANUAL ONLY, like every other workflow here - but this one costs forty seconds and is
# the cheapest thing in the repository to run.

on:
  workflow_dispatch:
  # A push is a reasonable trigger for a job this size, unlike a bake. Commented out
  # rather than absent, so enabling it is one line and an obvious decision.
  # push:
  #   branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: unittest
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: unittest
          interval: "10"
          command: |
            set -euo pipefail
            # Which python and which qemu, so a failure is attributable: the tests ask
            # qemu questions, and "qemu is not installed" turns those into skips.
            python3 --version
            command -v qemu-system-x86_64 && qemu-system-x86_64 --version | head -1
            command -v qemu-img && qemu-img --version | head -1

            # -v so the log names each test rather than only the failures, and no
            # -f: a single broken import should not hide the other files.
            python3 -m unittest discover -s tests -v 2>&1 | tail -400

      # A count that can be compared between runs. The suite grows; a run that reports
      # fewer tests than the last one has lost a file somewhere.
      - name: how many
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: unittest-count
          interval: "10"
          command: |
            set -euo pipefail
            python3 -m unittest discover -s tests 2>&1 | tail -3

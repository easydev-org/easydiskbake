name: redox-desktop_575-ssh

# Log in to a baked Redox disk over ssh, as the account this repository uses.
#
# WHY THIS IS A STAGE OF ITS OWN
#
# The launch stage proves a disk boots and an sshd answers. A banner is not a login: the
# port can be open and the account unusable, and that is a different bug from a disk that
# does not boot. Keeping them apart means a failure here says "the account" and never "the
# boot", which is the whole reason this repository separates its stages.
#
# WHAT IS ASKED, AND WHY EACH ONE
#
#     echo $USER      the account that was written into /etc/users.toml is the one logging
#                     in, not a default
#     id              the uid/gid the file gave it
#     echo $SHELL     ion, the shell Redox runs; a bash prompt here would mean the account
#                     came from somewhere else
#     hostname        redox, from /etc/hostname in the vendor configuration
#     ls /usr/bin/sshd   something from /usr/bin runs, so a later stage can rely on PATH
#
# THE PASSWORD COMES FROM THE BAKE. It is `admin`, the value this repository uses
# everywhere. If the bake wrote a different one, this fails with "Permission denied" - an
# authentication error, which is what it is - rather than a timeout.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The disk to log in to (a tag in this package)"
        default: "redox-desktop"
      boot_timeout:
        description: "Seconds to wait for sshd to accept the login"
        default: "600"
      mem:
        description: "Guest memory in MB"
        default: "2048"

concurrency:
  group: ssh-redox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      packages: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-ssh-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 8
            # THE PASSWORD IS WHAT THE LOGIN NEEDS, so the client that supplies it has to
            # exist. Assert it here rather than discover its absence as a timeout.
            if ! command -v sshpass >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -qq sshpass
            fi
            sshpass -V | head -1
            python3 lib/ci.py tags --prefix redox-

      - name: log in
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-ssh
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            python3 redox/ssh.py \
              --tag "${{ inputs.tag || 'redox-desktop' }}" \
              --artifacts out/redox-ssh \
              --boot-timeout "${{ inputs.boot_timeout || '600' }}" \
              --mem "${{ inputs.mem || '2048' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-ssh
          path: |
            out/redox-ssh/ssh.txt
            out/redox-ssh/boot.ppm
          if-no-files-found: warn
          retention-days: 14

      - name: the verdict
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-ssh-verdict
          interval: "10"
          command: |
            set -euo pipefail
            echo "=== redox ssh ==="
            if [ -f out/redox-ssh/ssh.txt ]; then
              cat out/redox-ssh/ssh.txt
            else
              echo "no verdict was written"
            fi

name: bench-encode

# How big is an hour of recorded install, really?
#
# Estimates are not good enough here: the size of a screen recording depends almost
# entirely on how much of the screen changes, and an installer is mostly a progress bar
# that does not. So measure, on frames this pipeline actually produces.
#
# Both steps go through log-stream: the capture takes a couple of minutes and the
# encode matrix takes longer, and neither is worth watching after the fact.

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: capture real frames
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: bench-frames
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            mkdir -p out && cd out
            GITHUB_TOKEN="${{ github.token }}" python3 ../lib/capture.py frames

      - name: encode matrix
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: bench-encode
          interval: "15"
          command: |
            set -euo pipefail
            cd out
            python3 ../lib/bench_encode.py frames

      - name: keep the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-encode
          path: |
            out/t_*.mp4
            out/frames/frame-0000.ppm
          if-no-files-found: warn
          retention-days: 7

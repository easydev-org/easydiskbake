name: manjaro

# Install Manjaro Linux 26.1.0 KDE from its official Live ISO, through Calamares, its graphical installer.
#
# Manjaro's live session opens `Manjaro Hello`, whose `Launch installer`
# button starts its own build of Calamares. Three of its panes differ from
# every other Calamares here: the footer is 7 px higher on Office Suite, that
# pane's list has a highlight that is NOT a selection, and the Users pane has
# two separate password pairs because `use the same password for the
# administrator account` ships unchecked.
#
# THE MEDIUM IS BOOTED AS ITS OWN BOOTLOADER INTENDS - no -kernel, no -initrd, no
# hand-copied command line. Those were tried and cost two runs: an added `copytoram`
# filled the guest's memory from the ISO's own squashfs, and a guessed
# `archisobasedir=garuda` sent Garuda to an emergency shell because its medium is miso,
# not archiso. The ISO's own grub.cfg has both right, and the firmware finds it through
# the El Torito catalog.
#
# THE MACHINE IS UEFI. On the BIOS path Garuda refuses outright ("not booted in UEFI
# mode ... unsupported") and produced disks with an MBR and no ESP. Booting the medium on
# OVMF is what its own images expect, and it is what lib/uefi.py attaches.
#
# MANUAL ONLY: an installer driven by synthetic clicks is not something to run on every push.

on:
  workflow_dispatch:
    inputs:
      bake_run:
        description: "Install Manjaro Linux 26.1.0 KDE through Calamares"
        type: boolean
        default: true
      iso_url:
        description: "ISO URL (empty for the pinned image)"
        default: ""
      iso_sha256:
        description: "ISO sha256 (empty for the pinned value)"
        default: ""
      disk_size:
        description: "guest disk size"
        default: "64G"
      install_timeout:
        description: "seconds the installer may take"
        default: "5400"
      publish_tag:
        description: "tag to publish under; empty for linux-manjaro"
        default: "linux-manjaro"
      boot_timeout:
        description: "stage 2: seconds the booted disk has to reach its desktop"
        default: "900"
      ssh_from:
        description: "stage 3: a published tag to put sshd on instead of the bake's output"
        default: ""
      ssh_run:
        description: "stage 3: install sshd on the disk and prove the forwarded port answers"
        type: boolean
        default: true
      ssh_port:
        description: "stage 3: the host port forwarded to the guest's 22"
        default: "2222"
      vm_configure_run:
        description: "stage 4: name the machine, mount the share, install the guest agent"
        type: boolean
        default: true
      vm_configure_from:
        description: "stage 4: a published tag to configure instead of the ssh stage's output"
        default: ""
      vm_configure_tag:
        description: "stage 4: tag to publish under; empty for TAG-vm"
        default: ""
      hostname:
        description: "stage 4: the machine's name; empty for easyvm-<8 random characters>"
        default: ""
      vm_configure_boot_timeout:
        description: "stage 4: seconds the configured disk has to answer ssh"
        default: "1800"
      launch_run:
        description: "stage 2: boot the finished disk and check the desktop comes up"
        type: boolean
        default: true
      publish:
        description: "publish the finished disk to ghcr"
        type: boolean
        default: true

concurrency:
  group: manjaro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    if: inputs.bake_run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: manjaro-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix linux-

      - name: fetch the Live ISO
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: manjaro-iso
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out/iso
            # FROM ghcr, which is what artifacts-publish exists for: the image was fetched
            # once, verified three ways, and pushed as `iso-manjaro-kde`. This is a CDN pull.
            python3 lib/fetch_iso.py manjaro-kde "out/iso/manjaro-kde-26.1.0-260812-linux71.iso"

      - name: install through Calamares
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: manjaro-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=2
            ISO=$(ls out/iso/*.iso | head -1)
            echo "iso: $ISO"
            python3 linux/manjaro/install.py \
              --iso "$ISO" \
              --out out/manjaro.qcow2 \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout "${{ inputs.install_timeout || '5400' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manjaro-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: push the disk
        if: success() && inputs.publish
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/manjaro.qcow2
          kind: linux-manjaro
          tag: ${{ inputs.publish_tag || 'linux-manjaro' }}
          token: ${{ github.token }}

  # ===========================================================================
  # STAGE TWO - BOOT THE DISK AND SEE THE DESKTOP. See lib/launch_linux.py.
  # ===========================================================================
  #
  # THE BAKE PROVES THE INSTALL; THIS PROVES THE ARTEFACT. A disk whose bootloader was never
  # written installs perfectly and then does nothing, and the only way to see it is to start
  # the disk with no installer attached - which is what this job does, through the same
  # lib/launch_linux.py the answer-file bakes use.
  #
  # IT PULLS FROM ghcr RATHER THAN TAKING AN ARTIFACT, because a 5 GiB file through the
  # artifact store is slower than the registry and expires. That is why the bake must publish
  # for this job to have anything to start.
  #
  # `--ssh skip` IS STAGE THREE'S QUESTION, NOT THIS ONE. None of these images carries sshd -
  # no GUI driver installs it - so this stage asks whether the desktop comes up, and the frame
  # is its verdict where no session exists to read.
  launch:
    needs: [bake]
    if: |
      always() && inputs.launch_run && inputs.bake_run
      && needs.bake.result == 'success' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      packages: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: launch it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: manjaro-launch
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/launch_linux.py \
              --tag "${{ needs.bake.outputs.tag || 'linux-manjaro' }}" \
              --kind manjaro \
              --ssh skip \
              --artifacts "out/manjaro-launch" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manjaro-launch
          path: |
            out/manjaro-launch/launch.txt
            out/manjaro-launch/console.log
            out/manjaro-launch/screen.png
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # STAGE THREE - PUT SSHD ON THE DISK AND PROVE THE FORWARDED PORT ANSWERS.
  # ===========================================================================
  #
  # WHY THIS IS A SEPARATE STAGE AND NOT PART OF THE BAKE: the disk that was verified is
  # the disk that ships. Installing sshd during the bake would mean the launch stage was
  # checking a different artifact from the one published.
  #
  # WHY IT IS NEEDED AT ALL: a `-gui` disk is installed by clicking through a desktop
  # installer, and none of those installers puts an ssh package on the target. NixOS'
  # Calamares template says so outright - `# services.openssh.enable = true;`, commented
  # out - and every other desktop ISO here simply does not select one.
  #
  # THE PROOF IS MEASURED FROM OUTSIDE THE GUEST: lib/session.py connects to the forwarded
  # port with the account's password and runs a command. "A port is open" is not the claim;
  # "another container can ssh in and execute something" is.
  ssh:
    needs: [bake]
    # STAGE THREE CAN BE RUN ON ITS OWN, against a tag that is already published.
    #
    # `ssh_from` is what makes that possible, and it is the same shape windows-11.yml uses:
    # the job either follows the bake it depends on, or starts from a tag named by the
    # caller. Without it a stage that only needs a disk could not be re-run without
    # re-running a two-hour install first - which is exactly what was needed to test it.
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != ''
          || (inputs.bake_run && inputs.publish && needs.bake.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # THE FORWARDED PORT 2222 LIVES ON THE BRIDGE ADDRESS, and the DNAT rule that puts it
      # there needs NET_ADMIN - the same three container privileges every guest job has.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: install sshd and prove it answers
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: manjaro-ssh
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/ssh_step.py \
              --tag "${{ inputs.ssh_from || needs.bake.outputs.tag || 'linux-manjaro' }}" \
              --kind manjaro \
              --artifacts out/manjaro-ssh \
              --work out/manjaro-ssh/work \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --publish-out out/manjaro-vm.qcow2

      # THE DISK THIS STAGE MADE IS THE NEXT STAGE'S INPUT, so it is published rather than only
      # archived. The artifact below is the post-mortem; this is the product.
      - name: push the ssh disk
        if: success()
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/manjaro-vm.qcow2
          kind: manjaro-ssh
          tag: ${{ inputs.publish_tag || 'linux-manjaro' }}-ssh
          token: ${{ github.token }}

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manjaro-ssh
          path: |
            out/manjaro-ssh/ssh.txt
            out/manjaro-ssh/work/install.mp4
            out/manjaro-ssh/work/last-frame.png
            out/manjaro-ssh/work/console.log
            out/manjaro-ssh/work/steps/*.png
          if-no-files-found: warn
          retention-days: 14

  # =========================================================================================
  # STAGE FOUR. macOS' vm-configure, for the Linux family.
  # =========================================================================================
  #
  # It runs on the disk the ssh stage published, and it does the three things a finished Linux
  # disk needs before anything is installed on it:
  #
  #     the machine's name        easyvm-<8 random characters>, set with hostnamectl
  #     the host share            ~/shared, mounted from this stage's own smbd
  #     the qemu guest agent      a shutdown that is a request, not a power button
  #
  # It also installs the login launcher, which is what runs ~/shared/bootstrap.sh at the next
  # login - the same contract macOS' stage four installs, through a systemd user unit rather than
  # a LaunchAgent.
  #
  # WHY IT IS A JOB OF ITS OWN AND NOT MORE STEPS ON THE ssh JOB
  #
  # Because it is useful against a disk that already exists. `vm_configure_from` names a tag, so
  # this stage can be re-run without re-running the two-hour install behind it - which is exactly
  # what was needed to write it.
  vm-configure:
    needs: [ssh]
    if: |
      always() && inputs.vm_configure_run
      && (inputs.vm_configure_from != ''
          || (inputs.ssh_run && needs.ssh.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # THE SHARE IS ON THE BRIDGE and the forwarded port needs a DNAT rule, so this job has the
      # same three privileges every guest job has.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.vm_configure_tag || 'linux-manjaro-vm' }}
      hostname: ${{ steps.name.outputs.hostname }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          # THE DISK TWICE PLUS A COPY: vm_configure writes out/<kind>-vm.qcow2 beside the pulled
          # one, and the stage's own work directory holds the console log and frames.
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: manjaro-vm-configure-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix linux-

      - name: pull the ssh disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.vm_configure_from || format('{0}-ssh', inputs.publish_tag || 'linux-manjaro') }}
          dest: out
          token: ${{ github.token }}

      - name: configure the vm (name, share, guest agent)
        id: configure
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: manjaro-vm-configure
          interval: "20"
          command: |
            set -euo pipefail
            # THE STAGE IS THE FILE. Everything this used to call - moving the input disk,
            # building the qemu command line, waiting for sshd, shutting down, compressing
            # the artifact, recording the screen - is a step in vm-configure.yaml, which is
            # the same shape windows/11/steps/ssh.yaml and macos/15/steps/ssh.yaml have.
            # THE PULLED DISK, WHATEVER THE REGISTRY NAMED IT. `oci-pull` writes the artifact
            # under the tag's own name, and a hard-coded path is a second place that has to agree
            # with the publisher. IT HAS TO BE SET BEFORE THE COMMAND, not inside it: a `#` on a
            # line that continues the previous one with a backslash is an ARGUMENT, not a comment,
            # and that is what made all twelve stages fail with
            #
            #     FAILED: this walkthrough boots a machine; --boot-disk is required
            #
            # while the log showed the flag three lines below.
            DISK=$(ls out/*.qcow2 | head -1)
            test -n "$DISK"
            python3 lib/steps.py linux/manjaro/steps/vm-configure.yaml \
              --boot-disk "$DISK" \
              --out out/manjaro-vm-configure.qcow2 \
              --work out/manjaro-vm-configure-work \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.vm_configure_boot_timeout || '1800' }}" \
              | tee out/hostname.txt

      # A PLAIN `run:` STEP, BECAUSE THIS IS WHERE THE NEXT JOB'S NAME COMES FROM. GITHUB_OUTPUT
      # is the runner's own mechanism; routing it through a third-party action would make the
      # chain depend on how that action treats the variable - the same note macos15.yml carries
      # above its own publish step.
      - name: record the machine's name
        id: name
        run: |
          set -euo pipefail
          NAME=$(grep -o "this machine will be named '[^']*'" out/hostname.txt \
                 | sed "s/.*named '//; s/'//")
          test -n "$NAME"
          echo "hostname=$NAME" >> "$GITHUB_OUTPUT"
          echo "the machine is $NAME"

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manjaro-vm-configure-last-frame
          path: |
            out/last-frame.png
            out/hostname.txt
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/manjaro-vm-configure.qcow2
          kind: manjaro-vm-configure
          tag: ${{ inputs.vm_configure_tag || 'linux-manjaro-vm' }}
          token: ${{ github.token }}

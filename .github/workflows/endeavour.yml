name: endeavour

# Install EndeavourOS from its official Live ISO, through Calamares, its graphical
# installer.
#
# THE ENTRY POINT IS ENDEAVOUROS' OWN WELCOME WINDOW. The live session opens `Welcome` with
# an INSTALL tab whose first row is `Start the Installer`; that opens a small
# `Choose installation method` dialog, and OFFLINE is the answer this workflow gives - the
# install then comes from the medium alone, with no mirror round-trip whose contents change
# daily. Calamares opens after that.
#
# THE MEDIUM IS BOOTED AS ITS OWN BOOTLOADER INTENDS - no -kernel, no -initrd, no -append.
# The ISO's grub.cfg carries its volume label and archisobasedir; a hand-written line has
# cost two runs on each driver here that tried it.
#
# THE FOOTER'S COORDINATES ARE THE ENGLISH ONES. Calamares sizes its footer buttons to
# their labels, so `Next` sits 66 px further left when the wizard is translated. On GitHub's
# runners the installer comes up in English - the egress is in the United States and the
# language follows Calamares' own geoip answer - and linux/endeavour/install.py is
# measured against that. There is an `endeavour-probe` workflow that records the language,
# so a change in that assumption shows up as a failing probe rather than as a silent
# mis-click.
#
# UEFI, like every GUI driver here: lib/uefi.py attaches OVMF.
#
# MANUAL ONLY: an installer driven by synthetic clicks is not something to run on every push.

on:
  workflow_dispatch:
    inputs:
      bake_run:
        description: "Install EndeavourOS through its graphical installer"
        type: boolean
        default: true
      iso_url:
        description: "ISO URL (empty for the pinned image)"
        default: ""
      iso_sha256:
        description: "ISO sha256 (empty for the pinned value)"
        default: ""
      disk_size:
        description: "guest disk size"
        default: "64G"
      install_timeout:
        description: "seconds the installer may take"
        default: "5400"
      publish_tag:
        description: "tag to publish under; empty for linux-endeavour"
        default: "linux-endeavour"
      boot_timeout:
        description: "stage 2: seconds the booted disk has to reach its desktop"
        default: "900"
      ssh_from:
        description: "stage 3: a published tag to put sshd on instead of the bake's output"
        default: ""
      ssh_run:
        description: "stage 3: install sshd on the disk and prove the forwarded port answers"
        type: boolean
        default: true
      ssh_port:
        description: "stage 3: the host port forwarded to the guest's 22"
        default: "2222"
      launch_run:
        description: "stage 2: boot the finished disk and check the desktop comes up"
        type: boolean
        default: true
      publish:
        description: "publish the finished disk to ghcr"
        type: boolean
        default: true

concurrency:
  group: endeavour-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    if: inputs.bake_run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: endeavour-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix linux-

      - name: fetch the Live ISO
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: endeavour-iso
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out/iso
            # FROM ghcr, which is what artifacts-publish exists for: the image was fetched
            # once, verified three ways, and pushed as `iso-endeavouros`. This is a CDN pull.
            python3 lib/fetch_iso.py endeavouros "out/iso/EndeavourOS_Titan-Nova-2026.08.15.iso"

      - name: install through Calamares
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: endeavour-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=2
            ISO=$(ls out/iso/*.iso | head -1)
            echo "iso: $ISO"
            python3 linux/endeavour/install.py \
              --iso "$ISO" \
              --out out/endeavour.qcow2 \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout "${{ inputs.install_timeout || '5400' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endeavour-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: push the disk
        if: success() && inputs.publish
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/endeavour.qcow2
          kind: linux-endeavour
          tag: ${{ inputs.publish_tag || 'linux-endeavour' }}
          token: ${{ github.token }}

  # ===========================================================================
  # STAGE TWO - BOOT THE DISK AND SEE THE DESKTOP. See lib/launch_linux.py.
  # ===========================================================================
  #
  # THE BAKE PROVES THE INSTALL; THIS PROVES THE ARTEFACT. A disk whose bootloader was never
  # written installs perfectly and then does nothing, and the only way to see it is to start
  # the disk with no installer attached - which is what this job does, through the same
  # lib/launch_linux.py the answer-file bakes use.
  #
  # IT PULLS FROM ghcr RATHER THAN TAKING AN ARTIFACT, because a 5 GiB file through the
  # artifact store is slower than the registry and expires. That is why the bake must publish
  # for this job to have anything to start.
  #
  # `--ssh skip` IS STAGE THREE'S QUESTION, NOT THIS ONE. None of these images carries sshd -
  # no GUI driver installs it - so this stage asks whether the desktop comes up, and the frame
  # is its verdict where no session exists to read.
  launch:
    needs: [bake]
    if: |
      always() && inputs.launch_run && inputs.bake_run
      && needs.bake.result == 'success' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      packages: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: launch it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: endeavour-launch
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/launch_linux.py \
              --tag "${{ needs.bake.outputs.tag || 'linux-endeavour' }}" \
              --kind endeavour \
              --ssh skip \
              --artifacts "out/endeavour-launch" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endeavour-launch
          path: |
            out/endeavour-launch/launch.txt
            out/endeavour-launch/console.log
            out/endeavour-launch/screen.png
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # STAGE THREE - PUT SSHD ON THE DISK AND PROVE THE FORWARDED PORT ANSWERS.
  # ===========================================================================
  #
  # WHY THIS IS A SEPARATE STAGE AND NOT PART OF THE BAKE: the disk that was verified is
  # the disk that ships. Installing sshd during the bake would mean the launch stage was
  # checking a different artifact from the one published.
  #
  # WHY IT IS NEEDED AT ALL: a `-gui` disk is installed by clicking through a desktop
  # installer, and none of those installers puts an ssh package on the target. NixOS'
  # Calamares template says so outright - `# services.openssh.enable = true;`, commented
  # out - and every other desktop ISO here simply does not select one.
  #
  # THE PROOF IS MEASURED FROM OUTSIDE THE GUEST: lib/session.py connects to the forwarded
  # port with the account's password and runs a command. "A port is open" is not the claim;
  # "another container can ssh in and execute something" is.
  ssh:
    needs: [bake]
    # STAGE THREE CAN BE RUN ON ITS OWN, against a tag that is already published.
    #
    # `ssh_from` is what makes that possible, and it is the same shape windows-11.yml uses:
    # the job either follows the bake it depends on, or starts from a tag named by the
    # caller. Without it a stage that only needs a disk could not be re-run without
    # re-running a two-hour install first - which is exactly what was needed to test it.
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != ''
          || (inputs.bake_run && inputs.publish && needs.bake.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # THE FORWARDED PORT 2222 LIVES ON THE BRIDGE ADDRESS, and the DNAT rule that puts it
      # there needs NET_ADMIN - the same three container privileges every guest job has.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: install sshd and prove it answers
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: endeavour-ssh
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/ssh_step.py \
              --tag "${{ inputs.ssh_from || needs.bake.outputs.tag || 'linux-endeavour' }}" \
              --kind endeavour \
              --artifacts out/endeavour-ssh \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endeavour-ssh
          path: |
            out/endeavour-ssh/ssh.txt
            out/endeavour-ssh/install.mp4
            out/endeavour-ssh/last-frame.png
            out/endeavour-ssh/console.log
            out/endeavour-ssh/steps/*.png
          if-no-files-found: warn
          retention-days: 14

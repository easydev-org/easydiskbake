name: windows11-fixedboot

# EXPERIMENT: can a Windows disk boot with a BLANK OVMF variable store?
#
# Every Windows stage here carries `<job>_bootstate` - an archive holding `windows.vars`, the
# firmware's variable store. The "Windows Boot Manager" entry lives in it and nowhere else, so
# a disk on its own starts like this:
#
#     BdsDxe: failed to load Boot0001 "UEFI Misc Device"  ... : Not Found
#     BdsDxe: loading Boot0005 "EFI Internal Shell"
#     Shell>
#
# WHAT THIS TRIES
#
# UEFI has a standard fallback: `\EFI\BOOT\BOOTX64.EFI` on the EFI System Partition, which the
# firmware tries when no boot entry resolves. Windows puts its loader at
# `\EFI\Microsoft\Boot\bootmgfw.efi` and reaches it only through a Boot#### entry. So this
# copies the loader - and the BCD beside it - to the fallback path, and then boots the disk with
# a FRESH variable store to see whether it works.
#
# THE COPY IS ADDITIVE. Nothing is removed and no existing path changes, so a disk that also has
# its NVRAM entry boots exactly as before. That is what makes the experiment worth running on a
# real bake: the cost of being wrong is that nothing changes.
#
# WHAT THE RESULTS MEAN
#
#     booted with a blank vars      the bootstate can be dropped from the chain, and a
#                                   published disk becomes a single file
#     reached the EFI Shell again   the fallback path is not consulted by this OVMF, or
#                                   bootmgfw.efi needs its own entry; the answer is in the
#                                   frames, and the hypothesis is dead rather than unclear
#
# WHY A SEPARATE WORKFLOW AND NOT A FLAG
#
# This is a question, not a feature. If it works it becomes the bake; if it does not, this file
# is deleted and nothing else has to be reverted. A flag in windows11.yml would leave the answer
# buried in a run of the main chain.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "The base Windows disk to experiment on (a published tag)"
        default: "windows-base-20261103-091730"
      base_bootstate_run:
        description: "The run holding that disk's bootstate - used to boot it the OLD way first"
        default: "41606483154"
      publish_tag:
        description: "Tag for the self-booting disk; empty for windows-base-fixed"
        default: "windows-base-fixed"
      boot_timeout:
        description: "Seconds to wait for the desktop"
        default: "900"
      mem:
        description: "Guest memory in MB"
        default: "6144"

concurrency:
  group: windows11-fixedboot
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # APPLY - convert to raw, write the fallback loader, convert back.
  # ===========================================================================
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.publish_tag || 'windows-base-fixed' }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: fixed-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # the disk, its raw intermediate, and the result. The raw file is sparse - qemu-img
            # convert only writes the clusters that exist - so the peak is roughly three copies
            # of what the disk actually holds, not three times its virtual size.
            # NOTHING IS CONVERTED. fixedboot.py edits the qcow2 through qemu-io, so the peak is the
            # disk plus a 100 MiB ESP - not the three copies of a raw round trip, which is what
            # needed 90 GB and failed in prepare on the standard runner.
            python3 lib/ci.py free-disk --need 25
            for t in qemu-img mcopy mmd; do
              command -v $t >/dev/null || { echo "missing $t"; exit 1; }
            done
            echo "mtools and qemu-img present"

      - name: pull the base disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: fixed-pull
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            python3 windows/11/pull.py "${{ inputs.base_tag }}" out/windows11-fixed.qcow2

      - name: write the fallback loader
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: fixed-apply
          interval: "20"
          command: |
            set -euo pipefail
            python3 windows/11/fixedboot.py --disk out/windows11-fixed.qcow2

      - name: publish
        if: success()
        id: publish
        run: |
          set -euo pipefail
          python3 lib/ci.py install-oras
          python3 lib/ci.py login --registry ghcr.io
          python3 lib/publish_disk.py out/windows11-fixed.qcow2 --kind windows-base-fixed \
            --tag "${{ inputs.publish_tag || 'windows-base-fixed' }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ===========================================================================
  # BOOT IT WITH A FRESH VARIABLE STORE - the actual question.
  # ===========================================================================
  boot_blank:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blank-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # NOTHING IS CONVERTED. fixedboot.py edits the qcow2 through qemu-io, so the peak is the
            # disk plus a 100 MiB ESP - not the three copies of a raw round trip, which is what
            # needed 90 GB and failed in prepare on the standard runner.
            python3 lib/ci.py free-disk --need 25

      # NO BOOTSTATE IS DOWNLOADED. That is the whole experiment: launch_windows.py is given an
      # empty work directory, so qemu starts with the OVMF template's variables, which contain
      # no "Windows Boot Manager" entry.
      - name: launch with a fresh variable store
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blank-boot
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            python3 lib/launch_windows.py \
              --tag "${{ needs.apply.outputs.tag }}" \
              --allow-blank-firmware \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --resolution 1920x1080 \
              --probe-shell --probe-after -1 \
              --artifacts out

      # THE FRAMES ARE THE ANSWER. "It booted" or "it did not" is not a claim this can make from
      # an exit code when the failure mode is a firmware shell that says exactly why.
      - name: keep the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixedboot-frames
          path: |
            out/*.png
            out/*.ppm
            out/launch.txt
            out/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: the verdict
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blank-verdict
          interval: "10"
          command: |
            set -euo pipefail
            echo "=== did it boot with a blank vars? ==="
            if [ -f out/launch.txt ]; then cat out/launch.txt; else echo "no verdict"; fi

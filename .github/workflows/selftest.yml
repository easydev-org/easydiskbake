name: selftest

# Prove the four channels work, on the smallest guest that boots.
#
# This does not bake anything. It answers the question that has to be settled before
# any distribution is worth wiring up: does -vnc answer, does QMP screendump work on a
# second socket, does the framebuffer capture produce frames, and does a host port
# forward reach the guest. Each is a separate moving part and a failure in any of them
# looks like "the bake is slow".
#
# Everything runs through log-stream, so the whole thing is readable while it runs
# rather than after it finishes.

on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '0'
          token: ${{ github.token }}

      - name: the four channels
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: selftest
          interval: "15"
          command: |
            set -euo pipefail
            # THE ENTRY POINTS RUN BEFORE ANYTHING BOOTS. A file that defines main() and
            # never calls it reports success having done nothing - a bake was committed
            # that way once, finished in 559 ms and produced no disk - and no boot test
            # would catch it because the step's exit code was 0.
            python3 lib/entrypoints.py

            # AND THE METHODS THE ANNOTATIONS PROMISE. A call to a method that does not
            # exist on the class the annotation names is valid syntax, exits 0 under
            # `--help`, and fails only when a run reaches that line. Run 41996560809 spent
            # an hour of installer to find out that `d.wait_for` had been written on
            # drive.Driver while `d` is a Recovery.
            python3 lib/attrcheck.py

            # AND EVERY DISK-MODIFYING JOB IS FOLLOWED BY A CLEAN - WHERE ONE CAN RUN.
            # Cleaning is over ssh, so a job whose guest has no sshd yet cannot have one;
            # lib/cleancheck.py knows which is which per system and says so when a workflow
            # disagrees with it.
            python3 lib/cleancheck.py

            # AND EVERY FLAG A WORKFLOW PASSES IS ONE THE SCRIPT DECLARES. Run 42064532959
            # failed in two seconds with `desktop.py: error: unrecognized arguments:
            # --wizard-timeout 7200` - an argument bake.py has and desktop.py never did,
            # copied into macos26's desktop step from the setup step above it. argparse
            # rejects the whole invocation, so twenty minutes of pulling a 30 GiB disk was
            # followed by a usage message.
            python3 lib/flagcheck.py

            mkdir -p out
            GITHUB_TOKEN="${{ github.token }}" python3 lib/selftest.py

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            out/run.mp4
            out/shots/*.ppm
            out/shots/frames.txt
            out/console.log
          if-no-files-found: warn
          retention-days: 7

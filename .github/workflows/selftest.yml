name: selftest

# Prove the four channels work, on the smallest guest that boots.
#
# This does not bake anything. It answers the question that has to be settled before
# any distribution is worth wiring up: does -vnc answer, does QMP screendump work on a
# second socket, does the framebuffer capture produce frames, and does a host port
# forward reach the guest. Each is a separate moving part and a failure in any of them
# looks like "the bake is slow".
#
# Everything runs through log-stream, so the whole thing is readable while it runs
# rather than after it finishes.

on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '0'

      - name: the four channels
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: selftest
          interval: "15"
          command: |
            set -euo pipefail
            # THE ENTRY POINTS RUN BEFORE ANYTHING BOOTS. A file that defines main() and
            # never calls it reports success having done nothing - a bake was committed
            # that way once, finished in 559 ms and produced no disk - and no boot test
            # would catch it because the step's exit code was 0.
            python3 lib/entrypoints.py
            mkdir -p out
            GITHUB_TOKEN="${{ github.token }}" python3 lib/selftest.py

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            out/run.mp4
            out/shots/*.ppm
            out/shots/frames.txt
            out/console.log
          if-no-files-found: warn
          retention-days: 7

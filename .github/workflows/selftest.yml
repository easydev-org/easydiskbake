name: selftest

# Boot a guest, watch it over VNC, record it, and prove the four channels work.
#
# This does not bake anything. It answers the question that has to be settled before
# any distribution is worth wiring up: does -vnc answer, does ffmpeg read that stream,
# does QMP screendump work on a second socket, and does an SSH forward reach the
# guest. Each of those is a separate moving part and a failure in any of them looks
# like "the bake is slow".
#
# The guest is the tiniest thing that boots and prints: Alpine's virt ISO, 63 MB,
# already cached in ghcr. It reaches a shell in about 15 seconds, which is fast enough
# to iterate on.

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  selftest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        shell: bash
        run: ls -l /dev/kvm

      - name: the four channels
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: selftest
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            # The steps live in lib/selftest.py so they can be run locally against
            # any machine with /dev/kvm, not only inside a workflow.
            GITHUB_TOKEN="${{ github.token }}" python3 lib/selftest.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            out/run.mp4
            out/shots/*.ppm
            out/shots/frames.txt
            out/console.log
          if-no-files-found: warn
          retention-days: 7

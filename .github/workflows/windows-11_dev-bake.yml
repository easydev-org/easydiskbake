name: windows-11_dev-bake

# Turn the SSH disk into a developer disk: MSVC, the Windows SDK, the .NET SDK.
#
# THE CHAIN, AND WHY IT IS THREE WORKFLOWS
#
#     bake-windows        a clean Windows disk             :windows-base-<stamp>
#     bake-windows-ssh    that disk plus sshd              :windows-ssh-<stamp>
#     bake-windows-dev    that disk plus a toolchain       :windows-dev-<stamp>
#
# Each starts from the one before, so a failure in the third costs minutes rather than
# hours: no install, no OCR, no typing, no boot. That is easysandbox-windows' arrangement,
# and its recorded cost of merging them is why it is kept.
#
# WHAT IT PROVES
#
# A winget exit code says an installer ran. The last step here compiles and runs a C
# program through vcvars64 and prints dotnet --version, because "the SDK installed" and
# "the toolchain works" are different claims and only the second one matters.
#
# WHY THERE IS NO --clean ANY MORE
#
# Cleaning moved to the `clean` job below - see lib/clean_disk.py. It boots the disk this
# job produced, cleans it over ssh, zeroes its free space and publishes the result. Keeping
# it out of this job means a cleaning change does not pay for a twenty-minute Visual Studio
# install, and "the tag exists" now implies "the disk was cleaned".
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      ssh_tag:
        description: "The SSH disk to build on (a tag in this package)"
        default: "windows-ssh-latest"
      bootstate_run:
        description: "The run that produced ssh_tag; its artifact carries the UEFI
          variables and TPM state, without which the disk will not boot"
        default: ""
      publish_tag:
        description: "Tag to publish under, or empty for windows-dev-<stamp>"
        default: ""
      boot_timeout:
        description: "Seconds to wait for sshd"
        default: "900"

concurrency:
  group: bake-windows-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    # BuildTools with a workload is the slow part; a fresh machine takes two hours.
    timeout-minutes: 240
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # 12 GiB in, 16 GiB of installed toolchain, and a compressed copy.
            python3 lib/ci.py free-disk --need 40
            # sshpass turns "a banner appeared" into "a login worked", and this stage logs
            # in rather than looking at a screen.
            # apt-get update FIRST. `install` alone against a container whose package
            # lists were never fetched answers
            #
            #     E: Unable to locate package sshpass
            #
            # and exits 100, which is run 41774536455's prepare step - the job never
            # reached the disk. Every other workflow in this repository pairs the two;
            # this one had only the install.
            if ! command -v sshpass >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
            fi
            sshpass -V | head -1
            python3 lib/ci.py tags --prefix windows-

      - name: pull the ssh disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-pull
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            python3 windows/11/pull.py "${{ inputs.ssh_tag }}" out/windows11-ssh.qcow2

      # Same coupling as the ssh stage: the disk will not start without the firmware and
      # TPM state that were written when it was installed.
      - name: pull the bootstate
        if: inputs.bootstate_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows-ssh-bootstate
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.bootstate_run }}

      - name: install the toolchain
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-install
          interval: "25"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export WINDOWS_ADMIN_PASSWORD=admin
            python3 windows/11/devtools.py \
              --ssh out/windows11-ssh.qcow2 \
              --bootstate out/windows11-ssh.qcow2.bootstate.tar.gz \
              --out out/windows11-dev.qcow2 \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-recording
          path: |
            out/devtools-work/console.log
          if-no-files-found: warn
          retention-days: 14

      # THE NEXT STAGE NEEDS THIS AS MUCH AS IT NEEDS THE DISK.
      - name: keep the bootstate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dev-bootstate
          path: out/windows11-dev.qcow2.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30

      # PUBLISHED HERE, AFTER THE CLEAN THE STAGE ITSELF RAN.
      #
      # The clean is a step in windows/11/devtools.py - the guest is up, ssh is connected and
      # the disk is local, so a job boundary would only add two transfers of the whole disk.
      # This is the stage that most needs cleaning, because the toolchain is what makes the
      # disk large.
      - name: publish
        if: success()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-publish
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            TAG="${{ inputs.publish_tag }}"
            if [ -z "$TAG" ]; then
              python3 lib/publish_disk.py out/windows11-dev.qcow2 --kind windows-dev
            else
              python3 lib/publish_disk.py out/windows11-dev.qcow2 \
                --kind windows-dev --tag "$TAG"
            fi

      - name: what is in the package
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-tags
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix windows-

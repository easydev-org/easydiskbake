name: android-qemu

# Android: turn the pinned AOSP system image into bootable disks, then boot them as a
# plain qemu VM and photograph the result.
#
#     fetch the system image
#         └─> build the disks (mkdisks.py)
#               └─> boot them (run_qemu.py) ──> screen.png
#
# WHY THIS IS A SEPARATE WORKFLOW FROM android.yml
#
# android.yml builds an AVD: it pulls a packed AVD from ghcr, starts `emulator -avd`, and
# publishes an AVD archive. That artifact is a directory of Android images only the
# emulator's AVD path can consume.
#
# This one does not use an AVD at all. It takes the system image's own system.img and
# vendor.img - which are GPT disks - and supplies the three things a bare qemu boot needs
# and the SDK does not ship as installable parts:
#
#     cache.img     system, metadata, super, vbmeta and boot, as GPT partitions
#     userdata.img  an ext4 /data
#     ramdisk.img   the SDK ramdisk plus an fstab naming those five
#
# which android/15/mkdisks.py builds and android/15/run_qemu.py boots. The output is a set
# of disks a VM can start, not an AVD. Both workflows exist on purpose: they answer
# different questions about the same upstream image, and until this one has run
# repeatedly the other is the one with the history.
#
# THE IMAGE IS src:HERE, NOT THE BAKE IMAGE
#
# The bake image has no `lz4` (measured: `command -v lz4` -> MISSING), and mkdisks.py
# needs it to append the fstab as a third legacy LZ4 stream. So this runs in
# android/15/Containerfile.qemu, which carries the emulator, adb, lz4 and e2fsprogs and
# nothing the other platforms would have to pull.
#
# MANUAL ONLY. It boots a guest for minutes and downloads 746 MB when the runner is cold.

on:
  workflow_dispatch:
    inputs:
      # --- what to run ---------------------------------------------------------------
      build_run:
        description: "Build the disks from the system image"
        type: boolean
        default: true
      boot_run:
        description: "Boot the disks and photograph the screen"
        type: boolean
        default: true

      # --- how long to give the guest ------------------------------------------------
      # 260 IS ENOUGH FOR A FRESH DEVICE AND NOT FOR A RESTORED ONE. A /data carried over
      # from a previous run has to be decrypted and its package database re-read, which was
      # measured slower than a cold boot - run 42475590459 stopped at apexd-bootstrap with
      # the screenshot step never reached because the guest had used the whole window.
      seconds:
        description: "boot: seconds to keep the guest up (the screen is read near the end)"
        default: "420"
      ssh_port:
        description: "boot: host port forwarded to the guest's ssh port"
        default: "2222"

      # --- publish -------------------------------------------------------------------
      publish:
        description: "Push the disk set to ghcr as android-15-qemu"
        type: boolean
        default: false
      publish_tag:
        description: "the tag to push; empty for android-15-qemu"
        default: ""

      # --- keeping what was installed ------------------------------------------------
      #
      # A RUNNER IS DISCARDED AT THE END OF A JOB, so "keep my applications" has to mean
      # "upload the /data pair and hand it back next time". The pair is cache.img +
      # userdata.img and it is a PAIR: /data is encrypted and its key is in the metadata
      # partition of cache.img, so /data alone boots to a device with nothing on it.
      #
      # Both files are sparse - 64 GiB of virtual size, about 2 GiB of blocks after a
      # first boot - and upload-artifact stores them as they are, not expanded.
      keep_userdata:
        description: "boot: save cache.img + userdata.img as an artifact for reuse"
        type: boolean
        default: false
      userdata_from:
        description: "boot: an artifact name holding a saved pair; empty to start fresh"
        default: ""

concurrency:
  group: android-qemu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # BUILD - the system image becomes a set of disks.
  # ===========================================================================
  build:
    if: inputs.build_run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:android-qemu
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # /dev/net/tun AND NET_ADMIN, BECAUSE THE GUEST'S NETWORK IS A TAP.
      #
      # Without them lib/net.py cannot create the bridge or the tap, and the emulator falls
      # back to its userspace NAT - which for this guest means NO network at all:
      #
      #     lo 127.0.0.1/8
      #     dummy0, ifb0, ifb1, tunl0, gre0 ...  all DOWN
      #     ping: connect: Network is unreachable
      #
      # Measured on run with `options: --device /dev/kvm` alone. The macOS workflows have
      # passed both of these since they moved off slirp for the same reason.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      # KVM IS NOT FOR THE DOWNLOAD, IT IS FOR THE BOOT JOB. runner-check is asked here
      # anyway, because a runner without /dev/kvm that gets as far as the boot job has
      # already spent the download and the disk build discovering it.
      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: show the pin
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-pin
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/android_pin.py

      # THE SYSTEM IMAGE IS AN INPUT, AND IT IS THE ONLY THING FETCHED FROM GOOGLE.
      #
      # android/15/fetch_sysimg.py installs it into $ANDROID_SDK_ROOT and verifies the
      # sha1 from lib/images.py - the same pin publish_android.py uses, so this flow and
      # the AVD flow can never be looking at different upstream files.
      - name: fetch the system image
        id: sysimg
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-sysimg
          interval: "15"
          command: |
            set -euo pipefail
            # 'sysimg.log', NOT 'out.txt' - a FILE CALLED out.txt BESIDE A DIRECTORY
            # CALLED out/ IS A TRAP, and this workflow has both.
            python3 android/15/fetch_sysimg.py | tee sysimg.log
            # THE DIRECTORY COMES FROM THE SCRIPT, NOT FROM A SECOND GUESS HERE.
            # lib/avd.py owns the layout (.../system-images/android-<api>/<flavour>/<abi>)
            # and a copy of that rule in YAML is a copy that goes stale.
            grep '^SYSTEM_IMAGE_DIR=' sysimg.log | cut -d= -f2- > sdk.txt
            test -s sdk.txt

      - name: build the disks
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-disks
          interval: "15"
          command: |
            set -euo pipefail
            SDK=$(cat sdk.txt)
            echo "system image: $SDK"
            python3 android/15/mkdisks.py --sdk "$SDK" --out out/disks

      # THE DISK SET IS THE ARTIFACT OF THIS JOB. It is uploaded even on failure, because a
      # mkdisks.py that got as far as writing cache.img has something worth inspecting -
      # whether the copy out of super landed on non-zero bytes is the question every
      # offset bug in this file has answered wrongly and quietly.
      - name: upload the disks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-qemu-disks
          path: |
            out/disks/cache.img
            out/disks/userdata.img
            out/disks/ramdisk.img
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk set
        if: success() && inputs.publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/disks/cache.img
          kind: android-15-qemu
          tag: ${{ inputs.publish_tag || 'android-15-qemu' }}
          token: ${{ github.token }}

  # ===========================================================================
  # BOOT - start the disks and read the verdict off the guest.
  # ===========================================================================
  boot:
    needs: build
    if: |
      always() && inputs.boot_run && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:android-qemu
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # /dev/net/tun AND NET_ADMIN, BECAUSE THE GUEST'S NETWORK IS A TAP.
      #
      # Without them lib/net.py cannot create the bridge or the tap, and the emulator falls
      # back to its userspace NAT - which for this guest means NO network at all:
      #
      #     lo 127.0.0.1/8
      #     dummy0, ifb0, ifb1, tunl0, gre0 ...  all DOWN
      #     ping: connect: Network is unreachable
      #
      # Measured on run with `options: --device /dev/kvm` alone. The macOS workflows have
      # passed both of these since they moved off slirp for the same reason.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      # THE BOOT JOB GETS ITS OWN COPY OF THE SYSTEM IMAGE, because a second job starts on
      # a second runner. It is the same pinned file, verified the same way; the alternative
      # - passing 1.6 GB of system.img between jobs through an artifact - is slower and
      # gains nothing.
      - name: fetch the system image
        id: sysimg
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-boot-sysimg
          interval: "15"
          command: |
            set -euo pipefail
            python3 android/15/fetch_sysimg.py | tee sysimg.log
            grep '^SYSTEM_IMAGE_DIR=' sysimg.log | cut -d= -f2- > sdk.txt
            test -s sdk.txt

      # ARTIFACTS DO NOT PRESERVE THE DIRECTORY LAYOUT DEPENDABLY ENOUGH TO BOOT FROM, so
      # the disks are rebuilt here from the same system image rather than downloaded. It
      # costs about a minute and removes a class of failure - a missing kernel, a vendor
      # image that silently did not upload - that presents as a SIGSEGV with no message.
      # THE SAVED PAIR GOES IN BEFORE mkdisks RUNS, BECAUSE mkdisks KEEPS AN EXISTING /data.
      #
      # That ordering is the whole mechanism: mkdisks only makes a filesystem when there is
      # not one already, so a restored userdata.img survives it. Restoring afterwards would
      # mean the disks were built for a fresh device and then partly overwritten.
      # download-artifact ONLY SEES ARTIFACTS FROM THE RUN THAT IS EXECUTING. Measured:
      #
      #     Unable to download artifact(s): Artifact not found for name: android-qemu-userdata
      #
      # while the artifact was present and unexpired - it was uploaded by the PREVIOUS run.
      # Reaching across runs needs `github-token` and an explicit `run-id`, and `run-id` must
      # be a number, so the name is resolved to the newest matching artifact first.
      # download-artifact ONLY SEES ARTIFACTS FROM THE RUN THAT IS EXECUTING. Measured:
      #
      #     Unable to download artifact(s): Artifact not found for name: android-qemu-userdata
      #
      # while the artifact was present and unexpired - it had been uploaded by the PREVIOUS
      # run. Reaching across runs needs the REST API and `run-id`, and `run-id` is a number,
      # so the newest matching artifact is resolved first.
      #
      # NO `gh` IN THIS IMAGE, so the API is called with curl and the token directly. That is
      # the same interface `gh` uses; there is nothing here that needs the CLI.
      - name: restore a saved /data
        if: inputs.userdata_from != ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-restore
          interval: "10"
          command: |
            set -euo pipefail
            API="https://api.github.com/repos/${{ github.repository }}"
            AUTH="Authorization: Bearer ${{ github.token }}"
            mkdir -p out/disks

            # THE NEWEST UNEXPIRED ARTIFACT WITH THAT NAME, ACROSS EVERY RUN.
            curl -fsSL -H "$AUTH" "$API/actions/artifacts?per_page=100" \
              | python3 -c "
            import json,sys
            want = sys.argv[1]
            arts = [a for a in json.load(sys.stdin)['artifacts']
                    if a['name'] == want and not a['expired']]
            if not arts:
                sys.exit(3)
            a = max(arts, key=lambda x: x['created_at'])
            print(a['id'], a['workflow_run']['id'])
            " "${{ inputs.userdata_from }}" > /tmp/pick.txt || {
              echo "=== no unexpired artifact named ${{ inputs.userdata_from }} ==="
              exit 1
            }
            ID=$(cut -d" " -f1 /tmp/pick.txt); RUN=$(cut -d" " -f2 /tmp/pick.txt)
            echo "artifact $ID from run $RUN"

            # THE ARTIFACT IS A ZIP, and one large file inside it. curl follows the redirect
            # the API answers with to the blob storage host.
            curl -fsSL -H "$AUTH" -o /tmp/pair.zip \
              "$API/actions/artifacts/$ID/zip"
            python3 -c "
            import zipfile
            with zipfile.ZipFile('/tmp/pair.zip') as z:
                for n in z.namelist():
                    print('extracting', n)
                z.extractall('out/disks')
            "
            ls -la out/disks | head

      - name: build the disks
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-boot-disks
          interval: "15"
          command: |
            set -euo pipefail
            python3 android/15/mkdisks.py --sdk "$(cat sdk.txt)" --out out/disks

      # NO `set -e` AROUND THE VERDICT ON PURPOSE. run_qemu.py exits non-zero when the
      # boot did not complete, and the log it leaves is what the failure has to be read
      # from - killing the step early would upload the screenshots but not the reason.
      - name: boot it and photograph the screen
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-boot
          interval: "15"
          command: |
            set -uo pipefail
            python3 android/15/run_qemu.py \
              --dir out/disks \
              --seconds "${{ inputs.seconds || '260' }}" \
              --evidence out/screen.png
            status=$?
            echo "run_qemu exited $status"
            exit $status

      # FOLD THE OVERLAYS IN BEFORE SAVING. The guest writes to a qcow2 beside each raw
      # file, never to the raw file itself, so the raw is unchanged after a run that
      # installed things - persist.py converts the overlay back and copies the pair.
      - name: save the /data pair
        if: always() && inputs.keep_userdata
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-save
          interval: "10"
          command: |
            set -euo pipefail
            python3 android/15/persist.py --save --dir out/disks --into out/keep

      - name: keep the /data pair
        if: always() && inputs.keep_userdata
        uses: actions/upload-artifact@v4
        with:
          name: android-qemu-userdata
          path: |
            out/keep/cache.img
            out/keep/userdata.img
          if-no-files-found: warn
          retention-days: 30

      # THE PICTURE IS THE PROOF. Everything else this workflow prints is a log line that
      # a boot which stopped early produces just as readily.
      - name: keep the screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-qemu-screen
          path: |
            out/screen.png
            out/disks/run.log
          if-no-files-found: warn
          retention-days: 14

      - name: the verdict
        if: always()
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-verdict
          interval: "10"
          command: |
            set -euo pipefail
            echo "=== android-qemu ==="
            if [ -f out/screen.png ]; then
              echo "screen: $(stat -c %s out/screen.png) bytes"
              # A PNG HEADER IS THE CLAIM. A truncated file, or a debugfs export that
              # found nothing, is not a screenshot however the run described itself.
              head -c 8 out/screen.png | od -An -tx1
            else
              echo "no screenshot was produced"
            fi
            if [ -f out/disks/run.log ]; then
              echo "--- the guest's last words ---"
              grep -v vqParseGuestToHostRequestLocked out/disks/run.log | tail -20
            fi

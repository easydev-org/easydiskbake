name: android-qemu

# Android, built as a chain of disks, the way macOS and Windows are.
#
#     sysimg ──> disks ──> ssh ──> dev
#
# WHY A CHAIN AND NOT ONE JOB
#
# Each stage fails in a different place and deserves its own timeout and its own exit:
#
#     sysimg   a 746 MB download from Google, verified against the sha1 in lib/images.py
#     disks    mkdisks.py turning that image into bootable disks - CPU and IO only
#     ssh      a Termux openssh running inside the guest, reachable from outside
#     dev      a toolchain in the guest (LEFT EMPTY FOR NOW - see the job)
#
# Starting from a tag is what makes a change to one stage testable without paying for the
# ones before it. That is the same pair of inputs macOS and Windows use:
#
#     <job>_run    should this job run
#     <job>_from   the tag to pull; empty means "use what the job above produced"
#
# THERE IS NO `launch` JOB. LAUNCH IS A PHASE INSIDE EVERY JOB THAT HAS A GUEST.
#
# A job that has to change the disk has to boot it first - there is no way to install ssh
# into a stopped VM - so "launch" is not a stage of its own, it is the first and last thing
# every disk-touching job does:
#
#     pull the disks ──> launch ──> do the work ──> save ──> push
#
# and the launch is verified inside that job: the boot reaches sys.boot_completed, a
# screenshot comes back through surfaceflinger, and - in the stages that have one - sshd is
# proven to answer on the forwarded port. A separate verification job would boot the same
# disk a second time to answer a question the job above already answered.
#
# WHAT A TAG HOLDS
#
# macOS and Windows hand over ONE qcow2. Android is three disks, and two of them are a pair:
#
#     cache.img      system + metadata + super; the key that opens /data lives in metadata
#     userdata.img   /data, 64 GiB, where applications and the ssh prefix go
#     ramdisk.img    the boot ramdisk with the first-stage fstab
#
# So a tag is a tar of those three, and `persist.py` is what makes the pair usable: the
# guest never writes to the raw files, it writes to a qcow2 beside each one, and saving
# folds both overlays back before the tar is made.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      # --- what to run ---------------------------------------------------------------
      sysimg_run:
        description: "sysimg: fetch and verify the AOSP system image"
        type: boolean
        default: true
      disks_run:
        description: "disks: turn it into bootable disks (~3 minutes)"
        type: boolean
        default: true
      ssh_run:
        description: "ssh: launch, install sshd, launch again to prove it (~10 minutes)"
        type: boolean
        default: true
      dev_run:
        description: "dev: launch and install a toolchain (not implemented yet)"
        type: boolean
        default: false

      # --- where each job starts -----------------------------------------------------
      sysimg_from:
        description: "sysimg: pull this tag instead of fetching"
        default: ""
      disks_from:
        description: "disks: pull this tag instead of the sysimg job's output"
        default: ""
      ssh_from:
        description: "ssh: pull this tag instead of the disks job's output"
        default: ""
      dev_from:
        description: "dev: pull this tag instead of the ssh job's output"
        default: ""

      # --- launch, which every disk-touching job runs ----------------------------------
      seconds:
        description: "launch: seconds to keep the guest up before the phase ends"
        default: "420"
      ssh_port:
        description: "launch: host port forwarded to the guest's sshd"
        default: "2222"

      # --- publish ---------------------------------------------------------------------
      publish_tag:
        description: "tag suffix for this stage; empty for android-15-<stage>"
        default: ""

concurrency:
  group: android-qemu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # SYSIMG - the one input that comes from outside this repository.
  # ===========================================================================
  sysimg:
    if: inputs.sysimg_run || inputs.sysimg_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/${{ github.repository }}:android-qemu
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.sysimg_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      # THE PIN, PRINTED BEFORE ANYTHING IS DOWNLOADED. A stage that fails should say which
      # upstream file it was looking at, and the sha1 is the answer to "did Google move it".
      - name: show the pin
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-pin
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/android_pin.py

      - name: fetch the system image
        id: fetch
        if: inputs.sysimg_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-sysimg
          interval: "15"
          command: |
            set -euo pipefail
            python3 android/15/fetch_sysimg.py | tee sysimg.log
            # THE DIRECTORY COMES FROM THE SCRIPT, NOT FROM A SECOND GUESS HERE.
            # lib/avd.py owns the layout (.../system-images/android-<api>/<flavour>/<abi>)
            # and a copy of that rule in YAML is a copy that goes stale.
            grep '^SYSTEM_IMAGE_DIR=' sysimg.log | cut -d= -f2- > sdk.txt
            test -s sdk.txt

      # THE SYSTEM IMAGE IS 1.6 GB AND IS NEVER PUSHED AS A TAG OF ITS OWN HERE - it already
      # exists as `sysimg-android-15-aosp`, published by artifacts-publish.yml from the same
      # pin. This job's tag is the marker that "the pinned image is present and unpackable",
      # which is cheap to verify and lets the disks job start from it.
      - name: push the marker
        if: success() && inputs.sysimg_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: sdk.txt
          kind: android-15-sysimg
          tag: ${{ inputs.publish_tag || 'android-15-sysimg' }}
          token: ${{ github.token }}

  # ===========================================================================
  # DISKS - the system image becomes the three disks a bare qemu boot needs.
  # ===========================================================================
  disks:
    needs: sysimg
    if: |
      always() && inputs.disks_run
      && (inputs.disks_from != '' || needs.sysimg.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:android-qemu
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.disks_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: fetch the system image
        id: sysimg
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-disks-sysimg
          interval: "15"
          command: |
            set -euo pipefail
            python3 android/15/fetch_sysimg.py | tee sysimg.log
            grep '^SYSTEM_IMAGE_DIR=' sysimg.log | cut -d= -f2- > sdk.txt
            test -s sdk.txt

      # THREE DISKS, AND mkdisks.py IS THE WHOLE OF THIS STAGE.
      #
      # It copies `system` out of super at the offset liblp names (AVB will not verify a
      # logical partition), writes a 16 MiB ext4 for `metadata` - where /data's key goes -
      # and appends the first-stage fstab to the SDK ramdisk as a third legacy-LZ4 stream.
      - name: build the disks
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-disks
          interval: "15"
          command: |
            set -euo pipefail
            python3 android/15/mkdisks.py --sdk "$(cat sdk.txt)" --out out/disks

      # THE DISK SET, PLUS THE THREE FILES THAT COME FROM THE SYSTEM IMAGE.
      #
      # cache.img, userdata.img and ramdisk.img are the outputs of this stage. kernel,
      # system.img and vendor.img are inputs that happen to be needed beside them at boot;
      # they are 1.6 GB together and are re-staged from the pinned image by every downstream
      # job rather than shipped in four tarballs.
      #
      # THE TAR IS WHAT A TAG HOLDS. macOS and Windows push one qcow2 because one file is
      # their whole disk; this is three files that must stay a set - /data cannot be opened
      # without the key in cache.img's metadata partition.
      - name: pack the disk set
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-pack
          interval: "15"
          command: |
            set -euo pipefail
            cd out/disks
            tar -cf ../android-15-disks.tar cache.img userdata.img ramdisk.img
            cd ..
            zstd -19 -f android-15-disks.tar -o android-15-disks.tar.zst
            rm -f android-15-disks.tar
            ls -la android-15-disks.tar.zst

      - name: push the disk set
        if: success() && inputs.disks_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/android-15-disks.tar.zst
          kind: android-15-disks
          tag: ${{ inputs.publish_tag || 'android-15-disks' }}
          token: ${{ github.token }}

  # ===========================================================================
  # SSH - launch, install a Termux openssh, launch again to prove it, save.
  # ===========================================================================
  ssh:
    needs: disks
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != '' || needs.disks.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:android-qemu
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # /dev/net/tun AND NET_ADMIN, BECAUSE THE GUEST'S NETWORK IS A TAP.
      #
      # Without them lib/net.py cannot create the bridge or the tap and the emulator falls
      # back to its userspace NAT, which for this guest means no network at all - and a
      # guest with no network cannot be reached on 2222 whatever sshd is doing inside it.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.ssh_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: fetch the system image
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-ssh-sysimg
          interval: "15"
          command: |
            set -euo pipefail
            python3 android/15/fetch_sysimg.py | tee sysimg.log
            grep '^SYSTEM_IMAGE_DIR=' sysimg.log | cut -d= -f2- > sdk.txt
            test -s sdk.txt

      # THE DISK SET ARRIVES COMPRESSED, AND mkdisks.py KEEPS IT.
      #
      # mkdisks only makes a filesystem when there is not one already, so extracting the
      # three disks first and then running it stages kernel/system/vendor around them
      # without touching cache.img or userdata.img. Restoring afterwards would mean the
      # disks were built for a fresh device and then partly overwritten.
      # `oci-pull` IS THE REPOSITORY'S OWN ACTION FOR THIS, and every other workflow uses it.
      # The tag is a single tar of the three disks.
      - name: pull the disk set
        if: inputs.ssh_from != ''
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.ssh_from || needs.disks.outputs.tag }}
          dest: out
          token: ${{ github.token }}

      - name: unpack the disk set
        if: inputs.ssh_from != ''
        run: |
          set -euo pipefail
          mkdir -p out/disks
          tar -xf out/android-15-disks.tar.zst -C out/disks
          ls -la out/disks

      - name: build the disks
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-ssh-disks
          interval: "15"
          command: |
            set -euo pipefail
            python3 android/15/mkdisks.py --sdk "$(cat sdk.txt)" --out out/disks

      # THE SSH PAYLOAD IS BUILT HERE, NOT SHIPPED IN THE IMAGE.
      #
      # It is eight Termux packages resolved through Termux's own Packages index - 4 MiB
      # compressed - and android/15/termux_ssh.py is what assembles them into the prefix
      # sshd looks for (/data/data/com.termux/files/usr, which is compiled into the binary).
      # Building it here rather than publishing it means a Termux rebuild is picked up on
      # the next run instead of failing with a 404 on a stale filename.
      - name: build the ssh payload
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-ssh-payload
          interval: "15"
          command: |
            set -euo pipefail
            python3 android/15/termux_ssh.py --out out/termux-ssh.tar.zst
            ls -la out/termux-ssh.tar.zst

      # ---- LAUNCH ------------------------------------------------
      # The phase, not a job: it starts the guest, configures the network over adb, installs
      # sshd from the Termux payload, and proves sshd answers. Everything below runs on the
      # same guest; nothing is rebooted between them.
      - name: launch, install sshd, and prove it listens
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-ssh-launch
          interval: "15"
          command: |
            set -euo pipefail
            adb start-server >/dev/null 2>&1 || true
            python3 android/15/run_qemu.py \
              --dir out/disks \
              --tap qemutap0 \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --adb-port 5554 \
              --seconds "${{ inputs.seconds || '420' }}" \
              --ssh-payload out/termux-ssh.tar.zst \
              --evidence out/screen.png

      # ---- SAVE --------------------------------------------------
      # The guest wrote to a qcow2 beside each raw file, never to the raw file itself. Folding
      # both overlays back is what turns "the guest has sshd" into a disk the next job can
      # start - and the two are saved together because /data cannot be opened without the
      # key that lives in cache.img's metadata partition.
      - name: save the disks
        if: always()
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-qemu-ssh-save
          interval: "10"
          command: |
            set -euo pipefail
            python3 android/15/persist.py --save --dir out/disks --into out/keep
            cd out/keep
            tar -cf ../android-15-ssh.tar cache.img userdata.img
            cd ..
            zstd -19 -f android-15-ssh.tar -o android-15-ssh.tar.zst
            rm -f android-15-ssh.tar
            ls -la android-15-ssh.tar.zst

      - name: keep the screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-qemu-ssh-screen
          path: |
            out/screen.png
            out/disks/run.log
          if-no-files-found: warn
          retention-days: 14

      - name: push the ssh disk set
        if: success() && inputs.ssh_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/android-15-ssh.tar.zst
          kind: android-15-ssh
          tag: ${{ inputs.publish_tag || 'android-15-ssh' }}
          token: ${{ github.token }}

  # ===========================================================================
  # DEV - launch and install a toolchain. DELIBERATELY EMPTY FOR NOW.
  # ===========================================================================
  dev:
    needs: ssh
    if: |
      always() && inputs.dev_run
      && (inputs.dev_from != '' || needs.ssh.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:android-qemu
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      # THE STAGE EXISTS SO THE CHAIN HAS ITS SHAPE AND THE INPUTS ONES ARE NAMED. What it
      # will do is launch the ssh disk, run the toolchain's own installer over the forwarded
      # port, save, and push `android-15-dev` - the same four phases the ssh job above has.
      #
      # It stops here rather than pretending: a job that boots a disk and does nothing to it
      # would push a tag identical to its input and claim a stage had run.
      - name: not implemented
        run: |
          echo "=== DEV IS NOT IMPLEMENTED YET ==="
          echo "  its input tag is ${{ inputs.dev_from || needs.ssh.outputs.tag }}"
          echo "  the shape it will have is the ssh job's: pull, launch, install, save, push"
          exit 1

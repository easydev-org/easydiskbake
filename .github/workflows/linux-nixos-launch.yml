name: linux-nixos-launch

# Start a published NixOS desktop disk on KVM, wait for its desktop, and photograph it.
#
# WHAT THIS ANSWERS
#
#     does the tag in ghcr actually boot to a desktop
#
# linux-nixos-bake's derive job reports DERIVE_RC=0, which means nixos-rebuild built a
# generation and made it the default. It does not mean the generation starts. The three
# ways a derived disk has failed in easysandbox-vm are all silent at build time:
#
#     a display manager whose assertion passed but which cannot start
#     a compositor that aborts with "Failed to find any DRM render node"
#     a session that starts and paints nothing
#
# So this boots each artifact by itself, from the same tag a deployment would pull, and
# records what appears. The verdict needs BOTH evidence streams: the serial console says
# the system reached userspace, and the screen says something was drawn. A guest whose
# display manager died still reaches a login prompt, and a black frame is also what a
# greeter looks like for its first seconds.
#
# SIX DESKTOPS, ONE MATRIX, FAIL-FAST OFF. One broken flavour is a fact about that flavour
# and the other five are still worth launching - the same argument the derive job makes.
#
# MANUAL ONLY, like every other workflow here.

on:
  workflow_dispatch:
    inputs:
      desktops:
        description: 'Which desktops to launch, as a JSON array, e.g. ["kde","gnome"]. Empty means all six.'
        default: ""
      boot_timeout:
        description: "Seconds to wait for a desktop after the console comes up"
        default: "900"
      resolution:
        description: "Guest screen as WxH"
        default: "1920x1080"
      mem:
        description: "Guest memory in MB"
        default: "6144"

concurrency:
  group: launch-nixos-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      packages: read
      checks: write
    strategy:
      # A DESKTOP THAT DOES NOT START SAYS NOTHING ABOUT THE OTHER FIVE. Report all six.
      fail-fast: false
      matrix:
        # JSON, EMPTY MEANS ALL SIX. Same expression as linux-nixos-bake's derive matrix,
        # for the same reason: GitHub's expression language has no `replace`, so a
        # comma-separated string cannot be split inside the workflow.
        desktop: ${{ fromJSON(github.event.inputs.desktops == '' && '["labwc","gnome","kde","cosmic","hyprland","miracle"]' || github.event.inputs.desktops) }}

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-prepare-${{ matrix.desktop }}
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # The disk in, the recording, and a copy while it is being read.
            python3 lib/ci.py free-disk --need 30
            # THE VERDICT IS READ OVER SSH, so the client that supplies the password has
            # to exist. It is in the bake image for the Windows and macOS dev stages;
            # assert it here rather than discover its absence as a timeout.
            if ! command -v sshpass >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -qq sshpass
            fi
            sshpass -V | head -1
            # Say which tags exist before spending minutes discovering one does not.
            python3 lib/ci.py tags --prefix nixos-

      - name: launch it and photograph the screen
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-${{ matrix.desktop }}
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=5
            python3 linux/nixos/launch.py \
              --tag "nixos-${{ matrix.desktop }}" \
              --desktop "${{ matrix.desktop }}" \
              --artifacts "out/nixos-${{ matrix.desktop }}-launch" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --resolution "${{ inputs.resolution || '1920x1080' }}" \
              --mem "${{ inputs.mem || '6144' }}"

      # THE SCREENSHOT IS THE ARTIFACT, NOT THE VERDICT. The verdict is the Wayland
      # session, read over ssh - a pixel test cannot tell "this compositor does not draw
      # on the emulated VGA adapter" from "this compositor failed to start", and two of the
      # six (labwc, miracle) drew nothing at all while working. So the picture is uploaded
      # for a person to look at, and launch.txt carries the reasoning.
      - name: keep the screenshot and the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-${{ matrix.desktop }}-launch
          path: |
            out/nixos-${{ matrix.desktop }}-launch/screen.png
            out/nixos-${{ matrix.desktop }}-launch/launch.txt
            out/nixos-${{ matrix.desktop }}-launch/install.mp4
            out/nixos-${{ matrix.desktop }}-launch/last-frame.png
            out/nixos-${{ matrix.desktop }}-launch/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: the verdict
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-verdict-${{ matrix.desktop }}
          interval: "10"
          command: |
            set -euo pipefail
            F="out/nixos-${{ matrix.desktop }}-launch/launch.txt"
            echo "=== nixos-${{ matrix.desktop }} ==="
            if [ -f "$F" ]; then cat "$F"; else echo "no verdict was written"; fi
            echo
            echo "=== frames ==="
            ls -la "out/nixos-${{ matrix.desktop }}-launch" || true

name: blissos16

# BlissOS 16.9.7 - Android 13 on x86_64, installed onto a GPT disk and started from it.
#
#     install   the ISO's own installer writes a disk, under real UEFI
#     launch    that disk boots itself, with no -kernel and no cdrom
#
# BOTH JOBS RUN A WORKFLOW FILE. There is no `android/blissos16/install.py` and no `launch.py`:
# `install` is `steps/install.yaml` and `launch` is `steps/launch.yaml`, which is the shape
# `easyvm` exists for and what windows/11/steps/ssh.yaml already does.
#
# THIS IS THE ONLY ANDROID ROUTE, AND WHY IT REPLACED THE OTHER ONE
#
# There was an emulator route: Google's AOSP system image booted through the SDK's `emulator`
# binary, which means goldfish/ranchu - and goldfish makes four things true that nothing
# downstream can fix from the guest side.
#
#     kernel-ranchu is not a bzImage    measured: 497 bytes of 0xff, HdrS at 514, no 0xAA55.
#     -system publishes no GPT uevents measured: first-stage init waits in /sys forever, so the
#                                       disks must be split into three and kept paired.
#     /data is encrypted, on nosuid      measured: dm-42 ext4 (rw,seclabel,nosuid,...).
#     su accepts root and shell only     measured: an app uid gets "not allowed".
#
# It also cost two images (android-builder, android-qemu), two workflows and five lib modules,
# and the one thing it could never do was produce a disk that starts itself - the image already
# WAS the disks, and the emulator was what booted them.
#
# BlissOS is Android-x86 and has none of those four problems: a real bzImage, an initrd that
# assembles the root itself, and a plain ext4 for /data. What it needs instead is what a PC
# needs - a partition table, an ESP and a bootloader - and that is what these two stages
# produce, so the launch stage is a real boot of a real disk.
#
# WHY 16.9.7 IS ANDROID 13, AND WHY THAT IS STILL THE NEWEST
#
# It is the newest publicly published BlissOS image. The project's own pages say "Public images
# are paused" with no ETA; the BlissOS17 (Android 14) and Voyager/18 (Android 15) directories on
# SourceForge exist and contain no ISO; BlissOS/stable_releases v17.8.3 pins android-14.0.0_r53;
# and Android 15 exists only as source in platform_manifest's voyager-qpr2-x86 tree, which has to
# be BUILT - 350 GB and hours, not a download.
#
# THE MEASUREMENTS THIS WORKFLOW DEPENDS ON
#
#   `AUTO_INSTALL` MUST NOT BE SET. install_process guards its search for the EF00 partition with
#   `[ -z "$AUTO_INSTALL" -o -n "$AUTO_UPDATE" ]`, so with it set the search is skipped, `esp`
#   stays empty, the "Choose EFI Boot" pane never appears, and install_grub_efi - the step that
#   writes BOOTX64.EFI - is never called. Two runs of that path produced FAT32 ESPs labelled EFI
#   with no BOOTX64.EFI, and disks that booted to the UEFI shell.
#
#   `-vga virtio` IS REQUIRED FOR THE INSTALLED SYSTEM, AND `-vga std` IS NOT ENOUGH. It runs
#   Android's HWC with `HWC=drm_minigbm`, which needs a DRM/KMS node; `-vga std` gives a
#   framebuffer and no DRM device, and the screen then stops on initrd's last line for as long as
#   you wait. The INSTALLER is the opposite and gets `-vga std` - its TUI draws on a plain
#   framebuffer. Both facts live in lib/vm_session.py's three android shapes.
#
#   THE BOOTLOADER HAS TO BE AT /EFI/BOOT. install_grub_efi writes /EFI/BLISSOS and registers its
#   entry with efibootmgr, which lands in the VARS image and not on the disk - so a disk started
#   with any other NVRAM falls into the firmware's shell. steps/install.yaml's last python step
#   copies the loaders to the removable-media path and replaces the config's `search.fs_uuid`
#   (a UUID taken before the formatting, so it names a filesystem that does not exist) with a
#   `--file` search.
#
# MANUAL ONLY: a 2.2 GB download, a full install and a boot.

on:
  workflow_dispatch:
    inputs:
      # --- what to run ------------------------------------------------------------------
      install_run:
        description: "install: write the disk from the ISO under UEFI (~15 minutes)"
        type: boolean
        default: true
      launch_run:
        description: "launch: start that disk and photograph its launcher (~10 minutes)"
        type: boolean
        default: true
      ssh_run:
        description: "ssh: put sshd INSIDE Android, prove it answers, and publish (~20 minutes)"
        type: boolean
        default: true

      # --- where each stage starts ------------------------------------------------------
      install_from:
        description: "install: a published tag to copy instead of installing"
        default: ""
      launch_from:
        description: "launch: a published tag to start instead of the install stage's disk"
        default: ""
      ssh_from:
        description: "ssh: a published tag to add sshd to instead of the install stage's disk"
        default: ""
      ssh_publish_tag:
        description: "ssh: tag to publish under; empty for android-13-blissos-ssh"
        default: "android-13-blissos-ssh"

      # --- the disk --------------------------------------------------------------------
      disk_gb:
        description: "the disk's size"
        default: "32"
      mem_mb:
        description: "guest memory"
        default: "4096"
      launch_mem_mb:
        description: "guest memory for the launch (the installed system wants more)"
        default: "8192"
      launch_seconds:
        description: "launch: seconds the installed system may take to reach its UI"
        default: "600"

      # --- publish ---------------------------------------------------------------------
      publish_tag:
        description: "tag to publish under; empty for android-13-blissos"
        default: "android-13-blissos"

concurrency:
  group: blissos16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # INSTALL - the ISO's installer writes a bootable disk.
  # ===========================================================================
  install:
    if: inputs.install_run || inputs.install_from != ''
    runs-on: ubuntu-24.04
    # 150 AND NOT 60, BECAUSE THE DOWNLOAD IS NOT THIS REPOSITORY'S TO SCHEDULE.
    #
    # Run 43061390716 was cancelled at exactly 1h0m0s with the ISO at 92% - SourceForge served
    # 2.2 GiB at about 0.5 MB/s, which is 50 minutes, and the install itself needs 17 more. The
    # budget was sized for the work and the download is somebody else's weather.
    #
    # The step-level timeout is the protection that matters (the install step has its own), so a
    # job-level ceiling exists only to stop a hung runner. 150 covers a slow mirror without
    # letting a wedged job sit for a day.
    timeout-minutes: 150
    container:
      # THE SAME IMAGE THE WINDOWS AND macOS STAGES USE, and the right one because it carries
      # no Android SDK: this path never touches `emulator`, `avdmanager` or `kernel-ranchu`. It
      # has qemu, 7z, sfdisk, mtools, OVMF and python3, which is everything the file needs.
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # /dev/kvm for the guest; /dev/net/tun and NET_ADMIN because lib/vm.py attaches a tap.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.install_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          # the disk is 32 GiB virtual, ~4 GiB on disk, plus the ISO and the raw view `disk:`
          # takes while it writes the partition table
          disk-gb: '40'
          token: ${{ github.token }}

      - name: show the pin
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-pin
          interval: "10"
          command: |
            set -euo pipefail
            python3 - <<'PY'
            import sys
            sys.path.insert(0, "lib")
            import images
            pin = images.BLISSOS["iso:blissos-16.9.7"]
            print(f"android  {pin['android']}")
            print(f"url      {pin['url']}")
            print(f"size     {pin['size']:,} B")
            print(f"sha256   {pin['sha256']}")
            PY

      - name: fetch and unpack the ISO
        if: inputs.install_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-fetch
          interval: "15"
          command: |
            set -euo pipefail
            # --drop-iso is NOT used: the installer unpacks /src/install.img out of the ISO at
            # run time, so the ISO has to be beside the kernel when the walkthrough starts.
            python3 android/blissos16/fetch_iso.py --out out/bliss

      - name: pull the disk
        if: inputs.install_from != ''
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.install_from }}
          dest: out
          token: ${{ github.token }}

      - name: say what was pulled
        if: inputs.install_from != ''
        run: |
          set -euo pipefail
          # `oci-pull` WRITES THE TAG'S OWN NAME, so there is nothing to unpack and no path to
          # hard-code - see the note above `push the disk`.
          DISK=$(ls out/*.qcow2 | head -1)
          echo "pulled $DISK"
          qemu-img info "$DISK" | grep -E 'virtual size|disk size'

      # ---- THE INSTALL ---------------------------------------------------------------
      # THE STAGE IS THE FILE. It makes the disk and its GPT (`disk:`), boots the ISO's installer
      # under OVMF (`boot:` with `os: android`), answers its ten panes with the key sequence
      # measured by hand, places the fallback loader, reads the ESP back as the verdict, and
      # publishes the compressed disk (`compress:`).
      #
      # `--boot-iso` IS A RUN FACT and arrives here for the same reason `--boot-disk` does: the
      # workflow knows where the download landed, and the file must not bake that path in.
      - name: install to a disk
        # A RUN THAT WAS GIVEN A PUBLISHED TAG DOES NOT INSTALL ONE. `install_from` is the "start
        # from this disk" input, and without this guard the job would download 2.2 GiB of ISO,
        # partition the blank disk it just pulled over, and write a second one beside it.
        if: inputs.install_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-install
          interval: "20"
          command: |
            set -euo pipefail
            mkdir -p out/install
            ./easyvm android/blissos16/steps/install.yaml \
              --boot-disk out/install/blissos16.qcow2 \
              --boot-iso out/bliss \
              --work out/install/work \
              --out out/install/blissos16-out.qcow2 \
              --boot-mem "${{ inputs.mem_mb || '4096' }}"

      # THE VERDICT IS DIAGNOSTIC, AND A FAILED UPLOAD MUST NOT FAIL THE JOB.
      #
      # Run 43093086278: the install was green in 15m2s and this step failed with
      #
      #     Failed to CreateArtifact: Failed to make request after 5 attempts:
      #     Unexpected token '<', "<!DOCTYPE "... is not valid JSON
      #
      # which is the artifact service answering with an HTML error page. The install job then
      # failed, and `launch` and `ssh` - both `needs: install` - were skipped entirely. A log and
      # some screenshots are evidence for a human; they are not what the job is FOR, and a stage
      # that cannot publish its evidence has still done its work.
      #
      # `continue-on-error` is right here and wrong two steps above: `oci-push` failing IS a
      # failure, because the artifact is the product.
      - name: keep the verdict
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blissos-install
          path: |
            out/install/work/console.log
            out/install/work/shots/*.png
          if-no-files-found: warn
          retention-days: 14

      # WHAT A TAG HOLDS: THE DISK, AND NOTHING ELSE.
      #
      # IT IS PUSHED AS THE QCOW2 AND NOT AS A TARBALL, and the first complete run of this
      # workflow is why. `compress:` already produced a 2 GiB zstd qcow2, and the pack step put
      # that inside a tar so `oci-push` had one file - but `oci-pull` names what it writes after
      # the TAG, not after the file it came from, so the launch job pulled
      #
      #     out/android-13-blissos.qcow2        (the whole disk, already unpacked)
      #
      # while `unpack the disk` looked for `out/blissos16.tar.zst` and failed with
      #
      #     tar: out/blissos16.tar.zst: Cannot open: No such file or directory
      #
      # A tarball is one more name to keep in step for a file that is already compressed. The
      # other workflows push the qcow2 for the same reason.
      - name: push the disk
        if: success() && inputs.install_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          # THE STAGE'S OWN `compress:` TARGET, named once, in the step above.
          path: out/install/blissos16-out.qcow2
          kind: android-13-blissos
          tag: ${{ inputs.publish_tag || 'android-13-blissos' }}
          token: ${{ github.token }}

  # ===========================================================================
  # LAUNCH - the disk starts itself, with no ISO and no -kernel.
  # ===========================================================================
  #
  # THE STAGE THAT PROVES THE ARTEFACT. The install's verdict is a directory entry on the ESP;
  # that is a claim about bytes. This is the claim about the machine: the firmware finds the ESP,
  # GRUB runs, the installed kernel boots the installed system, and Android's own UI is drawn.
  launch:
    needs: install
    if: |
      always() && inputs.launch_run
      && (inputs.launch_from != '' || needs.install.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # /dev/kvm ONLY. `os: android` starts an installed disk with `-netdev user`, because the
      # frames come over QMP and the guest never needs an address - measured: with a tap on the
      # command line and no /dev/net/tun in the pod, qemu exited before the first QMP message and
      # the stage died on ConnectionResetError.
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: pull the disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.launch_from || needs.install.outputs.tag }}
          dest: out
          token: ${{ github.token }}

      - name: take the pulled disk
        run: |
          set -euo pipefail
          # THE TAG'S OWN NAME, WHICH IS WHAT `oci-pull` WROTE. A hard-coded path is a second
          # place that has to agree with the publisher - and the first complete run of this
          # workflow failed exactly there, on `tar: out/blissos16.tar.zst: Cannot open`.
          DISK=$(ls out/*.qcow2 | head -1)
          echo "DISK=$DISK" >> "$GITHUB_ENV"
          qemu-img info "$DISK" | grep -E 'virtual size|disk size'

      # ---- LAUNCH --------------------------------------------------------------------
      # No --boot-iso and no --kernel: the firmware starts the disk, GRUB loads the disk's own
      # kernel, and `desktop: android` waits for Android's own UI (the launcher, the home-app
      # chooser, or the lock screen - all three mean the same thing).
      - name: start the disk and photograph it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-launch
          interval: "20"
          command: |
            set -euo pipefail
            mkdir -p out/launch
            ./easyvm android/blissos16/steps/launch.yaml \
              --boot-disk "$DISK" \
              --work out/launch/work \
              --boot-mem "${{ inputs.launch_mem_mb || '8192' }}" \
              --boot-timeout "${{ inputs.launch_seconds || '600' }}"

      - name: keep the screen and the verdict
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blissos-launch
          path: |
            out/launch/work/shots/screen.png
            out/launch/work/console.log
            out/launch/work/shots/*
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # SSH - an sshd that runs INSIDE Android, proven from outside the guest.
  # ===========================================================================
  #
  # THE sshd IS THE GUEST'S OWN, NOT A FORWARD. A port on the host is not a machine with an ssh
  # server: the disk this job publishes is one somebody else downloads, and it has to answer on
  # 8022 by itself. `lib/android_ssh.py` explains why the server is Termux's openssh (bionic, not
  # glibc) and why a key rather than a password (no `getspnam` on Android at all).
  #
  # IT NEEDS /dev/kvm AND NOTHING ELSE. `os: android` starts an installed disk with `-netdev user`
  # and forwards 5555 (adb) and 8022 (sshd) to the loopback of the container that started qemu.
  ssh:
    needs: install
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != '' || needs.install.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          # the pulled disk, the payload tree, and the compressed artifact beside it
          disk-gb: '40'
          token: ${{ github.token }}

      - name: pull the disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.ssh_from || needs.install.outputs.tag }}
          dest: out
          token: ${{ github.token }}

      - name: take the pulled disk
        run: |
          set -euo pipefail
          DISK=$(ls out/*.qcow2 | head -1)
          echo "DISK=$DISK" >> "$GITHUB_ENV"
          qemu-img info "$DISK" | grep -E 'virtual size|disk size'

      # THE KEY IS GENERATED PER RUN AND NEVER COMMITTED. A key in the repository is a key
      # everybody reading the repository holds; the artifact is published under a tag people can
      # pull, so the account it carries has to be one this run made.
      #
      # IT IS UPLOADED AS AN ARTIFACT because the sshd in the published disk accepts it, and
      # without the private half a disk that answers is a disk nobody can log into.
      - name: make this run's login key
        run: |
          set -euo pipefail
          mkdir -p out/ssh
          ssh-keygen -t ed25519 -N '' -q -C "blissos16-ssh-${{ github.run_id }}" -f out/ssh/id_ed25519
          chmod 600 out/ssh/id_ed25519
          echo "key ${{ github.run_id }} ready"

      - name: put sshd inside Android
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-ssh
          interval: "20"
          command: |
            set -euo pipefail
            ./easyvm android/blissos16/steps/ssh.yaml \
              --boot-disk "$DISK" \
              --work out/ssh/work \
              --out out/ssh/blissos16-ssh.qcow2 \
              --public-key out/ssh/id_ed25519.pub \
              --boot-timeout "${{ inputs.launch_seconds || '600' }}"

      - name: keep the key and the verdict
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blissos16-ssh-key
          path: |
            out/ssh/id_ed25519
            out/ssh/id_ed25519.pub
            out/ssh/work/console.log
          if-no-files-found: warn
          retention-days: 30

      # THE RECORDING IS NOT MADE HERE: this stage reads no frame after the boot, so a video of
      # it would be a video of a black screen. What proves it is the ssh connection, in the log.
      - name: push the disk
        if: success()
        id: publish_ssh
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/ssh/blissos16-ssh.qcow2
          kind: android-13-blissos-ssh
          tag: ${{ inputs.ssh_publish_tag || 'android-13-blissos-ssh' }}
          token: ${{ github.token }}

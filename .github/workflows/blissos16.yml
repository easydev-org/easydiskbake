name: blissos16

# BlissOS 16.9.7 - Android 13 on x86_64, installed onto a GPT disk and started from it.
#
#     install   the ISO's own installer writes a disk, under real UEFI
#     launch    that disk boots itself, with no -kernel and no cdrom
#
# WHY THERE IS AN android/blissos16 AT ALL, WITH android/15 ALREADY HERE
#
# android/15 boots Google's AOSP image through the SDK's `emulator` binary, and that binary is
# the whole problem: it means goldfish/ranchu, and goldfish makes four things true that nothing
# downstream can fix from the guest side.
#
#     kernel-ranchu is not a bzImage    measured: 497 bytes of 0xff, HdrS at 514, no 0xAA55.
#     -system publishes no GPT uevents measured: first-stage init waits in /sys forever, so the
#                                       disks must be split into three and kept paired.
#     /data is encrypted, on nosuid      measured: dm-42 ext4 (rw,seclabel,nosuid,...).
#     su accepts root and shell only     measured: an app uid gets "not allowed".
#
# This path has none of them. BlissOS is Android-x86: a real bzImage, an initrd that assembles
# the root itself, and a plain ext4 for /data. What it needs instead is what a PC needs - a
# partition table, an ESP and a bootloader - and that is what these two stages produce.
#
# WHY 16.9.7 IS ANDROID 13, AND WHY THAT IS STILL THE NEWEST
#
# It is the newest publicly published BlissOS image. The project's own pages say "Public images
# are paused" with no ETA; the BlissOS17 (Android 14) and Voyager/18 (Android 15) directories on
# SourceForge exist and contain no ISO; BlissOS/stable_releases v17.8.3 pins android-14.0.0_r53;
# and Android 15 exists only as source in platform_manifest's voyager-qpr2-x86 tree, which has to
# be BUILT - 350 GB and hours, not a download.
#
# THE MEASUREMENTS THIS WORKFLOW DEPENDS ON
#
#   `AUTO_INSTALL` MUST NOT BE SET. install_process guards its search for the EF00 partition with
#   `[ -z "$AUTO_INSTALL" -o -n "$AUTO_UPDATE" ]`, so with it set the search is skipped, `esp`
#   stays empty, the "Choose EFI Boot" pane never appears, and install_grub_efi - the step that
#   writes BOOTX64.EFI - is never called. Two runs of that path produced FAT32 ESPs labelled EFI
#   with no BOOTX64.EFI, and disks that booted to the UEFI shell.
#
#   `-vga virtio` IS REQUIRED FOR THE INSTALLED SYSTEM. It runs Android's HWC with
#   `HWC=drm_minigbm`, which needs a DRM/KMS node; `-vga std` gives a framebuffer and no DRM
#   device, and the screen then stops on initrd's last line for as long as you wait.
#
#   THE BOOTLOADER HAS TO BE AT /EFI/BOOT. install_grub_efi writes /EFI/BLISSOS and registers its
#   entry with efibootmgr, which lands in the VARS image and not on the disk - so a disk started
#   with any other NVRAM falls into the firmware's shell. install.py copies the loaders to the
#   removable-media path and replaces the config's `search.fs_uuid` (a UUID taken before the
#   formatting, so it names a filesystem that does not exist) with a `--file` search.
#
# MANUAL ONLY: a 2.2 GB download, a full install and a boot.

on:
  workflow_dispatch:
    inputs:
      # --- what to run ------------------------------------------------------------------
      install_run:
        description: "install: write the disk from the ISO under UEFI (~15 minutes)"
        type: boolean
        default: true
      launch_run:
        description: "launch: start that disk and photograph its launcher (~10 minutes)"
        type: boolean
        default: true

      # --- where each stage starts ------------------------------------------------------
      install_from:
        description: "install: a published tag to copy instead of installing"
        default: ""
      launch_from:
        description: "launch: a published tag to start instead of the install stage's disk"
        default: ""

      # --- the disk --------------------------------------------------------------------
      disk_gb:
        description: "the disk's size"
        default: "32"
      mem_mb:
        description: "guest memory"
        default: "4096"
      launch_mem_mb:
        description: "guest memory for the launch (the installed system wants more)"
        default: "8192"
      launch_seconds:
        description: "launch: seconds the installed system may take to reach its UI"
        default: "600"

      # --- publish ---------------------------------------------------------------------
      publish_tag:
        description: "tag to publish under; empty for android-13-blissos"
        default: "android-13-blissos"

concurrency:
  group: blissos16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # INSTALL - the ISO's installer writes a bootable disk.
  # ===========================================================================
  install:
    if: inputs.install_run || inputs.install_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # THE SAME IMAGE THE WINDOWS AND macOS STAGES USE, and the right one because it carries
      # no Android SDK: this path never touches `emulator`, `avdmanager` or `kernel-ranchu`. It
      # has qemu, 7z, sfdisk, mtools, OVMF and python3, which is everything install.py needs.
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # /dev/kvm for the guest; /dev/net/tun and NET_ADMIN because lib/vm.py attaches a tap.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.install_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          # the disk is 32 GiB virtual, ~4 GiB on disk, plus the ISO and a raw view of the disk
          # while install_boot_fallback runs
          disk-gb: '40'
          token: ${{ github.token }}

      - name: show the pin
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-pin
          interval: "10"
          command: |
            set -euo pipefail
            python3 - <<'PY'
            import sys
            sys.path.insert(0, "lib")
            import images
            pin = images.BLISSOS["iso:blissos-16.9.7"]
            print(f"android  {pin['android']}")
            print(f"url      {pin['url']}")
            print(f"size     {pin['size']:,} B")
            print(f"sha256   {pin['sha256']}")
            PY

      - name: fetch and unpack the ISO
        if: inputs.install_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-fetch
          interval: "15"
          command: |
            set -euo pipefail
            # --drop-iso is NOT used: the installer unpacks /src/install.img out of the ISO at
            # run time, so the ISO has to be beside the kernel when install.py starts.
            python3 android/blissos16/fetch_iso.py --out out/bliss

      - name: pull the disk
        if: inputs.install_from != ''
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.install_from }}
          dest: out
          token: ${{ github.token }}

      - name: unpack the disk
        if: inputs.install_from != ''
        run: |
          set -euo pipefail
          mkdir -p out/bliss
          tar -xf out/blissos16.tar.zst -C out/bliss
          ls -la out/bliss

      # ---- THE INSTALL ---------------------------------------------------------------
      # install.py partitions the blank qcow2 with sfdisk, boots the ISO's installer under OVMF,
      # answers its nine panes with the key sequence measured by hand, copies the bootloaders to
      # /EFI/BOOT, and verifies the ESP. It says VERDICT PASS only when all of that happened.
      - name: install to a disk
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-install
          interval: "20"
          command: |
            set -euo pipefail
            mkdir -p out/install
            python3 android/blissos16/install.py \
              --dir out/bliss \
              --iso out/bliss/bliss16.iso \
              --disk out/bliss/blissos16.qcow2 \
              --work out/install \
              --artifacts out/install \
              --disk-gb "${{ inputs.disk_gb || '32' }}" \
              --mem "${{ inputs.mem_mb || '4096' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blissos-install
          path: |
            out/install/install.txt
            out/install/console.log
          if-no-files-found: warn
          retention-days: 14

      # WHAT A TAG HOLDS: THE DISK, AND THE TWO FILES THE INSTALLER READS FROM THE ISO.
      #
      # kernel and initrd.img are on the disk already, so only the disk matters for starting it.
      # They are packed anyway because `--dir` is what install.py expects, and a tag that cannot
      # be re-installed from is a tag nobody can debug.
      - name: pack the disk
        if: success() && inputs.install_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-pack
          interval: "15"
          command: |
            set -euo pipefail
            cd out/bliss
            tar -cf ../blissos16.tar blissos16.qcow2
            cd ..
            zstd -19 -f blissos16.tar -o blissos16.tar.zst
            rm -f blissos16.tar
            ls -la blissos16.tar.zst

      - name: push the disk
        if: success() && inputs.install_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/blissos16.tar.zst
          kind: android-13-blissos
          tag: ${{ inputs.publish_tag || 'android-13-blissos' }}
          token: ${{ github.token }}

  # ===========================================================================
  # LAUNCH - the disk starts itself, with no ISO and no -kernel.
  # ===========================================================================
  #
  # THE STAGE THAT PROVES THE ARTEFACT. install.py reads the ESP to check that BOOTX64.EFI is on
  # it; that is a claim about bytes. This is the claim about the machine: the firmware finds the
  # ESP, GRUB runs, the installed kernel boots the installed system, and a launcher is drawn.
  launch:
    needs: install
    if: |
      always() && inputs.launch_run
      && (inputs.launch_from != '' || needs.install.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # /dev/kvm ONLY. launch.py sets Shape.net="none", and lib/vm.py's build_args gives such a
      # guest `-netdev user` instead of a tap - measured: with the tap still on the command line
      # but no /dev/net/tun in the pod, qemu exited before the first QMP message and the stage
      # died on ConnectionResetError. The frames come over QMP, so the guest needs no address.
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: pull the disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.launch_from || needs.install.outputs.tag }}
          dest: out
          token: ${{ github.token }}

      - name: unpack the disk
        run: |
          set -euo pipefail
          mkdir -p out/bliss
          tar -xf out/blissos16.tar.zst -C out/bliss
          qemu-img info out/bliss/blissos16.qcow2 | grep -E 'virtual size|disk size'

      # ---- LAUNCH --------------------------------------------------------------------
      # No --iso and no --kernel: the firmware starts the disk. `launch.py` waits for the
      # launcher (or the lock screen, which is what a second boot shows), wakes it if it is the
      # lock screen, and keeps screen.png.
      - name: start the disk and photograph it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: blissos-launch
          interval: "20"
          command: |
            set -euo pipefail
            mkdir -p out/launch
            python3 android/blissos16/launch.py \
              --disk out/bliss/blissos16.qcow2 \
              --work out/launch \
              --artifacts out/launch \
              --mem "${{ inputs.launch_mem_mb || '8192' }}" \
              --seconds "${{ inputs.launch_seconds || '600' }}"

      - name: keep the screen and the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blissos-launch
          path: |
            out/launch/launch.txt
            out/launch/console.log
            out/launch/screen.png
            out/launch/desktop.ppm
          if-no-files-found: warn
          retention-days: 14

name: windows-11_desktop-launch

# Start a published Windows disk on KVM and photograph the screen.
#
# WHAT THIS ANSWERS
#
#     does the artifact in ghcr actually boot to a desktop
#
# bake-windows publishes a disk and a bootstate archive. The ssh stage starts one and
# waits for a desktop, and when that fails it says
#
#     the guest did not reach a desktop
#
# which is true of two very different situations: the firmware could not find a boot
# loader, or Windows booted and the desktop test does not recognise what it drew.
#
# Run 41483694400 was the first of those. Seventy-five frames were captured, twenty-one
# had a picture in them, and the brightest read
#
#     BdsDxe: failed to load Boot000A "Windows Boot Manager" from HD(1,GPT,...)
#       /EFI/Microsoft/Boot/bootmgfw.efi: Not Found
#     >>Start PXE over IPv4.
#     PXE-E16: No valid offer received.
#     UEFI Interactive Shell v2.2
#
# and the report was nine minutes of "waiting Ns for a desktop". So this runs BEFORE the
# ssh stage: if the disk does not reach a desktop, there is no point typing into it.
#
# MANUAL ONLY, like every other workflow here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The disk to start (a tag in this package)"
        default: "windows-base-20261102-155400"
      bootstate_run:
        description: "The run that produced the disk's bootstate artifact"
        default: ""
      bootstate_artifact:
        description: "The artifact name to download from that run. The base bake uploads
          windows11-bootstate and the ssh and dev bakes upload windows-ssh-bootstate and
          windows-dev-bootstate - they are not interchangeable, and guessing the wrong one
          used to be a warning that surfaced nine minutes later as 'no bootstate'"
        default: "windows11-bootstate"
      boot_timeout:
        description: "Seconds to wait for a desktop"
        default: "900"
      tpm:
        description: "Provide a TPM 2.0 (off by default, like dockur-windows)"
        type: boolean
        default: false
      resolution:
        description: "Guest screen as WxH"
        default: "1920x1080"
      probe_shell:
        description: "If the firmware drops to its shell, type into it to find out why"
        type: boolean
        default: true
      probe_after:
        description: "Seconds to wait for a desktop before probing (-1 = immediately)"
        default: "-1"
      check_ssh:
        description: "After the desktop, assert sshd answers on port 2222 (for a bake-windows-ssh disk)"
        type: boolean
        default: false

concurrency:
  group: launch-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      packages: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: windows-launch-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # The disk in, a working copy, and room for qemu's own state.
            python3 lib/ci.py free-disk --need 30
            python3 lib/ci.py tags --prefix windows-

      # THE BOOTSTATE IS NOT OPTIONAL FOR WINDOWS. OVMF's variables carry the
      # "Windows Boot Manager" entry and the TPM holds the state Windows sealed against
      # it; a disk without both drops into the firmware shell - which is what the first
      # ssh attempt looked like before this was understood.
      #
      # A FAILED DOWNLOAD IS A FAILED RUN. This step used to carry
      # `continue-on-error: true`, so a wrong artifact name uploaded nothing and the
      # failure only appeared after the disk had been pulled, copied and checked - run
      # 41592865333 spent four minutes on that to end with "no bootstate at ...".
      #
      # THE NAME IS AN INPUT because the three Windows bakes upload three differently
      # named archives: windows11-bootstate from the base, windows-ssh-bootstate from the
      # ssh stage, windows-dev-bootstate from the dev stage. They are not
      # interchangeable and there is no way to infer which one a tag came from.
      - name: pull the bootstate
        if: inputs.bootstate_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.bootstate_artifact }}
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.bootstate_run }}

      - name: launch it and photograph the screen
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: windows-launch
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            USE_TPM=""
            if [ "${{ inputs.tpm }}" = "true" ]; then USE_TPM="--tpm"; fi
            PROBE=""
            if [ "${{ inputs.probe_shell }}" = "true" ]; then
              PROBE="--probe-shell --probe-after ${{ inputs.probe_after || '-1' }}"
            fi
            CHECK=""
            if [ "${{ inputs.check_ssh }}" = "true" ]; then CHECK="--check-ssh"; fi
            # THE ARCHIVE'S NAME IS WHATEVER THE UPLOADING STAGE CALLED IT.
            #
            # bake.py saves beside the PUBLISHED name, so the base bake's is
            # windows11.qcow2.bootstate.tar.gz and the ssh stage's is
            # windows11-ssh.qcow2.bootstate.tar.gz. This line used to name the first one
            # literally, which meant a launch from any other disk said "no bootstate at
            # ..." after pulling and copying twelve gigabytes.
            #
            # There is exactly one archive in out/ or none, so finding it is not a guess.
            ARCHIVE=$(ls out/*.bootstate.tar.gz 2>/dev/null | head -1)
            if [ -z "$ARCHIVE" ]; then
              echo "=== NO BOOTSTATE ARCHIVE IN out/ ==="
              echo "  the disk will not boot without OVMF's variables; the artifact"
              echo "  upload is what puts one here"
              ls -la out/ || true
              exit 1
            fi
            echo "bootstate: $ARCHIVE"
            python3 lib/launch_windows.py \
              --tag "${{ inputs.tag }}" \
              $CHECK \
              $USE_TPM \
              --bootstate "$ARCHIVE" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --resolution "${{ inputs.resolution || '1920x1080' }}" \
              $PROBE \
              --artifacts out

      # THE FRAME IS THE RESULT. A launch that reports "no desktop" and shows nothing has
      # not said where it stopped; the picture is what turned nine silent minutes into
      # "the firmware could not find bootmgfw.efi".
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-screenshots
          path: |
            out/install.mp4
            out/screen.png
            # One PNG per sample, named by the second it was taken: a cancelled run
            # uploads the whole timeline instead of only the last frame.
            out/frames/screen-*.png
            out/launch.txt
            out/launch-work/console.log
            out/launch-work/swtpm.log
            out/launch-work/swtpm.log
          if-no-files-found: warn
          retention-days: 14

name: bake-nixos

# Install NixOS and derive its desktops, entirely inside this job's container.
#
# TWO STEPS, NOT SEVEN INSTALLS.
#
#   base     nixos-install on the official ISO -> a plain NixOS. About five minutes.
#   derive   boot the base, nixos-rebuild boot with one desktop -> one disk per desktop.
#
# nixos-install partitions, formats and unpacks the whole base closure every time it
# runs, and every flavour would pay for that separately. So it runs once, and each
# desktop costs only its own closure - which is why easysandbox-vm structures its six
# desktops this way.
#
# WHY THE INSTALL IS TYPED AT A SERIAL CONSOLE
#
# NixOS has no answer file. Its installer is nixos-install, run by hand, so this bake
# writes the commands to the guest's serial console and judges the result from the exit
# status the guest prints. Every other distribution here is driven through the screen
# instead - MX's minstall and Mint's ubiquity are wizards - and that difference is a fact
# about the installers, not a preference.
#
# MANUAL ONLY, like every other workflow here.

on:
  workflow_dispatch:
    inputs:
      desktops:
        description: "Comma-separated desktops to derive (labwc,gnome,kde,cosmic,hyprland,miracle), or empty for the base only"
        default: ""
      publish:
        description: "Push the disks to ghcr"
        type: boolean
        default: true
      disk_size:
        description: "Base disk size"
        default: "20G"
      install_timeout:
        description: "Seconds the installer may run"
        default: "3600"
      derive_timeout:
        description: "Seconds one derive may run"
        default: "3600"

concurrency:
  group: bake-nixos-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  base:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 30
            python3 lib/ci.py tags --prefix iso-nixos

      - name: install the base
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-base
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            python3 linux/nixos/bake.py \
              --out out/nixos-base.qcow2 \
              --disk-size "${{ inputs.disk_size || '20G' }}" \
              --timeout "${{ inputs.install_timeout || '3600' }}"

      # THE CONSOLE IS THE ONLY RECORD OF WHAT THE GUEST DID. NixOS has no framebuffer
      # worth photographing during an install - it is a text console - so the log is the
      # artifact that explains a failure, and it is uploaded on every outcome.
      - name: keep the base console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-base-console
          path: |
            out/console.log
            out/nixos-base.qcow2
          if-no-files-found: warn
          retention-days: 7

      - name: push the base
        if: ${{ success() && (inputs.publish == true || inputs.publish == null) }}
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-publish
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            python3 lib/publish_disk.py out/nixos-base.qcow2 \
              --kind nixos-base --tag nixos-base

  derive:
    needs: base
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
      packages: write
    strategy:
      # ONE FAILURE MUST NOT HIDE THE OTHERS' RESULTS: a desktop whose closure is broken
      # is a fact about that desktop, and the other five are still worth building.
      fail-fast: false
      matrix:
        # THE INPUT IS A COMMA-SEPARATED LIST, AND EMPTY MEANS ALL SIX.
        #
        # GitHub's expression language has no `replace` (it has join and split), so a
        # list is cut with split and rebuilt with join. `desktops` is split on ",", and an
        # empty input yields [""] - which join turns back into "" and the comparison
        # catches. That is why the default branch is tested before the split.
        desktop: ${{ fromJSON(
          github.event.inputs.desktops == ''
            && '["labwc","gnome","kde","cosmic","hyprland","miracle"]'
            || format('["{0}"]', join(split(github.event.inputs.desktops, ','), '","'))
        ) }}

    steps:
      - uses: actions/checkout@v4

      - name: pull the base
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: derive-pull
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            oras pull "ghcr.io/${{ github.repository }}:nixos-base" -o out/base
            ls -la out/base/
      
      - name: derive
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: derive-${{ matrix.desktop }}
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            python3 linux/nixos/derive.py \
              --base out/nixos-base.qcow2 \
              --desktop "${{ matrix.desktop }}" \
              --out "out/nixos-${{ matrix.desktop }}.qcow2" \
              --timeout "${{ inputs.derive_timeout || '3600' }}"

      - name: keep the console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-${{ matrix.desktop }}-console
          path: out/derive.log
          if-no-files-found: warn
          retention-days: 7

name: macos15

# macOS 15: recovery -> Setup Assistant -> desktop -> ssh -> dev.
#
#     setup ──> desktop ──> ssh ──> dev
#
# WHY ONE WORKFLOW
#
# These were four workflows, and each had to be started by hand with the tag the previous one
# produced: a form per stage, a chance per stage to type the tag wrong, and nothing in any run
# graph recording that they are a chain at all. The chain is four stages here because macOS
# genuinely fails in four different places - the installer, the wizard, Remote Login, the
# toolchain - and each is worth its own job and its own timeout.
#
# EVERY JOB TAKES A TAG, AND THAT IS THE POINT
#
#     <job>_run          should this job run
#     <job>_from         the tag to pull; empty means "use what the job above produced"
#
# NO BOOTSTATE IS PASSED BETWEEN THESE JOBS, AND THAT IS DIFFERENT FROM WINDOWS.
#
# A Windows disk boots by a boot entry in its OVMF variables, so every stage there needs the run
# id that holds them. macOS does not: lib/opencore.build() writes a fresh copy of the firmware
# variables from a pinned template every time a machine starts, and OpenCore is booted from
# boot.img, which travels inside the disk's own directory. The tag is the whole handoff.
#
# `if: always() && ...` on every downstream job is what lets one start in the middle: `needs`
# alone skips a job when the one above was skipped, and that is exactly the case of starting
# from a tag. The real precondition is that there is a tag to pull, so that is what it tests.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      # --- what to run ---------------------------------------------------------------
      setup_run:
        description: "Install macOS 15 and stop at the Setup Assistant (~60 minutes)"
        type: boolean
        default: true
      desktop_run:
        description: "Drive the Setup Assistant to a desktop (~20 minutes)"
        type: boolean
        default: true
      ssh_run:
        description: "Turn on Remote Login"
        type: boolean
        default: true
      vm_configure_run:
        description: "Share a host directory and install the login hook (no toolchain)"
        type: boolean
        default: true
      dev_run:
        description: "Install the toolchain over ssh"
        type: boolean
        default: true
      launch_dev_run:
        description: >-
          Boot the dev disk a second time, put a bootstrap in a host share, and check it ran.
          Writes ~/hello.txt INSIDE the guest; publishes nothing.
        type: boolean
        default: true

      # --- where each job starts -----------------------------------------------------
      setup_from:
        description: "setup: pull this tag instead of installing"
        default: ""
      desktop_from:
        description: "desktop: pull this tag instead of the setup job's output"
        default: ""
      ssh_from:
        description: "ssh: pull this tag instead of the desktop job's output"
        default: ""
      vm_configure_from:
        description: "share: pull this tag instead of the ssh job's output"
        default: ""
      dev_from:
        description: "dev: pull this tag instead of the share job's output"
        default: ""
      launch_dev_from:
        description: "launch_dev: the tag to boot; empty for the dev job's output"
        default: ""

      # --- setup ----------------------------------------------------------------------
      release:
        description: "setup: macOS release"
        default: "15"
      disk_size:
        # 128G, AND XCODE FITS IN IT WITH ROOM TO SPARE.
        #
        # The arithmetic, so the next person does not have to redo it: macOS 15 installs to
        # about 30 GiB, the toolchain and its formulas add about 3, Xcode 26.3 expands to
        # about 20 with its platform packages, and the .xip is 2.7 while it is being expanded
        # and is deleted afterwards. That is 56 GiB of a 128 GiB disk.
        #
        # The size is FIXED rather than a variable per stage for the reason macos/15's own
        # setup.yaml gives: the Disk Utility coordinates are measured on the disk the workflow
        # actually bakes, and a different size moves the window.
        description: "setup: guest disk size"
        default: "128G"
      install_timeout:
        description: "setup: seconds the installer may run"
        default: "7200"
      assistant_timeout:
        description: "setup: seconds the Setup Assistant driver may run"
        default: "2700"
      wizard_timeout:
        description: >-
          setup: seconds to wait for the installer to finish and the wizard to appear. This
          is the copy and the first boot, not the wizard - the pane itself says ~45 minutes.
        default: "7200"
      desktop_timeout:
        description: "desktop: seconds to wait for a desktop after the wizard"
        default: "1800"
      inspect_after:
        description: >-
          desktop: stop this many seconds after the wizard's last click, keep the recording
          and publish nothing. For looking at what the wizard did instead of waiting out
          desktop_timeout. Empty means a normal run.
        default: ""

      # --- ssh / dev -------------------------------------------------------------------
      ssh_port:
        # 2222, THE SAME PORT EVERY OTHER SYSTEM USES. It was 2223 for no reason that
        # survives inspection: each job is its own container on its own network, so a
        # macOS run and a Linux run forwarding 2222 are forwarding to two different
        # loopback interfaces. The odd number only meant a reader had to remember which
        # system was special.
        description: "ssh: host port forwarded to the guest's sshd"
        default: "2222"
      boot_timeout:
        description: "ssh: seconds to wait for the desktop"
        default: "900"
      publish_tag:
        description: "the tag to publish under; empty for macos15-<stage>"
        default: ""
      isolate:
        description: >-
          Run beside other macos15 runs instead of queueing behind them. Any short string;
          it becomes part of the concurrency group. Empty keeps the default single-run queue.
          Each job is its own container on its own network, so the forwarded ports do not
          collide - the queue is the only thing that made runs exclusive.
        default: ""

# ONE RUN OF THIS WORKFLOW AT A TIME, UNLESS THE RUN SAYS OTHERWISE.
#
# `group: macos15-<ref>` puts every run in the same queue, so a second dispatch waits for the
# first to finish rather than starting beside it. That is right for a full chain - two setups
# writing to the same tag is two bakes of the same thing - and wrong for a single stage being
# re-checked while a full chain is in flight, which is the case this exists for: run the ssh
# stage alone against the already-published macos15-desktop, and let it work while the setup
# job of another run is still installing.
#
# `isolate` NAMES THE COMPETING RUN. The default is empty and every ordinary dispatch keeps
# the shared group, so nothing changes for a normal run. A dispatch that sets it gets a group
# of its own and runs beside whatever else is going on - and the caller is saying, in the
# input, that it knows what it is doing.
concurrency:
  group: macos15-${{ github.ref }}${{ inputs.isolate != '' && format('-{0}', inputs.isolate) || '' }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # SETUP - install to the Setup Assistant and stop there.
  # ===========================================================================
  setup:
    if: inputs.setup_run || inputs.setup_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.setup_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-setup-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: bake
        if: inputs.setup_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-setup
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL="${{ inputs.snapshot_interval || '1' }}"
            export RECORD_FPS=1
            export MACOS_USER=vmuser
            export MACOS_PASSWORD=admin
            python3 macos/15/bake.py \
              --steps macos/15/steps/setup.yaml \
              --out "out/macos15.qcow2" \
              --release "15" \
              --disk-size "${{ inputs.disk_size || '128G' }}" \
              --timeout "${{ inputs.install_timeout || '7200' }}" \
              --assistant-timeout "${{ inputs.assistant_timeout || '2700' }}" \
              --wizard-timeout "${{ inputs.wizard_timeout || '7200' }}" \
              --desktop-timeout "${{ inputs.desktop_timeout || '1800' }}"

      - name: keep the recording
        if: always() && inputs.setup_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: macos15-setup-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the last frame
        if: always() && inputs.setup_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: macos15-setup-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      # THE BOOTSTATE GOES WITH THE DISK. OpenCore's boot entry and the firmware variables live
      # in the work directory, not on the disk and not in the tag.
      # A PLAIN `run:` STEP, BECAUSE THIS IS WHERE THE NEXT JOB'S TAG COMES FROM. GITHUB_OUTPUT
      # is the runner's own mechanism; routing it through a third-party action would make the
      # chain depend on how that action treats the variable.
      - name: push the disk
        if: success() && inputs.setup_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos15.qcow2
          kind: macos15-setup
          tag: ${{ inputs.publish_tag || 'macos15-setup' }}
          token: ${{ github.token }}
  desktop:
    needs: setup
    if: |
      always() && inputs.desktop_run
      && (inputs.desktop_from != '' || needs.setup.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.desktop_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-desktop-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: pull the setup disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.desktop_from || needs.setup.outputs.tag }}
          dest: out
          token: ${{ github.token }}
      - name: drive the Setup Assistant
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          # THE NAME CARRIES THE RUN, BECAUSE TWO WORKFLOWS SHARE THIS SUITE.
          #
          # macos15.yml and macos26.yml both run this stage under the name `desktop-drive`,
          # and both were dispatched against the same commit - so the two check runs had the
          # same name, the same sha and the same repository. Reading one, there was no way to
          # tell which run it belonged to, and an hour was spent reading macos26's log while
          # looking for macos15's. run 42280638394 was the cost.
          #
          # github.run_id is unique per dispatch and is what the rest of the workflow already
          # uses to key its artifacts.
          name: desktop-drive-${{ github.run_id }}
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=1
            export MACOS_USER=vmuser
            export MACOS_PASSWORD=admin
            DISK=$(ls out/*.qcow2 | head -1)
            echo "setup disk: $DISK"
            python3 macos/15/desktop.py \
              --steps macos/15/steps/sequoia.yaml \
              --disk "$DISK" \
              --out out/macos15-desktop.qcow2 \
              --assistant-timeout "${{ inputs.assistant_timeout || '2700' }}" \
              --desktop-timeout "${{ inputs.desktop_timeout || '1800' }}" \
              ${{ inputs.inspect_after != '' && format('--inspect-after {0}', inputs.inspect_after) || '' }}

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-desktop-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-desktop-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos15-desktop.qcow2
          kind: macos15-desktop
          tag: ${{ inputs.publish_tag || 'macos15-desktop' }}
          # THIS STAGE CHANGES THE DISK, SO ITS OUTPUT MUST DIFFER FROM ITS INPUT.
          #
          # Run 42831281414 published a `macos15-desktop` whose content layer digest was
          # IDENTICAL to `macos15-setup` - eight minutes of video showing the Setup Assistant
          # still on screen, and sixteen walkthrough steps reported green. oras reused the
          # layer, the push said "Uploaded", and the ssh stage that pulled it booted a disk
          # that had never been through the wizard.
          #
          # The tag this stage was given is the file oci-pull wrote into `out/`, and each
          # stage writes its output under a different name - so the input can be named here
          # without guessing.
          distinct-from: out/${{ inputs.desktop_from || needs.setup.outputs.tag }}.qcow2
          token: ${{ github.token }}
  ssh:
    needs: desktop
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != '' || needs.desktop.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.ssh_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-ssh-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: pull the desktop disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.ssh_from || needs.desktop.outputs.tag }}
          dest: out
          token: ${{ github.token }}
      - name: enable Remote Login
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-enable
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=1
            export MACOS_USER=vmuser
            export MACOS_PASSWORD=admin
            DISK=$(ls out/*.qcow2 | head -1)
            python3 macos/15/ssh.py \
              --steps macos/15/steps/ssh.yaml \
              --disk "$DISK" \
              --out out/macos15-ssh.qcow2 \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-ssh-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-ssh-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      # THE SIX FRAMES THE SEQUENCE TAKES OF ITSELF. enable_remote_login() calls shot() after
      # every step - opened, searched, pane, remote-login-on, full-disk-access, done - and
      # those are the only record of WHICH STEP DID NOT LAND when the switch sequence runs but
      # sshd still does not answer. Run 42162859846 had that exact outcome and the six frames
      # were written to the work directory and thrown away with the container.
      - name: keep the remote-login frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-ssh-remote-login-frames
          path: out/remote-login-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos15-ssh.qcow2
          kind: macos15-ssh
          tag: ${{ inputs.publish_tag || 'macos15-ssh' }}
          # TURNING REMOTE LOGIN ON WRITES TO THE DISK - the launchd job, the sshd config, the
          # account's access table - so an output identical to the input is a stage that did
          # nothing and published anyway. See the longer note on the desktop push.
          distinct-from: out/${{ inputs.ssh_from || needs.desktop.outputs.tag }}.qcow2
          token: ${{ github.token }}
  # ===========================================================================
  # SHARE - the host directory and the login hook, BEFORE any toolchain.
  # ===========================================================================
  #
  # WHY THIS IS A SEPARATE STAGE AND WHY IT COMES FIRST
  #
  # It needs nothing installed. The share is an SMB mount and the launcher is /bin/sh, so this
  # runs on a disk straight out of the ssh stage - and a failure here is about the share rather
  # than about a 2.7 GiB Xcode download. That also means the two can be re-run independently: a
  # broken mount no longer costs an hour of Xcode first.
  vm-configure:
    needs: ssh
    if: |
      always() && inputs.vm_configure_run
      && (inputs.vm_configure_from != '' || needs.ssh.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.vm_configure_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-vm-configure-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: pull the ssh disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.vm_configure_from || needs.ssh.outputs.tag }}
          dest: out
          token: ${{ github.token }}

      - name: configure the vm (share, login hook, guest agent)
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-vm-configure
          interval: "20"
          command: |
            set -euo pipefail
            DISK=$(ls out/*.qcow2 | head -1)
            python3 macos/15/vm_configure.py \
              --disk "$DISK" \
              --out out/macos15-vm-configure.qcow2 \
              --ssh-port "${{ inputs.ssh_port || '2222' }}"

      - name: clean the disk
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-vm-configure-clean
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/clean_step.py \
              --disk out/macos15-vm-configure.qcow2 \
              --kind macos \
              --work out/macos15-vm-configure-clean-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '1800' }}" \
              --mem 8192

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-vm-configure-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos15-vm-configure.qcow2
          kind: macos15-vm-configure
          tag: ${{ inputs.publish_tag || 'macos15-vm-configure' }}
          token: ${{ github.token }}

  dev:
    needs: vm-configure
    if: |
      always() && inputs.dev_run
      && (inputs.dev_from != '' || needs.share.outputs.tag != '')
    runs-on: ubuntu-24.04
    # 240 MINUTES, BECAUSE XCODE IS THE SLOWEST STEP IN THE WHOLE CHAIN.
    #
    # The .xip is 2.7 GiB, `xip -x` on it takes several minutes and prints nothing, and
    # `xcodebuild -runFirstLaunch` installs the bundled platform packages - about ten minutes
    # on this guest with nothing else running. Two hours was enough for brew and six formulas
    # and is not enough for those two, so the budget is the one that fits the stage.
    timeout-minutes: 240
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-dev-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: pull the ssh disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.dev_from || needs.ssh.outputs.tag }}
          dest: out
          token: ${{ github.token }}
      - name: install the toolchain
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-install
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            DISK=$(ls out/*.qcow2 | head -1)
            # NO --clean: the step below is the clean, and macos/15/dev.py no longer takes
            # the flag. The one it used to take wrote zeros with dd, which is the mechanism
            # this repository abandoned - on APFS it allocates new blocks before releasing
            # the old ones. lib/macclean.py uses `diskutil apfs trim`, which is discard.
            python3 macos/15/dev.py \
              --disk "$DISK" \
              --out out/macos15-dev.qcow2 \
              --ssh-port "${{ inputs.ssh_port || '2222' }}"

      - name: clean the disk
        # EVERY STAGE THAT MODIFIES A DISK IS FOLLOWED BY ONE OF THESE.
        #
        # macOS used to have no clean step anywhere: setup, desktop, ssh and dev each only
        # added to the disk, so the image was published at whatever size four stages of
        # writing reached. The cleaning existed only inside macos/15/ssh.py, where it was
        # invisible in the run's step list and never ran for desktop or dev.
        #
        # lib/macclean.py is the cleaner. It DELETES, and that is all it can do: macOS has no
        # trim verb (`diskutil apfs trim` does not exist - `diskutil apfs` lists 21 and trim
        # is not among them), and APFS does not forward a discard to virtio-blk when a file is
        # unlinked, so the qcow2 keeps every cluster it ever allocated either way. Measured:
        # `rm` of 2 GB left the image at 8,899,136 blocks before and after.
        #
        # The zero-writing versions (secureErase, zeroDisk, and the dd that used to be in
        # macos/15/dev.py) are still the right thing to avoid: on a copy-on-write filesystem
        # they allocate new blocks before releasing the old ones, which makes the image larger
        # rather than smaller.
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos15-dev-clean
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/clean_step.py \
              --disk out/macos15-dev.qcow2 \
              --kind macos \
              --work out/macos15-dev-clean-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '1800' }}" \
              --mem 8192

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-dev-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos15-dev.qcow2
          kind: macos15-dev
          tag: ${{ inputs.publish_tag || 'macos15-dev' }}
          # XCODE, NODE AND PYTHON ARE GIGABYTES ON THIS DISK; a dev disk identical to the ssh
          # disk it came from is a toolchain stage that installed nothing.
          distinct-from: out/${{ inputs.dev_from || needs.ssh.outputs.tag }}.qcow2
          token: ${{ github.token }}

  # ===========================================================================
  # LAUNCH DEV - boot the finished disk and prove the bootstrap chain ran.
  # ===========================================================================
  #
  # WHY THIS JOB EXISTS AND IS NOT PART OF `dev`.
  #
  # `dev` proves the toolchain is on the disk. It cannot prove the LAUNCHER works, for two
  # reasons that are both structural:
  #
  #     the launcher fires at LOGIN, and `dev` is already logged in when it runs
  #     anything a stage wrote to prove it would land on the PUBLISHED disk
  #
  # So the disk is started a second time, exactly as a person would: the host serves ~/shared,
  # a bootstrap.py is dropped there, and the guest is left to find it. ~/hello.txt is written
  # INSIDE the guest and dies with the launch - it is never in an artifact, which is the
  # property that makes this a test rather than a fixture.
  #
  # `needs: dev` with `always()` is the same rule as every other downstream job: a tag to pull
  # is the real precondition, so this can also be run against a disk that already exists.
  launch_dev:
    needs: dev
    if: |
      always() && inputs.launch_dev_run
      && (inputs.launch_dev_from != '' || needs.dev.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          # THE DISK TWICE PLUS A COPY. launch_selftest copies the pulled disk before opening
          # it (the test must not touch the artifact), and the macos disk is ~16 GiB.
          disk-gb: '80'
          token: ${{ github.token }}

      - name: pull the dev disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.launch_dev_from || needs.dev.outputs.tag }}
          dest: out
          token: ${{ github.token }}

      - name: boot it and check the bootstrap ran
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-dev
          interval: "20"
          command: |
            set -euo pipefail
            DISK=$(ls out/*.qcow2 | head -1)
            python3 lib/launch_selftest.py \
              --family macos \
              --disk "$DISK" \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.boot_timeout || '1800' }}"

      # THE REPORT IS THE EVIDENCE, and it is kept even when the launch failed - a failed
      # launch is exactly when someone wants to read it.
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-launch-dev-report
          path: |
            out/selftest-work/shots
            out/selftest-work/console.log
          if-no-files-found: warn
          retention-days: 7

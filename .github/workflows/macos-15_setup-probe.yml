name: macos-15_setup-probe

# Click Continue through the macOS installer and keep the last frame of every pane.
#
# WHY THIS WORKFLOW EXISTS
#
# Every macOS run so far has failed on a coordinate, and the coordinates were always
# plausible - inside the screen, near where that control usually sits. What was missing
# was a cheap way to ask the guest what its panes look like, so each attempt cost twenty
# minutes and answered one question.
#
# This is that instrument. It boots the same machine the bake boots - macos/15/machine.py
# is the single definition - clicks Continue twelve times at the one position that is
# known, and saves the last frame of every screen it passes through. Where the run stops
# is the pane nobody has measured yet.
#
# WHAT IT PRODUCES
#
#     out/probe/panes/pane-NNNN.ppm   the last frame of each distinct screen
#     out/probe/panes/index.txt       pane, frame, size, and tesseract's reading of it
#     out/probe/frames/frame-NNNN.ppm one per click, for the ones OCR gets wrong
#     out/probe/probe.mp4             the whole sequence as video
#
# The OCR runs in the job, after the clicking, on files. The driver still clicks blind;
# reading happens where being wrong costs a paragraph instead of a run.
#
# WHAT IT DELIBERATELY DOES NOT DO
#
# It does not agree to a licence, erase a disk, or pick one. Those need to know where a
# control is, and that is the answer this produces rather than an input it needs.
#
# MANUAL ONLY: it boots a Mac for about ten minutes to produce a handful of pictures.

on:
  workflow_dispatch:
    inputs:
      wait_boot:
        description: "Seconds before the first click, for the Recovery menu to draw"
        default: "180"
      clicks:
        description: "How many Continue presses to try"
        default: "12"
      interval:
        description: "Seconds between a click and the next screenshot"
        default: "20"

concurrency:
  group: probe-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: probe
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos-probe
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 20
            export GITHUB_TOKEN="${{ github.token }}"
            python3 macos/15/probe.py \
              --out out/probe \
              --wait-boot "${{ inputs.wait_boot || '180' }}" \
              --clicks "${{ inputs.clicks || '12' }}" \
              --interval "${{ inputs.interval || '20' }}"

      # The panes are the product: one image per screen, named by order, with an index
      # that carries tesseract's reading beside it.
      - name: keep the panes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-panes
          path: |
            out/probe/panes/
            out/probe/probe.mp4
            out/probe/work/console.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # Every click, as a fallback for the panes OCR could not read. Kept separately
      # because it is twenty times the size and usually not needed.
      - name: keep every frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-probe-frames
          path: out/probe/frames/*.ppm
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

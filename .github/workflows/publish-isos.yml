name: publish-isos

# Fetch installer images once, verify them, and push each as an OCI layer to this
# repository's own ghcr package.
#
#     ghcr.io/<owner>/<repo>:iso-<name>
#
# WHY THIS EXISTS
#
# Every bake used to download its own image from whatever host the distribution
# points at, at run time, with the job clock running. Measured:
#
#     SourceForge served MX at 967 KB/s and then hung for 56 minutes with an
#     empty log; Mint's mirror answers at 124 KB/s, which is 40 minutes for 3 GB.
#
# Those are the two that were watched. The other twelve were never watched closely
# enough to know, which is the actual argument: a mirror is a dependency nobody
# measures.
#
# lib/iso.py refuses to fall back to a mirror, deliberately - see its docstring. This
# workflow is what makes that refusal survivable.
#
# WHY EVERY IMAGE IS CHECKED THREE WAYS
#
# A truncated ISO boots to a GRUB prompt and looks like a broken bake. Each of these
# caught one:
#
#   exact byte count      the transfer stopped early with an exit code of 0
#   ISO9660 signature     an HTML error page served with 200 OK
#   stalled-transfer abort  the SourceForge hang above: not dead, just doing nothing

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Image name to publish (see the matrix)"
        type: choice
        options:
          - mx
          - alpine
          - debian
          - ubuntu
          - fedora
          - arch
          - all
        default: all

# MANUAL ONLY. Publishing an ISO is a deliberate act: it downloads gigabytes and
# overwrites a tag that every bake depends on. A schedule here would mean the cache
# changes under a bake that was already planned.

concurrency:
  group: publish-isos-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # name          url                                                         sha256
          - name: mx
            url: https://sourceforge.net/projects/mx-linux/files/Final/Xfce/MX-25.3_x64.iso/download
            sha256: ""          # SourceForge rotates; verified by size and signature
          - name: alpine
            url: https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64/alpine-virt-3.21.3-x86_64.iso
            sha256: ""

    steps:
      - uses: actions/checkout@v4

      - name: skip unless selected
        id: want
        run: |
          want="${{ inputs.name || 'all' }}"
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.name }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: fetch and verify
        if: steps.want.outputs.run == 'true'
        run: |
          set -euo pipefail

          name="${{ matrix.name }}"
          url="${{ matrix.url }}"
          expected_sha="${{ matrix.sha256 }}"

          echo "=== $name from $url ==="

          # --speed-limit/--speed-time is the stalled-transfer abort. Without it a
          # connection that trickles at 1 KB/s looks alive for the full max-time.
          curl -fSL --retry 4 --retry-delay 5 --retry-all-errors \
            --max-time 3600 --speed-time 120 --speed-limit 20480 \
            -o "$name.iso" "$url"

          echo "=== the three checks ==="

          size=$(stat -c%s "$name.iso")
          echo "  bytes: $size"
          # An ISO is never smaller than a few hundred megabytes. This is a floor,
          # not the verification: the hash below is the verification.
          if [ "$size" -lt 100000000 ]; then
            echo "  TOO SMALL: the transfer stopped early"
            exit 1
          fi

          # ISO9660: a primary volume descriptor at sector 16 begins with this.
          # An HTML error page served with 200 OK does not.
          if ! dd if="$name.iso" bs=1 skip=$((16*2048+1)) count=5 status=none | grep -q 'CD001'; then
            echo "  NOT AN ISO9660 IMAGE: the server returned something else"
            head -c 200 "$name.iso" | strings | head -5
            exit 1
          fi
          echo "  ISO9660 signature: found"

          if [ -n "$expected_sha" ]; then
            actual=$(sha256sum "$name.iso" | cut -d' ' -f1)
            if [ "$actual" != "$expected_sha" ]; then
              echo "  SHA256 MISMATCH"
              echo "    expected $expected_sha"
              echo "    actual   $actual"
              echo "  the distribution has published a new build; update the pin"
              exit 1
            fi
            echo "  sha256: matches"
          else
            echo "  sha256: not pinned (URL is version-specific)"
          fi

          echo "  size: $size bytes"
          echo "SHA_ACTUAL=$(sha256sum "$name.iso" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: log in to ghcr
        if: steps.want.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | \
            docker login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: install oras
        if: steps.want.outputs.run == 'true'
        run: |
          set -euo pipefail
          version=1.2.2
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${version}/oras_${version}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras

      # Pushed as a single-layer OCI artifact rather than a container image, because
      # an ISO is a file and not a rootfs. lib/iso.py pulls it back with three raw
      # registry calls (token, manifest, blob) rather than with oras, so the bake
      # image does not need oras at run time - see its docstring.
      - name: push as iso-<name>
        if: steps.want.outputs.run == 'true'
        run: |
          set -euo pipefail
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          name="${{ matrix.name }}"
          tag="iso-${name}"

          echo "==> $REGISTRY/$repo:$tag"
          oras push "$REGISTRY/$repo:$tag" \
            --artifact-type application/vnd.easydev.iso \
            "${name}.iso:application/vnd.oci.image.layer.v1.tar" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "dev.easydev.iso-sha256=$SHA_ACTUAL"

      - name: clean up
        if: always()
        run: rm -f "${{ matrix.name }}.iso"

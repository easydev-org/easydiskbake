name: image-build

# Build the easydiskbake image and publish it to this repository's ghcr package.
#
#     ghcr.io/easydev-org/easydiskbake:latest
#     ghcr.io/easydev-org/easydiskbake:2026.11.03
#
# MANUAL ONLY. The image is consumed by every bake through :latest, so rebuilding it
# changes what every later bake runs against. That is worth being a decision rather
# than a side effect of editing the Containerfile - and it makes the ordering
# explicit: build the image, then run the bake.
#
# The whole build runs through log-stream, so the apt output for a dozen packages is
# visible while it happens rather than after a failure that says only "exit code 100".

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build one image instead of all three"
        type: choice
        options:
          - both
          - bake
          - android
          - qemu
        default: both

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: image
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py login --registry ghcr.io
            ONLY="${{ inputs.only || 'both' }}"
            if [ "$ONLY" = "both" ]; then
              python3 lib/build_image.py
            else
              python3 lib/build_image.py --only "$ONLY"
            fi

name: image-build

# Build the easydiskbake image and publish it to this repository's ghcr package.
#
#     ghcr.io/easydev-org/easydiskbake:latest
#     ghcr.io/easydev-org/easydiskbake:2026.11.03
#
# MANUAL ONLY. The image is consumed by every bake through :latest, so rebuilding it
# changes what every later bake runs against. That is worth being a decision rather
# than a side effect of editing the Containerfile - and it makes the ordering
# explicit: build the image, then run the bake.
#
# The whole build runs through log-stream, so the apt output for a dozen packages is
# visible while it happens rather than after a failure that says only "exit code 100".

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build one image instead of all four"
        type: choice
        options:
          - both
          - bake
          - android
          - qemu
          - appliance
        default: both

jobs:
  # ===========================================================================
  # THE THREE TOOLING IMAGES. Cheap, and every bake pulls :latest.
  # ===========================================================================
  build:
    if: inputs.only != 'appliance'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: image
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py login --registry ghcr.io
            ONLY="${{ inputs.only || 'both' }}"
            if [ "$ONLY" = "both" ]; then
              python3 lib/build_image.py
            else
              python3 lib/build_image.py --only "$ONLY"
            fi

  # ===========================================================================
  # THE MACOS APPLIANCE. A bootable macOS 15 VM, 16 GiB of it.
  # ===========================================================================
  #
  # ITS OWN JOB FOR TWO REASONS THAT ARE BOTH ABOUT SIZE.
  #
  #   1. DISK. The build holds a 15.9 GiB download, the 4 GiB parts it is cut into, and the
  #      exported image. `runner-check` with disk-gb 60 prunes the SDKs this job never uses
  #      and then REFUSES if that still is not enough - which is a sentence at the top of the
  #      log instead of `no space left on device` forty minutes into a pull.
  #
  #   2. TIME. 16 GiB is pulled, hashed, split, copied into layers and pushed. Sixty minutes,
  #      which is right for the tooling images, is not right for this one.
  #
  # IT IS NOT PART OF `both`. Building it takes quarter of an hour and produces something
  # only a macOS user pulls; defaulting it on would make every ordinary image change pay for
  # it. Choose `appliance` from the dispatch form.
  #
  # THE TOKEN IS A SECRET, NOT A BUILD ARG. The build pulls six artifacts from this
  # repository's own ghcr package, so it needs a credential while it runs - and
  # `--build-arg` would write it into the image history. lib/build_image.py writes it to a
  # temporary file, passes it as a BuildKit secret, and deletes it afterwards.
  appliance:
    if: inputs.only == 'appliance'
    runs-on: ubuntu-24.04
    # 16 GiB down, 4 GiB parts, two 16 GiB layer sets while exporting, then a push.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          # No guest is booted here - the build only moves bytes - so KVM is not required.
          kvm: false
          disk-gb: '60'
          token: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: appliance
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/ci.py login --registry ghcr.io
            python3 lib/build_image.py --only appliance

name: ubuntu-gui

# Install Ubuntu from the OFFICIAL DESKTOP ISO, through the installer's own GUI.
#
# WHY THIS EXISTS BESIDE ubuntu.yml, AND WHAT "BESIDE" MEANS HERE
#
# ubuntu.yml starts from the *server* ISO and drives subiquity with an autoinstall file. That
# works because the server installer reads one - its own comment says the server variant is
# "the image whose installer a file can drive". The desktop image's installer is a Flutter
# application. There is no answer file for the interactive path, and the only way through it is
# the GUI.
#
# This workflow is that path. It does NOT replace ubuntu.yml: nothing here changes the server
# bake, its tags or its jobs. The intent is that later distros are added as more
# `*-gui.yml` files and the server bakes retire one at a time, once each GUI flow is proven.
#
# THE INSTALLER IS DRIVEN THE SAME WAY THE macOS ONE IS - read the screen, click, look again -
# because that is the only mechanism that works for a GUI with no automation interface. The
# difference is that Ubuntu's installer labels every pane with a title tesseract reads cleanly,
# so the driver knows where it is before it clicks.
#
# THE ISO COMES FROM THE VENDOR. lib/iso.py pulls an image this repository has already
# published to ghcr; a vendor ISO is not there, so `artifacts-publish.yml`'s pattern applies:
# fetch once, verify the vendor's own checksum, and keep it in the workspace.
#
# MANUAL ONLY. An installer that clicks through a GUI is not something to run on every push.

on:
  workflow_dispatch:
    inputs:
      bake_run:
        description: "Install Ubuntu through the graphical installer"
        type: boolean
        default: true
      release:
        description: "Ubuntu desktop release (the ISO name carries it)"
        default: "26.04.1"
      iso_url:
        description: "ISO URL (empty for the pinned 26.04.1 desktop image)"
        default: ""
      iso_sha256:
        description: "ISO sha256 (empty for the pinned value)"
        default: ""
      disk_size:
        description: "guest disk size"
        default: "64G"
      install_timeout:
        description: "seconds the installer may take"
        default: "5400"
      publish_tag:
        description: "tag to publish under; empty for linux-ubuntu-gui"
        default: "linux-ubuntu-gui"
      boot_timeout:
        description: "stage 2: seconds the booted disk has to reach its desktop"
        default: "900"
      launch_run:
        description: "stage 2: boot the finished disk and check the desktop comes up"
        type: boolean
        default: true
      publish:
        description: "publish the finished disk to ghcr"
        type: boolean
        default: true

# ONE RUN PER BRANCH. Two installers writing the same tag would race, and the disk is large
# enough that queuing is cheaper than a lost run.
concurrency:
  group: ubuntu-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    if: inputs.bake_run
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # THE SAME THREE THE OTHER VM JOBS NEED. A guest here is on a tap (lib/net.py), so the
      # kernel-side tun device and NET_ADMIN are as load-bearing as /dev/kvm.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ubuntu-gui-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix linux-

      # THE VENDOR IMAGE, FETCHED ONCE AND CHECKED AGAINST THE VENDOR'S OWN SHASUMS.
      #
      # In parallel, because a single connection to releases.ubuntu.com was measured at tens
      # of KB/s from a runner while a segmented fetch through the proxy reached 150 MiB/s.
      # This is the same reason easyactions/oci-pull segments a blob.
      - name: fetch the desktop ISO
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ubuntu-gui-iso
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out/iso
            # FROM ghcr, which is what artifacts-publish exists for: the image was fetched
            # once, verified three ways, and pushed as `iso-ubuntu-desktop`. This is a CDN pull.
            python3 lib/fetch_iso.py ubuntu-desktop "out/iso/ubuntu-26.04.1-desktop-amd64.iso"

      # THE GUI, DRIVEN BY READING IT.
      - name: install through the graphical installer
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ubuntu-gui-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=2
            ISO=$(ls out/iso/*.iso | head -1)
            echo "iso: $ISO"
            python3 linux/ubuntu-gui/install.py \
              --iso "$ISO" \
              --out out/ubuntu-gui.qcow2 \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout "${{ inputs.install_timeout || '5400' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-gui-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: push the disk
        if: success() && inputs.publish
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/ubuntu-gui.qcow2
          kind: linux-ubuntu-gui
          tag: ${{ inputs.publish_tag || 'linux-ubuntu-gui' }}
          token: ${{ github.token }}

  # ===========================================================================
  # STAGE TWO - BOOT THE DISK AND SEE THE DESKTOP. See lib/launch_linux.py.
  # ===========================================================================
  #
  # THE BAKE PROVES THE INSTALL; THIS PROVES THE ARTEFACT. A disk whose bootloader was never
  # written installs perfectly and then does nothing, and the only way to see it is to start
  # the disk with no installer attached - which is what this job does, through the same
  # lib/launch_linux.py the answer-file bakes use.
  #
  # IT PULLS FROM ghcr RATHER THAN TAKING AN ARTIFACT, because a 5 GiB file through the
  # artifact store is slower than the registry and expires. That is why the bake must publish
  # for this job to have anything to start.
  #
  # `--ssh skip` IS STAGE THREE'S QUESTION, NOT THIS ONE. None of these images carries sshd -
  # no GUI driver installs it - so this stage asks whether the desktop comes up, and the frame
  # is its verdict where no session exists to read.
  launch:
    needs: [bake]
    if: |
      always() && inputs.launch_run && inputs.bake_run
      && needs.bake.result == 'success' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      packages: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: launch it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ubuntu-gui-launch
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/launch_linux.py \
              --tag "${{ needs.bake.outputs.tag || 'linux-ubuntu-gui' }}" \
              --kind ubuntu-gui \
              --ssh skip \
              --artifacts "out/ubuntu-gui-launch" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-gui-launch
          path: |
            out/ubuntu-gui-launch/launch.txt
            out/ubuntu-gui-launch/console.log
            out/ubuntu-gui-launch/screen.png
          if-no-files-found: warn
          retention-days: 14

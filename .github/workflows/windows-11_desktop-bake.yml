name: windows-11_desktop-bake

# Bake a Windows 11 disk in CI and publish it to ghcr.
#
# WHAT IS PUBLISHED
#
#     ghcr.io/easydev-org/easydiskbake:windows-base-<YYYYmmdd-HHMMSS>
#
# A timestamp and no floating tag. "Which build is this" has to stay answerable, and a
# disk is not something to redeploy by accident - a `latest` that moves would make both
# of those untrue at once.
#
# There is deliberately no "ssh" tag. It would have to be derived from an already
# published base, the way dockur-macos does its stage 3, so that a broken second stage
# cannot invalidate a base that was otherwise finished. Not implemented.
#
# THE JOB RUNS INSIDE THE IMAGE
#
# `container:` with `--device /dev/kvm`, exactly as bake-mx.yml does. The image is the
# environment: qemu, xorriso, swtpm, OVMF, 7z, wimlib, aria2 and python3 are all pinned
# by the Containerfile, so a bake is the same whether it runs here or by hand.
#
# The first version ran on the host and shelled out to `docker run` for each step. It
# looked equivalent and was not: the `prepare` step then executed as the runner's uid,
# which cannot open /dev/kvm (0o660, root:kvm), so every bake failed in twelve seconds
# asking for a permission the image already had. A container job that needs a device
# should be a container job.
#
# EVERY STEP RUNS THROUGH LOG-STREAM
#
# GitHub serves a running job's Actions log from an internal store and the public
# endpoints answer 404 until the job ends, so a 90-minute bake is invisible while it
# runs. A check run's output.text has no such restriction.
#
# MANUAL ONLY
#
# A bake costs 90 minutes of a 4-core runner. Nothing here runs on a schedule or on a
# push: a Windows disk is produced when somebody asks for one, and the timestamp in its
# tag is what says which one that was.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Windows image to install"
        type: choice
        options:
          - windows11
        default: windows11
      disk_size:
        description: "Guest disk size"
        default: "64G"
      publish:
        description: "Push the disk to ghcr"
        type: boolean
        default: true
      snapshot_interval:
        description: "Seconds between recorded frames (lower = bigger video)"
        default: "5"

concurrency:
  group: bake-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
      # write, not read: this job pushes the disk as well as pulling the ISO. One job
      # rather than two, because the disk is already in the container's filesystem and
      # an artifact round-trip of 4 GiB to move it to a second job buys nothing.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: windows-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # 7.2 GiB image + 64 GiB sparse disk + a compressed copy. A check, not a
            # cleanup: nothing is deleted, because there was never a shortage.
            python3 lib/ci.py free-disk --need 45

      - name: bake
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: windows-bake
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL="${{ inputs.snapshot_interval || '1' }}"
            export RECORD_FPS=1
            python3 windows/11/bake.py \
              --out out/windows11.qcow2 \
              --answer windows/11/answer \
              --image "${{ inputs.image || 'windows11' }}" \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout 5400

      # A second, independent read of the disk. The bake already checked it, but the
      # bake also had the ISO attached and a live installer in memory: this is a
      # separate process that reads only the file.
      - name: verify the disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: windows-verify
          interval: "10"
          command: |
            set -euo pipefail
            python3 windows/11/verify.py out/windows11.qcow2

      # The recording is what explains a failure: a setup pane waiting for a click and
      # a hung kernel look identical in a log, and this is the only artifact that shows
      # which one it was. Encoded whether or not the bake succeeded.
      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-recording
          path: |
            out/install.mp4
            out/frames/shots/frames.txt
            out/console.log
          if-no-files-found: warn
          retention-days: 14


      # WHEN THE ENCODING NEVER RUNS, THE PICTURES ARE ALL THERE IS.
      #
      # This step was removed once, on the reasoning that lib/vm.record_many() cannot
      # fail silently. It can fail silently enough: a run that is cancelled or times out
      # never reaches the encoding call at all, so `keep the recording` uploads
      # console.log and a frames.txt that lists files nobody can open. That happened to
      # run 41446883463 - 454 frames on the runner, and the artifact was 32 KB.
      #
      # Gated on the mp4 being absent, so the usual case uploads nothing extra: a PPM
      # here is 3 MB and there are hundreds of them.
      # WHEN THE ENCODING NEVER RUNS, ONE PICTURE IS STILL WORTH HAVING - BUT ONLY ONE.
      #
      # A cancelled or timed-out run never reaches the encoding call, and the earlier
      # version of this step uploaded every raw frame: run 41468749665 produced 494 MB of
      # PPM, a hundred files at 6 MiB each, to answer "which pane did it stop on". It
      # takes six minutes to download that to look at one of them.
      #
      # The last frame is the pane the driver stopped on, and lib/lastframe.py converts it
      # to a 300 KiB PNG. Gated on the mp4 being absent, so a normal run uploads nothing
      # extra.
      - name: keep the last frame
        if: always() && hashFiles('out/install.mp4') == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      # THE BOOTSTATE GOES WITH THE DISK, AND IT IS NOT OPTIONAL.
      #
      # OVMF's variables carry the "Windows Boot Manager" entry and the TPM holds the
      # state Windows 11 sealed against it. Published without them the disk starts, the
      # firmware tries every boot entry it has, fails each, and drops into its own shell -
      # which is what run 41468968378 showed. A few hundred KiB next to a 10 GiB disk.
      - name: keep the bootstate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-bootstate
          path: out/windows11.qcow2.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: upload the disk
        uses: actions/upload-artifact@v4
        with:
          name: windows11-qcow2
          path: out/windows11.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0   # qcow2 is already zstd-compressed

      - name: push the disk
        if: ${{ inputs.publish == true || inputs.publish == null }}
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: windows-publish
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            python3 lib/publish_disk.py out/windows11.qcow2 --kind windows-base

      - name: what is in the package
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: windows-tags
          interval: "10"
          command: |
            set -euo pipefail
            # A listing, not a step that produces anything. If it fails the job fails
            # and says why - the previous `|| true` made a broken lookup look like an
            # empty package.
            python3 lib/ci.py tags --prefix windows-base-

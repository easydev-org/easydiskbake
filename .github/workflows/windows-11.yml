name: windows11

# The whole Windows chain in one workflow, and every job can start from a tag that already
# exists.
#
#     base ──> ssh ──┬──> dev ──> launch_dev
#                    └──────────> launch_ssh
#
# WHY ONE WORKFLOW
#
# There were four - base, ssh, dev, launch - and each had to be started by hand with the tag
# the previous one produced. Four dispatch forms, four chances to type a tag wrong, and nothing
# anywhere recording that they are a chain: a single stage's run graph says nothing about what
# came before it.
#
# EVERY JOB TAKES A TAG, AND THAT IS THE POINT
#
# A chain where "run from the start" is the only entry point is a chain you cannot debug: a
# change to the ssh stage would mean baking Windows again. So each job has the same pair of
# inputs:
#
#     <job>_run          should this job run at all
#     <job>_from         the tag to pull; empty means "use what the job above produced"
#
# and the tag expression is always `inputs.<job>_from || needs.<above>.outputs.tag`.
#
# THERE IS NO BOOTSTATE, AND THERE IS NO `<job>_bootstate` INPUT ANY MORE.
#
# A Windows disk used to boot only by a "Windows Boot Manager" entry in OVMF's variable store,
# which travels as an artifact of the run that produced the disk. Every job therefore carried an
# extra run id beside the tag, and a job that was given a tag but not that id failed before it
# started the machine:
#
#     Unable to download artifact(s): Artifact not found for name: windows11-bootstate
#
# The bake now writes the Windows loader to the UEFI fallback path \EFI\BOOT\BOOTX64.EFI as well
# as the path its NVRAM entry names, so a fresh template's variables are enough and the machine
# starts the way it would for anyone who downloaded the artifact. The tag is the whole input
# again, which is what "one source per input" means: a disk, and nothing beside it.
#
# WHAT CROSSES A JOB BOUNDARY IS A TAG. The disks go through ghcr because that is what
# `lib/iso.fetch_tag` already resumes, and a 12 GiB artifact round trip is the thing this week
# was spent removing.
#
# MANUAL ONLY, like every workflow here.

on:
  workflow_dispatch:
    inputs:
      # --- what to run -------------------------------------------------------------
      base_run:
        description: "Bake Windows from an ISO - ~90 minutes"
        type: boolean
        default: false
      vm_configure_run:
        description: "Share a host directory and install the logon hook (no toolchain)"
        type: boolean
        default: true
      ssh_run:
        description: "Install OpenSSH on top of the base disk"
        type: boolean
        default: true
      dev_run:
        description: "Install the dev toolchain on top of the ssh disk - ~25 minutes"
        type: boolean
        default: true
      launch_ssh_run:
        description: "Launch the ssh disk and photograph it"
        type: boolean
        default: true
      launch_dev_run:
        description: "Launch the dev disk and photograph it"
        type: boolean
        default: true

      # --- where each job starts ----------------------------------------------------
      #
      # EMPTY MEANS "USE WHAT THE JOB ABOVE PRODUCED". Fill one in to run that job against a
      # disk that already exists, which is how a change to one stage is tested without
      # re-baking the ones before it.
      base_from:
        description: "base: pull this tag instead of baking from an ISO (base_from)"
        default: ""
      ssh_from:
        description: "ssh: pull this tag instead of the base job's output"
        default: ""
      vm_configure_from:
        description: "share: pull this tag instead of the ssh job's output"
        default: ""
      dev_from:
        description: "dev: pull this tag instead of the share job's output"
        default: ""
      launch_ssh_from:
        description: "launch_ssh: the tag to launch; empty for the ssh job's output"
        default: ""
      launch_dev_from:
        description: "launch_dev: the tag to launch; empty for the dev job's output"
        default: ""

      # --- base ---------------------------------------------------------------------
      image:
        description: "base: which Windows image to bake"
        default: "windows11"
      disk_size:
        description: "base: target disk size"
        default: "128G"
      base_publish_tag:
        description: "base: tag to publish under; empty for windows-base-<stamp>"
        default: ""

      # --- ssh / dev ----------------------------------------------------------------
      ssh_publish_tag:
        description: "ssh: tag to publish under; empty for windows-ssh-<stamp>"
        default: ""
      vm_configure_publish_tag:
        description: "share: tag to publish under; empty for windows-share-<stamp>"
        default: ""
      dev_publish_tag:
        description: "dev: tag to publish under; empty for windows-dev-<stamp>"
        default: ""

      # --- launch -------------------------------------------------------------------
      boot_timeout:
        description: "Seconds to wait for a guest to reach its desktop or sshd"
        default: "900"
      resolution:
        description: "Guest screen as WxH"
        default: "1920x1080"
      probe_shell:
        description: "launch: open PowerShell and run a probe command"
        type: boolean
        default: true
      # 0 MEANS "WAIT THE WHOLE boot_timeout", WHICH IS THE ONLY SENSIBLE DEFAULT FOR A
      # LAUNCH. The value was -1, copied from a description that said "-1 = immediately" -
      # and in lib/launch_windows.py `-1` means the OPPOSITE: probe the firmware shell
      # as soon as qemu is up, do not wait for a desktop at all.
      #
      #     --probe-after -1   do not wait: probe the firmware shell at once
      #     --probe-after 60   give it a minute
      #     0                  the whole --boot-timeout
      #
      # With probe_shell defaulting to true and probe_after to -1, every launch ran with a
      # zero-second budget. Run 41855500060's launch_ssh reported
      #
      #     === NO DESKTOP ===
      #     1 frames captured over 70s
      #
      # against a disk that had listed Boot0001 and started it - the picture was one frame
      # of the firmware, taken before Windows had a chance to draw anything.
      probe_after:
        description: "launch: seconds to wait for a desktop before probing the firmware shell (0 = the whole boot_timeout)"
        default: "0"
      check_ssh:
        description: "launch: also verify sshd answers on the forwarded port"
        type: boolean
        default: false

concurrency:
  group: windows11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # BASE - install Windows, nothing else.
  # ===========================================================================
  base:
    if: inputs.base_run || inputs.base_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      # ONE EXPRESSION SERVES BOTH PATHS. Given a tag, this job publishes nothing and the
      # outputs are what it was given; baked here, they are what it produced.
      tag: ${{ inputs.base_publish_tag || 'windows11' }}
      ran: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: base-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix windows-

      - name: bake
        if: inputs.base_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: base-bake
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            # THE ACCOUNT THE DISK IS INSTALLED WITH. It is baked in by the answer file, so the
            # jobs after this one have to be told the same name - `WINDOWS_ADMIN_USER` is read by
            # windows/11/bake.py (the substitution), ssh.py, vm_configure.py and devtools.py.
            # One variable, so a disk and the stages that log into it cannot disagree.
            export WINDOWS_ADMIN_USER=vmuser
            export WINDOWS_ADMIN_PASSWORD=admin
            python3 windows/11/bake.py \
              --out out/windows11.qcow2 \
              --answer windows/11/answer \
              --image "${{ inputs.image || 'windows11' }}" \
              --disk-size "${{ inputs.disk_size || '128G' }}" \
              --timeout 5400
            python3 windows/11/verify.py out/windows11.qcow2

      # THE RECORDING AND THE LAST FRAME, UPLOADED ON FAILURE TOO.
      #
      # windows/11/bake.py has always written out/install.mp4 and out/last-frame.png through
      # lib/live.py - kept current every twenty seconds, so a run that is cancelled at minute
      # eighty still has a playable file. NOTHING UPLOADED THEM. The macOS workflow has done
      # this for months; Windows did not, and run 42822577507 is what that costs: 90 minutes
      # timed out at "no desktop", and the only artefact was a log whose console output was
      # 630 bytes of UEFI boot lines. The one thing that would say which screen the machine
      # was sitting on - the screen - was written to the runner and thrown away.
      #
      # `if: always()` because a failed bake is exactly when this is worth having.
      - name: keep the recording
        if: always() && inputs.base_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows11-base-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      # AND THE FRAMES THEMSELVES, which are what `is_windows_desktop` actually reads.
      #
      # The mp4 is for a person; these are for the test. A bake that times out leaves the
      # frames that were measured, and `python3 lib/desktop.py out/frames/shots/frame-*.jpg`
      # reports drop/ratio/saturation for each one - which is the difference between "the
      # desktop test is wrong" and "the machine never drew a desktop".
      - name: keep the frames the desktop test read
        if: always() && inputs.base_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows11-base-frames
          path: |
            out/frames/shots/frame-*.jpg
            out/frames/shots/snapshots.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      # NO BOOTSTATE ARTIFACT. The disk carries its own loader at \EFI\BOOT\BOOTX64.EFI,
      # so there is nothing beside it to upload - and an artifact that exists only to make
      # the next job work is the dependency this bake just removed.

      # A PLAIN `run:` STEP, NOT log-stream, AND THAT IS A DECISION.
      #
      # The tag this job produces is what every downstream job pulls, so it has to reach
      # `needs.base.outputs.tag` reliably. A `run:` step's GITHUB_OUTPUT is the runner's own
      # mechanism; routing it through a third-party action would make the whole chain depend on
      # how that action treats the variable, which this repository cannot see or test. The build
      # output still streams through log-stream, where a lost line costs a log line - here it
      # would cost the chain.
      - name: publish
        if: success() && inputs.base_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/windows11.qcow2
          kind: windows-base
          tag: ${{ inputs.base_publish_tag || 'windows11' }}
          token: ${{ github.token }}
  ssh:
    needs: base
    # ALWAYS, BECAUSE `needs` ALONE WOULD SKIP THIS WHEN base IS SKIPPED - and starting from a
    # tag is exactly that case. The real precondition is that there is a tag to pull, which is
    # the expression below.
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != '' || needs.base.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.ssh_publish_tag || 'windows11-ssh' }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '60'
          token: ${{ github.token }}

      - name: pull the gold disk
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-pull
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            python3 windows/11/pull.py \
              "${{ inputs.ssh_from || needs.base.outputs.tag }}" \
              out/windows11-gold.qcow2

      - name: install ssh
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-install
          interval: "20"
          command: |
            set -euo pipefail
            # ONE ENTRY POINT, AND THE FILE IS THE STAGE.
            #
            # This used to be `python3 windows/11/ssh.py`, where the walkthrough was one call
            # inside a program that also prepared the disk, started the machine, waited for a
            # desktop and compressed the result. All four are steps in the file now -.  disk:,
            #   boot:, desktop:, compress: - so the stage is the YAML and this line only says
            # where to put the output.
            ./easyvm windows/11/steps/ssh.yaml \
              --boot-disk out/windows11-gold.qcow2 \
              --out out/windows11-ssh.qcow2 \
              --work out/ssh-work \
              --boot-mem 6144 \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      # THE SSH STAGE'S OWN VIDEO, WHICH DID NOT EXIST UNTIL NOW.
      #
      # `install ssh` is one step that runs the whole walkthrough, so its duration says nothing
      # about where the time went - and two runs spent an hour inside it with no way to look. The
      # stage records itself now (`lib/snapshots.py` + `lib/live.py`, the same pair the bakes use)
      # and this is where the result leaves the runner.
      #
      # `if: always()` because a failed stage is the one worth watching. macOS has had exactly
      # this step for its ssh stage; Windows never did.
      - name: keep the ssh recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-ssh-recording
          path: |
            out/ssh-work/install.mp4
            out/ssh-work/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      # CLEANING IS ITS OWN STEP, AND IT IS TYPED AT THE RUN GRAPH. The install above passes
      # --no-clean, so this is the only place it happens.
      - name: clean the disk
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-clean
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/clean_step.py \
              --disk out/windows11-ssh.qcow2 \
              --kind windows \
              --work out/ssh-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --mem 6144

      # THE SCREEN THE SSH STAGE STOPPED ON, BECAUSE THE FAILURE NAMES NOTHING.
      #
      # `sshd did not answer in 600s` is what run 42916715755 reported, and the ten minutes before
      # it are a black box: the PowerShell window that ran `configure sshd` had the answer on it
      # - Start-Service's error, or a bare prompt if winget never installed anything - and nothing
      # uploaded it. `lib/steps.py` writes out/ssh-work/steps/failed-wait-for-sshd.png when a step
      # fails; this is the step that collects it.
      - name: keep the screen ssh stopped on
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-ssh-failed-screen
          path: |
            out/ssh-work/steps/failed-*.png
            out/ssh-work/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: publish
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/windows11-ssh.qcow2
          kind: windows-ssh
          tag: ${{ inputs.ssh_publish_tag || 'windows11-ssh' }}
          token: ${{ github.token }}
  # ===========================================================================
  # SHARE - the host directory and the logon hook, BEFORE any toolchain.
  # ===========================================================================
  #
  # It needs nothing installed: SMB is native to Windows and the launcher is PowerShell 5.1.
  # Splitting it out means a failure here is about the share rather than about a Visual Studio
  # download, and each half can be re-run on its own.
  vm-configure:
    needs: ssh
    if: |
      always() && inputs.vm_configure_run
      && (inputs.vm_configure_from != '' || needs.ssh.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.vm_configure_publish_tag || 'windows11-vm-configure' }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: vm-configure-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix windows

      - name: pull the ssh disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.vm_configure_from || needs.ssh.outputs.tag }}
          dest: out
          token: ${{ github.token }}

      - name: configure the vm (share, logon hook)
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: vm-configure-install
          interval: "20"
          command: |
            set -euo pipefail
            DISK=$(ls out/*.qcow2 | head -1)
            python3 windows/11/vm_configure.py \
              --ssh "$DISK" \
              --out out/windows11-vm-configure.qcow2 \
              --no-clean \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: clean the disk
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: share-clean
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/clean_step.py \
              --disk out/windows11-vm-configure.qcow2 \
              --kind windows \
              --work out/vm-configure-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --mem 6144

      - name: publish
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/windows11-vm-configure.qcow2
          kind: windows-vm-configure
          tag: ${{ inputs.vm_configure_publish_tag || 'windows11-vm-configure' }}
          token: ${{ github.token }}

  dev:
    needs: vm-configure
    # THE LAST STAGE THAT PRODUCES A DISK, SO ITS OUTPUT IS WHAT launch_dev PULLS.
    #
    # THIS CONDITION NAMED `share`, A JOB THAT HAS NOT EXISTED SINCE IT WAS RENAMED
    # `vm-configure`. So `needs.share.outputs.tag` was empty, the `||` fell through to the second
    # operand, and this job only ever ran when `dev_from` was given by hand:
    #
    #     always() && inputs.dev_run && (inputs.dev_from != '' || '' != '')
    #                                                            ^^^^^^^^^^^^^ never true
    #
    # A chain whose middle job can only start when you name its input is a chain that never runs
    # end to end - which is why no run in this repository has ever reached `dev` by itself. The
    # same rename was found and fixed in macos15.yml; this file did not get the fix.
    #
    # `outputs.tag` WAS ALREADY HERE AND IS CORRECT - `launch_dev` has always been able to read
    # it. The comment that claimed otherwise was mine, written from the diff of a condition
    # rather than from the file, and the duplicate `outputs:` key it introduced is what made
    # GitHub refuse to load this workflow:
    #
    #     Line: 551, Col: 5: 'outputs' is already defined
    #
    # PyYAML silently keeps the last duplicate key, so `yaml.safe_load` raised nothing and the
    # job-graph check passed on a file the runner would not parse.
    if: |
      always() && inputs.dev_run
      && (inputs.dev_from != '' || needs.vm-configure.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.dev_publish_tag || 'windows11-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '60'
          token: ${{ github.token }}

      # THE NAME SAID "ssh disk" AND THE STEP PULLS THE VM-CONFIGURE DISK. The tag below was
      # corrected when the `needs.share` reference was fixed; the label was not, and a step whose
      # name contradicts what it fetches is the kind of thing a reader trusts instead of checking.
      - name: pull the vm-configure disk
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-pull
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            # THE VM-CONFIGURE DISK, NOT THE SSH DISK. This job reads a disk that has the
            # share mounted and the logon task registered; pulling `needs.ssh` here would have
            # started from the stage before it and left out everything vm-configure proved.
            python3 windows/11/pull.py \
              "${{ inputs.dev_from || needs.vm-configure.outputs.tag }}" \
              out/windows11-vm-configure.qcow2

      - name: install the toolchain
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-install
          interval: "25"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            # THE SAME ACCOUNT THE BAKE INSTALLED (see the base job), so the toolchain stage
            # logs in as the account the disk actually has rather than one it assumed.
            export WINDOWS_ADMIN_USER=vmuser
            export WINDOWS_ADMIN_PASSWORD=admin
            # THE FILE PULLED ABOVE, NAMED ONCE MORE. `devtools.py` calls this argument
            # `--ssh` because that is what it used to be handed; what it means is "the input
            # disk", and the input is now the vm-configure disk the pull step fetched.
            python3 windows/11/devtools.py \
              --ssh out/windows11-vm-configure.qcow2 \
              --out out/windows11-dev.qcow2 \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --no-clean

      - name: clean the disk
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-clean
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/clean_step.py \
              --disk out/windows11-dev.qcow2 \
              --kind windows \
              --work out/devtools-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --mem 8192

      - name: publish
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/windows11-dev.qcow2
          kind: windows-dev
          tag: ${{ inputs.dev_publish_tag || 'windows11-dev' }}
          token: ${{ github.token }}
  launch_ssh:
    needs: ssh
    if: |
      always() && inputs.launch_ssh_run
      && (inputs.launch_ssh_from != '' || needs.ssh.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '60'
          token: ${{ github.token }}

      - name: launch it and photograph the screen
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-ssh
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            PROBE=""
            if [ "${{ inputs.probe_shell }}" = "true" ]; then
              PROBE="--probe-shell --probe-after ${{ inputs.probe_after || '0' }}"
            fi
            CHECK=""
            if [ "${{ inputs.check_ssh }}" = "true" ]; then CHECK="--check-ssh"; fi
            python3 lib/launch_windows.py \
              --tag "${{ inputs.launch_ssh_from || needs.ssh.outputs.tag }}" \
              $CHECK \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --resolution "${{ inputs.resolution || '1920x1080' }}" \
              $PROBE \
              --artifacts out

      # THE FRAME IS THE RESULT. A launch that reports "no desktop" and shows nothing has not
      # said where it stopped; the picture is what turned nine silent minutes into "the
      # firmware could not find bootmgfw.efi".
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-ssh-frames
          path: |
            out/*.png
            out/*.ppm
            out/launch.txt
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # LAUNCH THE DEV DISK - the other half.
  # ===========================================================================
  launch_dev:
    needs: dev
    if: |
      always() && inputs.launch_dev_run
      && (inputs.launch_dev_from != '' || needs.dev.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '60'
          token: ${{ github.token }}

      - name: launch it and photograph the screen
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-dev
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            PROBE=""
            if [ "${{ inputs.probe_shell }}" = "true" ]; then
              PROBE="--probe-shell --probe-after ${{ inputs.probe_after || '0' }}"
            fi
            CHECK=""
            if [ "${{ inputs.check_ssh }}" = "true" ]; then CHECK="--check-ssh"; fi
            python3 lib/launch_windows.py \
              --tag "${{ inputs.launch_dev_from || needs.dev.outputs.tag }}" \
              $CHECK \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --resolution "${{ inputs.resolution || '1920x1080' }}" \
              $PROBE \
              --artifacts out

      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-dev-frames
          path: |
            out/*.png
            out/*.ppm
            out/launch.txt
          if-no-files-found: warn
          retention-days: 14

      # THE BOOTSTRAP CHAIN, WHICH THE LAUNCH ABOVE CANNOT PROVE.
      #
      # `launch_windows.py` answers "does this disk reach a desktop". It does not answer "does
      # a bootstrap.py dropped on the host run at logon" - that needs the share mounted, a file
      # put there, and the guest left to find it. And it needs to happen on a COPY: the disk in
      # `out/` came from a published tag and nothing here may modify it.
      #
      # ~/hello.txt IS WRITTEN INSIDE THE GUEST and dies with the run. It is never uploaded,
      # which is what keeps it a test rather than an artifact.
      - name: boot it again and check the bootstrap ran
        if: always()
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-dev-bootstrap
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/launch_selftest.py \
              --family windows \
              --tag "${{ inputs.launch_dev_from || needs.dev.outputs.tag }}" \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the bootstrap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-dev-bootstrap-report
          path: |
            selftest/selftest-work/console.log
            selftest/selftest-work/shots
          if-no-files-found: warn
          retention-days: 7

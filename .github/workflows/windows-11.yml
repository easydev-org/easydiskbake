name: windows11

# The whole Windows chain in one workflow, and every job can start from a tag that already
# exists.
#
#     base ──> ssh ──┬──> dev ──> launch_dev
#                    └──────────> launch_ssh
#
# WHY ONE WORKFLOW
#
# There were four - base, ssh, dev, launch - and each had to be started by hand with the tag
# the previous one produced. Four dispatch forms, four chances to type a tag wrong, and nothing
# anywhere recording that they are a chain: a single stage's run graph says nothing about what
# came before it.
#
# EVERY JOB TAKES A TAG, AND THAT IS THE POINT
#
# A chain where "run from the start" is the only entry point is a chain you cannot debug: a
# change to the ssh stage would mean baking Windows again. So each job has the same pair of
# inputs:
#
#     <job>_run          should this job run at all
#     <job>_from         the tag to pull; empty means "use what the job above produced"
#     <job>_bootstate    the run holding that tag's firmware variables
#
# and the tag expression is always `inputs.<job>_from || needs.<above>.outputs.tag`. When a job
# is given a tag it does not look upstream for anything except, on Windows, the bootstate.
#
# WHY EVERY JOB CARRIES A BOOTSTATE RUN ID
#
# A Windows disk boots by a boot entry stored in its OVMF variables, and those travel as an
# artifact of the run that produced the disk - not with the disk. A job that starts from a tag
# must therefore be told which run holds that disk's bootstate. It is one extra integer beside
# the tag, and without it the machine starts and finds nothing to boot.
#
# WHAT CROSSES A JOB BOUNDARY IS A TAG AND A RUN ID, NOTHING ELSE. The disks go through ghcr
# because that is what `lib/iso.fetch_tag` already resumes, and a 12 GiB artifact round trip is
# the thing this week was spent removing.
#
# MANUAL ONLY, like every workflow here.

on:
  workflow_dispatch:
    inputs:
      # --- what to run -------------------------------------------------------------
      base_run:
        description: "Bake Windows from an ISO - ~90 minutes"
        type: boolean
        default: false
      ssh_run:
        description: "Install OpenSSH on top of the base disk"
        type: boolean
        default: true
      dev_run:
        description: "Install the dev toolchain on top of the ssh disk - ~25 minutes"
        type: boolean
        default: true
      launch_ssh_run:
        description: "Launch the ssh disk and photograph it"
        type: boolean
        default: true
      launch_dev_run:
        description: "Launch the dev disk and photograph it"
        type: boolean
        default: true

      # --- where each job starts ----------------------------------------------------
      #
      # EMPTY MEANS "USE WHAT THE JOB ABOVE PRODUCED". Fill one in to run that job against a
      # disk that already exists, which is how a change to one stage is tested without
      # re-baking the ones before it.
      base_from:
        description: "base: pull this tag instead of baking from an ISO (base_from)"
        default: ""
      base_bootstate:
        description: "base: the run whose artifact holds that tag's firmware variables"
        default: ""
      ssh_from:
        description: "ssh: pull this tag instead of the base job's output"
        default: ""
      ssh_bootstate:
        description: "ssh: the run whose artifact holds that tag's firmware variables"
        default: ""
      dev_from:
        description: "dev: pull this tag instead of the ssh job's output"
        default: ""
      dev_bootstate:
        description: "dev: the run whose artifact holds that tag's firmware variables"
        default: ""
      launch_ssh_from:
        description: "launch_ssh: the tag to launch; empty for the ssh job's output"
        default: ""
      launch_ssh_bootstate:
        description: "launch_ssh: the run whose artifact holds that tag's firmware variables"
        default: ""
      launch_dev_from:
        description: "launch_dev: the tag to launch; empty for the dev job's output"
        default: ""
      launch_dev_bootstate:
        description: "launch_dev: the run whose artifact holds that tag's firmware variables"
        default: ""

      # --- base ---------------------------------------------------------------------
      image:
        description: "base: which Windows image to bake"
        default: "windows11"
      disk_size:
        description: "base: target disk size"
        default: "128G"
      base_publish_tag:
        description: "base: tag to publish under; empty for windows-base-<stamp>"
        default: ""

      # --- ssh / dev ----------------------------------------------------------------
      ssh_publish_tag:
        description: "ssh: tag to publish under; empty for windows-ssh-<stamp>"
        default: ""
      dev_publish_tag:
        description: "dev: tag to publish under; empty for windows-dev-<stamp>"
        default: ""

      # --- launch -------------------------------------------------------------------
      boot_timeout:
        description: "Seconds to wait for a guest to reach its desktop or sshd"
        default: "900"
      resolution:
        description: "Guest screen as WxH"
        default: "1920x1080"
      probe_shell:
        description: "launch: open PowerShell and run a probe command"
        type: boolean
        default: true
      probe_after:
        description: "launch: seconds after the desktop to run the probe (-1 = immediately)"
        default: "-1"
      check_ssh:
        description: "launch: also verify sshd answers on the forwarded port"
        type: boolean
        default: false

concurrency:
  group: windows11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # BASE - install Windows, nothing else.
  # ===========================================================================
  base:
    if: inputs.base_run || inputs.base_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      # ONE EXPRESSION SERVES BOTH PATHS. Given a tag, this job publishes nothing and the
      # outputs are what it was given; baked here, they are what it produced.
      tag: ${{ inputs.base_from || steps.publish.outputs.tag }}
      bootstate_run: ${{ inputs.base_bootstate || github.run_id }}
      ran: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: base-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 80
            python3 lib/ci.py tags --prefix windows-

      - name: bake
        if: inputs.base_from == ''
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: base-bake
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            python3 windows/11/bake.py \
              --out out/windows11.qcow2 \
              --answer windows/11/answer \
              --image "${{ inputs.image || 'windows11' }}" \
              --disk-size "${{ inputs.disk_size || '128G' }}" \
              --timeout 5400
            python3 windows/11/verify.py out/windows11.qcow2

      - name: keep the bootstate
        if: always() && inputs.base_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows11-bootstate
          path: out/windows11.qcow2.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30

      # A PLAIN `run:` STEP, NOT log-stream, AND THAT IS A DECISION.
      #
      # The tag this job produces is what every downstream job pulls, so it has to reach
      # `needs.base.outputs.tag` reliably. A `run:` step's GITHUB_OUTPUT is the runner's own
      # mechanism; routing it through a third-party action would make the whole chain depend on
      # how that action treats the variable, which this repository cannot see or test. The build
      # output still streams through log-stream, where a lost line costs a log line - here it
      # would cost the chain.
      - name: publish
        if: success() && inputs.base_from == ''
        id: publish
        run: |
          set -euo pipefail
          python3 lib/ci.py install-oras
          python3 lib/ci.py login --registry ghcr.io
          TAG="${{ inputs.base_publish_tag }}"
          if [ -z "$TAG" ]; then
            python3 lib/publish_disk.py out/windows11.qcow2 --kind windows-base
          else
            python3 lib/publish_disk.py out/windows11.qcow2 --kind windows-base --tag "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ===========================================================================
  # SSH - OpenSSH on the base disk, then clean.
  # ===========================================================================
  ssh:
    needs: base
    # ALWAYS, BECAUSE `needs` ALONE WOULD SKIP THIS WHEN base IS SKIPPED - and starting from a
    # tag is exactly that case. The real precondition is that there is a tag to pull, which is
    # the expression below.
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != '' || needs.base.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.ssh_from || steps.publish.outputs.tag }}
      bootstate_run: ${{ inputs.ssh_bootstate || github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 60
            if ! command -v sshpass >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -qq sshpass
            fi

      - name: pull the gold disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-pull
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            python3 windows/11/pull.py \
              "${{ inputs.ssh_from || needs.base.outputs.tag }}" \
              out/windows11-gold.qcow2

      # THE BOOTSTATE COMES FROM THE RUN THAT MADE THE DISK, which is this run when the base
      # was baked here and the given run id when it was not.
      - name: pull the bootstate
        uses: actions/download-artifact@v4
        with:
          name: windows11-bootstate
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ssh_bootstate || needs.base.outputs.bootstate_run }}

      - name: install ssh
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-install
          interval: "20"
          command: |
            set -euo pipefail
            python3 windows/11/ssh.py \
              --gold out/windows11-gold.qcow2 \
              --out out/windows11-ssh.qcow2 \
              --bootstate out/windows11.qcow2.bootstate.tar.gz \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --no-clean

      # CLEANING IS ITS OWN STEP, AND IT IS TYPED AT THE RUN GRAPH. The install above passes
      # --no-clean, so this is the only place it happens.
      - name: clean the disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-clean
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/clean_step.py \
              --disk out/windows11-ssh.qcow2 \
              --kind windows \
              --work out/ssh-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --mem 6144

      - name: keep the bootstate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ssh-bootstate
          path: out/windows11-ssh.qcow2.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: publish
        if: success()
        id: publish
        run: |
          set -euo pipefail
          python3 lib/ci.py install-oras
          python3 lib/ci.py login --registry ghcr.io
          TAG="${{ inputs.ssh_publish_tag }}"
          if [ -z "$TAG" ]; then
            python3 lib/publish_disk.py out/windows11-ssh.qcow2 --kind windows-ssh
          else
            python3 lib/publish_disk.py out/windows11-ssh.qcow2 --kind windows-ssh --tag "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ===========================================================================
  # DEV - the toolchain on top of ssh, then clean.
  # ===========================================================================
  dev:
    needs: ssh
    if: |
      always() && inputs.dev_run
      && (inputs.dev_from != '' || needs.ssh.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.dev_from || steps.publish.outputs.tag }}
      bootstate_run: ${{ inputs.dev_bootstate || github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 60
            if ! command -v sshpass >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -qq sshpass
            fi

      - name: pull the ssh disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-pull
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            python3 windows/11/pull.py \
              "${{ inputs.dev_from || needs.ssh.outputs.tag }}" \
              out/windows11-ssh.qcow2

      - name: pull the bootstate
        uses: actions/download-artifact@v4
        with:
          name: windows-ssh-bootstate
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ inputs.dev_bootstate || needs.ssh.outputs.bootstate_run }}

      - name: install the toolchain
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-install
          interval: "25"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export WINDOWS_ADMIN_PASSWORD=admin
            python3 windows/11/devtools.py \
              --ssh out/windows11-ssh.qcow2 \
              --bootstate out/windows11-ssh.qcow2.bootstate.tar.gz \
              --out out/windows11-dev.qcow2 \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --no-clean

      - name: clean the disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: dev-clean
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/clean_step.py \
              --disk out/windows11-dev.qcow2 \
              --kind windows \
              --work out/devtools-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --mem 8192

      - name: keep the bootstate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dev-bootstate
          path: out/windows11-dev.qcow2.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: publish
        if: success()
        id: publish
        run: |
          set -euo pipefail
          python3 lib/ci.py install-oras
          python3 lib/ci.py login --registry ghcr.io
          TAG="${{ inputs.dev_publish_tag }}"
          if [ -z "$TAG" ]; then
            python3 lib/publish_disk.py out/windows11-dev.qcow2 --kind windows-dev
          else
            python3 lib/publish_disk.py out/windows11-dev.qcow2 --kind windows-dev --tag "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ===========================================================================
  # LAUNCH THE SSH DISK - one half of the fork, does not wait for dev.
  # ===========================================================================
  launch_ssh:
    needs: ssh
    if: |
      always() && inputs.launch_ssh_run
      && (inputs.launch_ssh_from != '' || needs.ssh.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-ssh-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 60

      - name: pull the bootstate
        uses: actions/download-artifact@v4
        with:
          name: windows-ssh-bootstate
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ inputs.launch_ssh_bootstate || needs.ssh.outputs.bootstate_run }}

      - name: launch it and photograph the screen
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-ssh
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            PROBE=""
            if [ "${{ inputs.probe_shell }}" = "true" ]; then
              PROBE="--probe-shell --probe-after ${{ inputs.probe_after || '-1' }}"
            fi
            CHECK=""
            if [ "${{ inputs.check_ssh }}" = "true" ]; then CHECK="--check-ssh"; fi
            ARCHIVE=$(ls out/*.bootstate.tar.gz 2>/dev/null | head -1)
            if [ -z "$ARCHIVE" ]; then
              echo "=== NO BOOTSTATE ARCHIVE IN out/ ==="
              ls -la out/ || true
              exit 1
            fi
            echo "bootstate: $ARCHIVE"
            python3 lib/launch_windows.py \
              --tag "${{ inputs.launch_ssh_from || needs.ssh.outputs.tag }}" \
              $CHECK \
              --bootstate "$ARCHIVE" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --resolution "${{ inputs.resolution || '1920x1080' }}" \
              $PROBE \
              --artifacts out

      # THE FRAME IS THE RESULT. A launch that reports "no desktop" and shows nothing has not
      # said where it stopped; the picture is what turned nine silent minutes into "the
      # firmware could not find bootmgfw.efi".
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-ssh-frames
          path: |
            out/*.png
            out/*.ppm
            out/launch.txt
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # LAUNCH THE DEV DISK - the other half.
  # ===========================================================================
  launch_dev:
    needs: dev
    if: |
      always() && inputs.launch_dev_run
      && (inputs.launch_dev_from != '' || needs.dev.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-dev-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 60

      - name: pull the bootstate
        uses: actions/download-artifact@v4
        with:
          name: windows-dev-bootstate
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ inputs.launch_dev_bootstate || needs.dev.outputs.bootstate_run }}

      - name: launch it and photograph the screen
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: launch-dev
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            PROBE=""
            if [ "${{ inputs.probe_shell }}" = "true" ]; then
              PROBE="--probe-shell --probe-after ${{ inputs.probe_after || '-1' }}"
            fi
            CHECK=""
            if [ "${{ inputs.check_ssh }}" = "true" ]; then CHECK="--check-ssh"; fi
            ARCHIVE=$(ls out/*.bootstate.tar.gz 2>/dev/null | head -1)
            if [ -z "$ARCHIVE" ]; then
              echo "=== NO BOOTSTATE ARCHIVE IN out/ ==="
              ls -la out/ || true
              exit 1
            fi
            echo "bootstate: $ARCHIVE"
            python3 lib/launch_windows.py \
              --tag "${{ inputs.launch_dev_from || needs.dev.outputs.tag }}" \
              $CHECK \
              --bootstate "$ARCHIVE" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --resolution "${{ inputs.resolution || '1920x1080' }}" \
              $PROBE \
              --artifacts out

      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-dev-frames
          path: |
            out/*.png
            out/*.ppm
            out/launch.txt
          if-no-files-found: warn
          retention-days: 14

name: linux-kubuntu-bake

# Install Kubuntu unattended with subiquity's autoinstall, in this job's container.
#
# NO SCREEN IS READ AT ANY POINT. The ISO's own kernel is booted with -kernel/-initrd and
# one kernel argument carries the address of the autoinstall document; the installer
# fetches it, partitions, installs, enables ssh and reboots. That is a different
# mechanism from MX's (a wizard clicked by coordinates) and the same one as NixOS's (a
# kernel booted directly with a command line), for the opposite reason: NixOS has no
# answer file, Ubuntu's whole installer is one.
#
# THE COMPLETION TEST IS THE DISK. subiquity's console scrolls and its last act is a
# reboot; -no-reboot / the guest exiting is the fact, and lib/smoke.py checks that an
# ext4 root is actually there before anything is published.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the disk to ghcr"
        type: boolean
        default: true
      disk_size:
        description: "Guest disk size"
        default: "24G"
      install_timeout:
        description: "Seconds EACH phase may run - the install, then the boot of the installed disk"
        # TWO PHASES USE THIS NUMBER, so it is a budget per phase and not for the job.
        # The install takes twenty to thirty minutes with a desktop; the second boot
        # needs several more to reach gdm or sddm. The job's own ceiling is below.
        default: "3600"

concurrency:
  group: linux-kubuntu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 200
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: kubuntu-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # the ISO, the disk, and the compressed copy made from it
            python3 lib/ci.py free-disk --need 30
            python3 lib/ci.py tags --prefix iso-kubuntu

      - name: install
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: kubuntu-install
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            python3 linux/kubuntu/bake.py \
              --out out/kubuntu.qcow2 \
              --disk-size "${{ inputs.disk_size || '24G' }}" \
              --timeout "${{ inputs.install_timeout || '3600' }}"

      # THE CONSOLE IS THE RECORD. THERE IS NO VIDEO, AND THAT IS DELIBERATE.
      #
      # This used to upload install.mp4 and last-frame.png. What those held was 12 MiB of
      # `curtin command in-target` scrolling past at 720x400, every character smeared by
      # the yuv420p encode into something unreadable - because `console=ttyS0` moves the
      # kernel's console to the serial port and the VGA adapter only ever shows a mirror of
      # that text at 80x25. A recording of a text console nobody can read is not evidence.
      #
      # The serial console carries all of it, line by line, and lib/serial.py prints it as
      # it arrives. That is uploaded below, and it is what a failed run is explained by.
      - name: keep the console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubuntu-console
          path: |
            # THE GUEST'S CONSOLE. It is not console.log any more: the bake now puts the
            # serial on a fifo chardev so it can be read and driven, and lib/serial.py
            # writes what the guest said to serial.out.log. qemu's own stdout carries
            # only warnings, so console.log would be an almost empty file.
            out/serial.out.log
            out/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: upload the disk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kubuntu-qcow2
          path: out/kubuntu.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: push the disk
        if: ${{ success() && (inputs.publish == true || inputs.publish == null) }}
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: kubuntu-publish
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            # A FIXED TAG, SO A LAUNCH STAGE CAN NAME WHAT IT IS TESTING.
            #
            # Without --tag this pushes linux-kubuntu-<timestamp>, which is right for an install
            # that is a dated release and wrong for a disk a launch workflow has to find.
            # linux-kubuntu-launch asks for ":linux-kubuntu" by name; a timestamped-only tag made it fail
            # with "no manifest for tag 'linux-kubuntu'" on all four of 6e26b2d's launches.
            #
            # This is the same choice linux-nixos-bake makes for nixos-base and the six
            # desktops: the moving tag is the identity, and the OCI annotations still
            # carry org.opencontainers.image.revision and .created, so "which build is
            # this" stays answerable without a second tag.
            python3 lib/publish_disk.py out/kubuntu.qcow2 --kind linux-kubuntu \
              --tag linux-kubuntu

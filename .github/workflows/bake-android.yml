name: bake-android

# Bake an Android 15 (AOSP) sandbox disk and publish it.
#
#     ghcr.io/easydev-org/easydiskbake:android-15-aosp
#
# WHY THIS IS SHORT COMPARED TO THE OTHER BAKES
#
# Windows, macOS and Linux run an installer for twenty to ninety minutes: partition a
# disk, write a system, wait for two reboots, prove it starts. Android does not have
# that step. Google ships a system image whose contents are the disks, and the
# emulator boots them directly.
#
# So this job is: pull the AVD, start the emulator, record it, wait for
# sys.boot_completed, pack it, publish.
#
# WHY THE EMULATOR AND NOT lib/vm.py
#
# The system image is built for Google's `ranchu` machine and its `goldfish` device
# family, which upstream qemu does not implement. Booting it on q35 stops in the
# kernel. Everything downstream of the launcher is shared with the other platforms
# though - the emulator speaks QMP, so lib/qmp.py drives it and lib/snapshots.py
# records it with the same code.
#
# EVERY STEP RUNS THROUGH LOG-STREAM, and the job runs inside the bake image, like
# every other bake here.
#
# MANUAL ONLY: a boot is a few minutes of a 4-core KVM runner, and the AVD it produces
# depends on a system image that changes only when Google publishes a new r-number.

on:
  workflow_dispatch:
    inputs:
      boot_timeout:
        description: "Seconds to wait for sys.boot_completed"
        default: "900"
      memory_mb:
        description: "Guest memory"
        default: "4096"
      publish:
        description: "Push the AVD to ghcr"
        type: boolean
        default: true

concurrency:
  group: bake-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 20
            # The emulator and adb are in the image; this says so before anything
            # waits on them.
            command -v emulator adb

      - name: bake
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-bake
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=5
            export RECORD_FPS=1
            python3 android/15/bake.py \
              --out out/android15.tar.zst \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --memory-mb "${{ inputs.memory_mb || '4096' }}"

      - name: validate the gold disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-validate
          interval: "15"
          command: |
            set -euo pipefail
            # A SEPARATE PROCESS, AND A SEPARATE BOOT, WITHOUT -wipe-data.
            #
            # The bake already saw sys.boot_completed on the machine it built. This
            # unpacks the archive it produced, starts a guest on that /data, and reads
            # back the marker the bake wrote. Without this step the artifact is "a
            # system image we booted once"; with it, it is "this disk, which boots".
            python3 android/15/validate.py \
              --avd out/android15.tar.zst \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --memory-mb "${{ inputs.memory_mb || '4096' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-recording
          path: |
            out/install.mp4
            out/emulator.log
            out/frames/shots/frames.txt
          if-no-files-found: warn
          retention-days: 14


      # WHEN THE ENCODING NEVER RUNS, THE PICTURES ARE ALL THERE IS.
      #
      # This step was removed once, on the reasoning that lib/vm.record_many() cannot
      # fail silently. It can fail silently enough: a run that is cancelled or times out
      # never reaches the encoding call at all, so `keep the recording` uploads
      # console.log and a frames.txt that lists files nobody can open. That happened to
      # run 41446883463 - 454 frames on the runner, and the artifact was 32 KB.
      #
      # Gated on the mp4 being absent, so the usual case uploads nothing extra: a PPM
      # here is 3 MB and there are hundreds of them.
      # WHEN THE ENCODING NEVER RUNS, ONE PICTURE IS STILL WORTH HAVING - BUT ONLY ONE.
      #
      # A cancelled or timed-out run never reaches the encoding call, and the earlier
      # version of this step uploaded every raw frame: run 41468749665 produced 494 MB of
      # PPM, a hundred files at 6 MiB each, to answer "which pane did it stop on". It
      # takes six minutes to download that to look at one of them.
      #
      # The last frame is the pane the driver stopped on, and lib/lastframe.py converts it
      # to a 300 KiB PNG. Gated on the mp4 being absent, so a normal run uploads nothing
      # extra.
      - name: keep the last frame
        if: always() && hashFiles('out/install.mp4') == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      - name: upload the AVD
        uses: actions/upload-artifact@v4
        with:
          name: android15-avd
          path: out/android15.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0   # already zstd

      - name: push the AVD
        if: ${{ inputs.publish == true || inputs.publish == null }}
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-publish
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            python3 lib/publish_disk.py out/android15.tar.zst --kind android-15-aosp

      - name: what is in the package
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: android-tags
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix android-

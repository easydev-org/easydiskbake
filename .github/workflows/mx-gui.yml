name: mx-gui

# Install MX Linux from its official Live ISO, through minstall, its graphical installer.
#
# MX IS NEITHER CALAMARES NOR UBIQUITY. `minstall` asks three questions, touches the disk,
# and then asks the REST of its questions while it writes - so the driver's flow is
# "terms, type, start, then a sequence of Next pages", not "all the questions then install".
# linux/mx-gui/install.py has the pane-by-pane measurements.
#
# THE MEDIUM IS antiX'S, NOT CASPER'S: the kernel is at `antiX/vmlinuz` and the initrd at
# `antiX/initrd.gz`, and the driver hands both to qemu the way this image's own isolinux
# entry does. OVMF is attached by lib/uefi.py, as for every GUI driver here.
#
# THE ISO IS PINNED to a SourceForge MIRROR HOST, not to `downloads.sourceforge.net`.
#
# The project URL redirects through an interstitial and `lib/fetch_vendor_iso.py`'s HEAD gets
# `HTTP Error 403: Forbidden` from it - measured on run 4247... , which is the only thing that
# failed. A mirror host answers 200 with the real Content-Length, so that is what is pinned,
# together with the sha256 of the file this driver was measured against (25b5ce20...,
# 2927624192 bytes).
#
# MANUAL ONLY: an installer driven by synthetic clicks is not something to run on every push.

on:
  workflow_dispatch:
    inputs:
      bake_run:
        description: "Install Linux Mint 22.3 Cinnamon through Ubiquity"
        type: boolean
        default: true
      iso_url:
        description: "ISO URL (empty for the pinned image)"
        default: ""
      iso_sha256:
        description: "ISO sha256 (empty for the pinned value)"
        default: ""
      disk_size:
        description: "guest disk size"
        default: "64G"
      install_timeout:
        description: "seconds the installer may take"
        default: "5400"
      publish_tag:
        description: "tag to publish under; empty for linux-mint-gui"
        default: "linux-mx-gui"
      boot_timeout:
        description: "stage 2: seconds the booted disk has to reach its desktop"
        default: "900"
      launch_run:
        description: "stage 2: boot the finished disk and check the desktop comes up"
        type: boolean
        default: true
      publish:
        description: "publish the finished disk to ghcr"
        type: boolean
        default: true

concurrency:
  group: mx-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    if: inputs.bake_run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-gui-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix linux-

      - name: fetch the Live ISO
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-gui-iso
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out/iso
            # FROM ghcr, which is what artifacts-publish exists for: the image was fetched
            # once, verified three ways, and pushed as `iso-mx-xfce`. This is a CDN pull.
            python3 lib/fetch_iso.py mx-xfce "out/iso/MX-25.3_Xfce_x64.iso"

      - name: install through Ubiquity
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-gui-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=2
            ISO=$(ls out/iso/*.iso | head -1)
            echo "iso: $ISO"
            python3 linux/mx-gui/install.py \
              --iso "$ISO" \
              --out out/mx-gui.qcow2 \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout "${{ inputs.install_timeout || '5400' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-gui-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: push the disk
        if: success() && inputs.publish
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/mx-gui.qcow2
          kind: linux-mx-gui
          tag: ${{ inputs.publish_tag || 'linux-mx-gui' }}
          token: ${{ github.token }}

  # ===========================================================================
  # STAGE TWO - BOOT THE DISK AND SEE THE DESKTOP. See lib/launch_linux.py.
  # ===========================================================================
  #
  # THE BAKE PROVES THE INSTALL; THIS PROVES THE ARTEFACT. A disk whose bootloader was never
  # written installs perfectly and then does nothing, and the only way to see it is to start
  # the disk with no installer attached - which is what this job does, through the same
  # lib/launch_linux.py the answer-file bakes use.
  #
  # IT PULLS FROM ghcr RATHER THAN TAKING AN ARTIFACT, because a 5 GiB file through the
  # artifact store is slower than the registry and expires. That is why the bake must publish
  # for this job to have anything to start.
  #
  # `--ssh skip` IS STAGE THREE'S QUESTION, NOT THIS ONE. None of these images carries sshd -
  # no GUI driver installs it - so this stage asks whether the desktop comes up, and the frame
  # is its verdict where no session exists to read.
  launch:
    needs: [bake]
    if: |
      always() && inputs.launch_run && inputs.bake_run
      && needs.bake.result == 'success' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      packages: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: launch it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-gui-launch
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/launch_linux.py \
              --tag "${{ needs.bake.outputs.tag || 'linux-mx-gui' }}" \
              --kind mx-gui \
              --ssh skip \
              --artifacts "out/mx-gui-launch" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-gui-launch
          path: |
            out/mx-gui-launch/launch.txt
            out/mx-gui-launch/console.log
            out/mx-gui-launch/screen.png
          if-no-files-found: warn
          retention-days: 14

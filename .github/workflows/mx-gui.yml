name: mx-gui

# Install MX Linux from its official Live ISO, through minstall, its graphical installer.
#
# MX IS NEITHER CALAMARES NOR UBIQUITY. `minstall` asks three questions, touches the disk,
# and then asks the REST of its questions while it writes - so the driver's flow is
# "terms, type, start, then a sequence of Next pages", not "all the questions then install".
# linux/mx-gui/install.py has the pane-by-pane measurements.
#
# THE MEDIUM IS antiX'S, NOT CASPER'S: the kernel is at `antiX/vmlinuz` and the initrd at
# `antiX/initrd.gz`, and the driver hands both to qemu the way this image's own isolinux
# entry does. OVMF is attached by lib/uefi.py, as for every GUI driver here.
#
# THE ISO IS PINNED to the SourceForge project download with its sha256 (25b5ce20...); that
# file is 2927624192 bytes and the value is the one this driver was measured against.
#
# MANUAL ONLY: an installer driven by synthetic clicks is not something to run on every push.

on:
  workflow_dispatch:
    inputs:
      bake_run:
        description: "Install Linux Mint 22.3 Cinnamon through Ubiquity"
        type: boolean
        default: true
      iso_url:
        description: "ISO URL (empty for the pinned image)"
        default: ""
      iso_sha256:
        description: "ISO sha256 (empty for the pinned value)"
        default: ""
      disk_size:
        description: "guest disk size"
        default: "64G"
      install_timeout:
        description: "seconds the installer may take"
        default: "5400"
      publish_tag:
        description: "tag to publish under; empty for linux-mint-gui"
        default: "linux-mx-gui"
      publish:
        description: "publish the finished disk to ghcr"
        type: boolean
        default: true

concurrency:
  group: mx-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    if: inputs.bake_run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-gui-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix linux-

      - name: fetch the Live ISO
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-gui-iso
          interval: "10"
          command: |
            set -euo pipefail
            URL="${{ inputs.iso_url }}"
            SHA="${{ inputs.iso_sha256 }}"
            if [ -z "$URL" ]; then
              URL="https://downloads.sourceforge.net/project/mx-linux/Final/Xfce/MX-25.3_Xfce_x64.iso"
              SHA="25b5ce20caeee1b0e50507291df5ac8a8211b1b9999d8dd7416da9b66ed9fbf9"
            fi
            mkdir -p out/iso
            ISO_URL="$URL" ISO_SHA256="$SHA" DEST="out/iso/MX-25.3_Xfce_x64.iso" \
              python3 lib/fetch_vendor_iso.py --segments 8

      - name: install through Ubiquity
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-gui-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=2
            ISO=$(ls out/iso/*.iso | head -1)
            echo "iso: $ISO"
            python3 linux/mx-gui/install.py \
              --iso "$ISO" \
              --out out/mx-gui.qcow2 \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout "${{ inputs.install_timeout || '5400' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-gui-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: push the disk
        if: success() && inputs.publish
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/mx-gui.qcow2
          kind: linux-mx-gui
          tag: ${{ inputs.publish_tag || 'linux-mx-gui' }}
          token: ${{ github.token }}

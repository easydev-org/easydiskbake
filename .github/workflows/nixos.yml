name: nixos

# Install NixOS from its GRAPHICAL ISO, through the Calamares that image carries, and prove
# the disk started and answers on ssh.
#
#     bake ──> publish ──> launch ──> ssh
#
# WHY THERE IS A GRAPHICAL NIXOS AT ALL
#
# A minimal NixOS needs `nixos-install` typed at a serial console, because the smaller medium
# has no graphical session - that is the right shape for a base system and the wrong shape for
# this repository's idea of a bake, which drives a desktop. So there is no non-graphical NixOS
# workflow: this one is the whole of it, and it drives the wizard the graphical ISO carries.
#
# THE GRAPHICAL IMAGE IS A DIFFERENT INSTALLER. It carries `calamares` and
# `calamares-nixos-extensions`, whose settings.conf is a seven-pane wizard with a footer -
# the same kind of thing Manjaro's, CachyOS' and EndeavourOS' bakes drive. So this is a
# `-gui` bake in the same sense those are: it boots a live desktop, drives the installer, and
# is judged by the disk it wrote.
#
# WHAT IT INSTALLS IS GNOME, which is `packagechooser.conf`'s own `default: gnome`.
#
# AND IT HAS NO SSHD, WHICH IS THE INTERESTING PART
#
# The graphical installer's configuration template ships
#
#     # services.openssh.enable = true;
#
# COMMENTED OUT. A graphical NixOS install therefore has no sshd at all, which is why the
# `ssh` job below is not a formality here - it is the stage that makes the disk reachable.
# It does it the way NixOS means it to be done: it uncomments that line and runs
# `nixos-rebuild switch`, rather than installing a package behind the configuration's back.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      bake_run:
        description: "Install NixOS GNOME through Calamares"
        type: boolean
        default: true
      disk_size:
        description: "guest disk size"
        default: "64G"
      install_timeout:
        description: "seconds the installer may take"
        default: "5400"
      publish_tag:
        description: "tag to publish under; empty for linux-nixos"
        default: "linux-nixos"
      launch_run:
        description: "stage 2: boot the finished disk and check the desktop comes up"
        type: boolean
        default: true
      ssh_from:
        description: "stage 3: a published tag to put sshd on instead of the bake's output"
        default: ""
      ssh_run:
        description: "stage 3: install sshd on the disk and prove the forwarded port answers"
        type: boolean
        default: true
      ssh_port:
        description: "stage 3: the host port forwarded to the guest's 22"
        default: "2222"
      vm_configure_run:
        description: "stage 4: name the machine, mount the share, install the guest agent"
        type: boolean
        default: true
      vm_configure_from:
        description: "stage 4: a published tag to configure instead of the ssh stage's output"
        default: ""
      vm_configure_tag:
        description: "stage 4: tag to publish under; empty for TAG-vm"
        default: ""
      hostname:
        description: "stage 4: the machine's name; empty for easyvm-<8 random characters>"
        default: ""
      boot_timeout:
        description: "stage 2/3: seconds a booted disk has to reach its desktop or its sshd"
        default: "900"
      resolution:
        description: "guest screen as WxH"
        default: "1920x1080"
      publish:
        description: "publish the finished disk to ghcr"
        type: boolean
        default: true

concurrency:
  group: nixos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    if: inputs.bake_run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.publish_tag || 'linux-nixos' }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '40'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix iso-

      # FROM ghcr, AND ONLY FROM ghcr - the same rule every other GUI bake follows.
      #
      # The image is pinned in lib/images.py's DESKTOP table, which is the ONE table
      # artifacts-publish.py reads, so `gh workflow run artifacts-publish.yml
      # -f which=iso-nixos-graphical` is what puts it in the package. lib/fetch_iso.py pulls
      # that tag and re-checks the size and the sha256 against the pin; a tag that is not
      # published fails with the command that publishes it rather than quietly downloading
      # 3.7 GiB from a host nobody chose.
      #
      # THERE IS NO `iso_url` OVERRIDE, DELIBERATELY. An input that downloads from an
      # arbitrary URL is a second source of truth for "which bytes did this bake run
      # against", and this repository's whole caching design exists to have exactly one.
      - name: fetch the graphical ISO
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-iso
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out/iso
            python3 lib/fetch_iso.py nixos-graphical "out/iso/nixos-graphical.iso"

      - name: install through Calamares
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=2
            ISO=$(ls out/iso/*.iso | head -1)
            echo "iso: $ISO"
            python3 linux/nixos/install.py \
              --iso "$ISO" \
              --out out/nixos.qcow2 \
              --disk-size "${{ inputs.disk_size || '64G' }}" \
              --timeout "${{ inputs.install_timeout || '5400' }}"

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: push the disk
        if: success() && inputs.publish
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/nixos.qcow2
          kind: linux-nixos
          tag: ${{ inputs.publish_tag || 'linux-nixos' }}
          token: ${{ github.token }}

  # ===========================================================================
  # STAGE TWO - BOOT THE DISK AND SEE THE DESKTOP. See lib/launch_linux.py.
  # ===========================================================================
  launch:
    needs: [bake]
    if: |
      always() && inputs.launch_run && inputs.bake_run
      && needs.bake.result == 'success' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      packages: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: launch it
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-launch
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/launch_linux.py \
              --tag "${{ needs.bake.outputs.tag || 'linux-nixos' }}" \
              --kind nixos \
              --ssh skip \
              --artifacts "out/nixos-launch" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-launch
          path: |
            out/nixos-launch/launch.txt
            out/nixos-launch/console.log
            out/nixos-launch/screen.png
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # STAGE THREE - PUT SSHD ON THE DISK AND PROVE THE FORWARDED PORT ANSWERS.
  # ===========================================================================
  #
  # WHY THIS IS A SEPARATE STAGE AND NOT PART OF THE BAKE: the disk that was verified is the
  # disk that ships. Installing sshd during the bake would mean the launch stage was checking
  # a different artifact from the one published.
  #
  # WHY IT IS NOT A FORMALITY ON THIS SYSTEM: NixOS' graphical installer template ships
  # `# services.openssh.enable = true;` COMMENTED OUT, so a Calamares NixOS install has no
  # sshd at all. This job is what makes the disk reachable, and it does it NixOS' own way -
  # uncomment that line and run `nixos-rebuild switch`.
  #
  # THE PROOF IS MEASURED FROM OUTSIDE THE GUEST: lib/session.py connects to the forwarded
  # port with the account's password and runs a command. "A port is open" is not the claim
  # being made; "another container can ssh in and execute something" is.
  ssh:
    needs: [bake]
    # STAGE THREE CAN BE RUN ON ITS OWN, against a tag that is already published.
    #
    # `ssh_from` is what makes that possible, and it is the same shape windows-11.yml uses:
    # the job either follows the bake it depends on, or starts from a tag named by the
    # caller. Without it a stage that only needs a disk could not be re-run without
    # re-running a two-hour install first - which is exactly what was needed to test it.
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != ''
          || (inputs.bake_run && inputs.publish && needs.bake.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # THE SAME THREE AS EVERY GUEST JOB, because the guest is on a tap: the forwarded port
      # 2222 lives on the bridge address and the DNAT rule that puts it there needs
      # NET_ADMIN, exactly as lib/net.py documents.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '30'
          token: ${{ github.token }}

      - name: install sshd and prove it answers
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-ssh
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/ssh_step.py \
              --tag "${{ inputs.ssh_from || needs.bake.outputs.tag || 'linux-nixos' }}" \
              --kind nixos \
              --artifacts out/nixos-ssh \
              --work out/nixos-ssh/work \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --publish-out out/nixos-vm.qcow2

      # THE DISK THIS STAGE MADE IS THE NEXT STAGE'S INPUT, so it is published rather than only
      # archived. The artifact below is the post-mortem; this is the product.
      - name: push the ssh disk
        if: success()
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/nixos-vm.qcow2
          kind: nixos-ssh
          tag: ${{ inputs.publish_tag || 'linux-nixos' }}-ssh
          token: ${{ github.token }}

      - name: keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-ssh
          path: |
            out/nixos-ssh/ssh.txt
            out/nixos-ssh/install.mp4
            out/nixos-ssh/last-frame.png
            out/nixos-ssh/console.log
            out/nixos-ssh/steps/*.png
          if-no-files-found: warn
          retention-days: 14

  # =========================================================================================
  # STAGE FOUR. macOS' vm-configure, for the Linux family.
  # =========================================================================================
  #
  # It runs on the disk the ssh stage published, and it does the three things a finished Linux
  # disk needs before anything is installed on it:
  #
  #     the machine's name        easyvm-<8 random characters>, set with hostnamectl
  #     the host share            ~/shared, mounted from this stage's own smbd
  #     the qemu guest agent      a shutdown that is a request, not a power button
  #
  # It also installs the login launcher, which is what runs ~/shared/bootstrap.sh at the next
  # login - the same contract macOS' stage four installs, through a systemd user unit rather than
  # a LaunchAgent.
  #
  # WHY IT IS A JOB OF ITS OWN AND NOT MORE STEPS ON THE ssh JOB
  #
  # Because it is useful against a disk that already exists. `vm_configure_from` names a tag, so
  # this stage can be re-run without re-running the two-hour install behind it - which is exactly
  # what was needed to write it.
  vm-configure:
    needs: [ssh]
    if: |
      always() && inputs.vm_configure_run
      && (inputs.vm_configure_from != ''
          || (inputs.ssh_run && needs.ssh.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # THE SHARE IS ON THE BRIDGE and the forwarded port needs a DNAT rule, so this job has the
      # same three privileges every guest job has.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.vm_configure_tag || 'linux-nixos-vm' }}
      hostname: ${{ steps.name.outputs.hostname }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          # THE DISK TWICE PLUS A COPY: vm_configure writes out/<kind>-vm.qcow2 beside the pulled
          # one, and the stage's own work directory holds the console log and frames.
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-vm-configure-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix linux-

      - name: pull the ssh disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.vm_configure_from || format('{0}-ssh', inputs.publish_tag || 'linux-nixos') }}
          dest: out
          token: ${{ github.token }}

      - name: configure the vm (name, share, guest agent)
        id: configure
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: nixos-vm-configure
          interval: "20"
          command: |
            set -euo pipefail
            DISK=$(ls out/*.qcow2 | head -1)
            python3 linux/nixos/vm_configure.py \
              --disk "$DISK" \
              --out out/nixos-vm-configure.qcow2 \
              --walk linux/nixos/steps/vm-configure.yaml \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --hostname "${{ inputs.hostname }}" \
              | tee out/hostname.txt

      # A PLAIN `run:` STEP, BECAUSE THIS IS WHERE THE NEXT JOB'S NAME COMES FROM. GITHUB_OUTPUT
      # is the runner's own mechanism; routing it through a third-party action would make the
      # chain depend on how that action treats the variable - the same note macos15.yml carries
      # above its own publish step.
      - name: record the machine's name
        id: name
        run: |
          set -euo pipefail
          NAME=$(grep -o "this machine will be named '[^']*'" out/hostname.txt \
                 | sed "s/.*named '//; s/'//")
          test -n "$NAME"
          echo "hostname=$NAME" >> "$GITHUB_OUTPUT"
          echo "the machine is $NAME"

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-vm-configure-last-frame
          path: |
            out/last-frame.png
            out/hostname.txt
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/nixos-vm-configure.qcow2
          kind: nixos-vm-configure
          tag: ${{ inputs.vm_configure_tag || 'linux-nixos-vm' }}
          token: ${{ github.token }}

name: redox-probe

# Boot a Redox OS image and report what it is, before any bake is written.
#
# WHY A PROBE AND NOT A BAKE
#
# Redox is the sixth operating system candidate. Its desktop image is 144 MiB - against
# macOS's 28 GiB - so a run costs seconds, and four questions decide whether a bake is worth
# writing at all:
#
#     1. does the image boot under this repository's qemu invocation
#     2. does Orbital come up and draw
#     3. does the guest get a network address
#     4. is there an sshd, or only a console
#
# A bake written before those are answered would be a guess dressed as a pipeline. The probe
# answers 1 and 2 from the frame it captures, and its recording is what a person looks at.
#
# WHAT THE IMAGE IS
#
# A RAWest disk image with Redox's own bootloader and a RedoxFS root - not an ISO. It is
# booted as a virtio disk, read-only, so a probe can never write to the release image.
#
# THE CPU STRING IS REDOX'S OWN. Its documentation gives
# "Broadwell,-pcid,-x2apic,-tsc-deadline,-hle,-rtm,-invpcid" for QEMU; the kernel does not
# handle those six features, and the symptom is a boot that stops with nothing on screen.
# Substituting the repository's usual "host" would produce exactly that and look like a bad
# image.
#
# THE IMAGE IS PINNED BY SHA256, like every other download here. Redox publishes a new daily
# build, so an unpinned URL would silently change under the probe - and a probe whose subject
# changes is not a measurement.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "The .img.zst to probe (a Redox daily or release build)"
        default: >-
          https://static.redox-os.org/img/x86_64/redox_desktop_x86_64_2026-11-03_575_harddrive.img.zst
      sha256:
        description: "Its sha256, from the SHA256SUM beside it"
        default: "ff3affbba2a2737e1ac015f599cf8dc3f6df220f5620ccacf66ab17c56de491b"
      seconds:
        description: "Seconds to watch the guest after it starts"
        default: "240"
      mem:
        description: "Guest memory in MB"
        default: "2048"

concurrency:
  group: redox-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # the image is 144 MiB compressed and 500 MiB raw, plus the recording
            python3 lib/ci.py free-disk --need 5
            # zstd is what decompresses it; report the version rather than discover its
            # absence as a traceback
            zstd --version | head -1

      - name: fetch and boot it
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-boot
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            python3 - <<'PY'
            import sys
            sys.path.insert(0, "lib")
            import iso

            # THE SAME DOWNLOADER AS EVERY OTHER ARTIFACT HERE, because it resumes: a probe
            # that restarts a dropped transfer is a probe that sometimes does not happen.
            iso.fetch_url(
                "${{ inputs.url }}",
                "out/redox.img.zst",
                sha256="${{ inputs.sha256 }}",
            )
            PY
            python3 redox/probe.py \
              --image out/redox.img.zst \
              --work out/redox-work \
              --artifacts out/redox-probe \
              --seconds "${{ inputs.seconds || '240' }}" \
              --mem "${{ inputs.mem || '2048' }}"

      # THE FRAME AND THE RECORDING ARE THE RESULT. "It booted" is not a claim this stage
      # can make from an exit code; a picture of Orbital is.
      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-probe
          path: |
            out/redox-probe/probe.txt
            out/redox-probe/orbital.png
            out/redox-probe/last-frame.png
            out/redox-probe/install.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: the verdict
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-verdict
          interval: "10"
          command: |
            set -euo pipefail
            F="out/redox-probe/probe.txt"
            echo "=== redox ==="
            if [ -f "$F" ]; then cat "$F"; else echo "no verdict was written"; fi

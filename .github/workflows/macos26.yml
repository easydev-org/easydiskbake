name: macos26

# macOS 26 IS NOT A SUPPORTED FULL-INSTALL TARGET. THIS WORKFLOW STOPS AT THE DESKTOP.
#
#     setup -> desktop
#
# and there is no ssh stage, no dev stage and no usable published disk, because a macOS 26
# disk does not survive the trip through Setup Assistant. What was measured:
#
#   * The wizard never finishes. Its "Update Mac Automatically" pane greys Continue and Back,
#     spins, opens no outbound connection and never advances; a `system_reset` is the only way
#     out and it leaves the wizard state unwritten on disk. `/var/db/.AppleSetupDone` exists and
#     every `DidSee*` key is true, and the wizard still reappears after a clean shutdown.
#   * `system_powerdown` is ignored outright - 60 s and 150 s, no response.
#   * THE ONE WAY TO SEE A macOS 26 DESKTOP IS TO RESTART INSIDE THE SETUP RUN. Booting the
#     disk that setup produced lands back on the wizard, or hangs. So the desktop stage here
#     drives the wizard forward in the same boot and is the last thing that can be done with
#     that disk.
#   * A disk baked by this workflow still hangs when it is booted later on its own. That is the
#     observation the note above is about, and it is why nothing downstream pulls these tags.
#
# macOS 15 is the release with the full pipeline - setup, desktop, ssh, dev - and it is the
# only one that produces a disk which boots to a login screen and accepts a login. Use
# macos15.yml.
#
# WHY THE DESKTOP JOB IS STILL HERE
#
# Because it is the only evidence that 26 can reach a desktop at all, and because it is what
# would have to work before the release could be supported. Removing it would remove the
# measurement without fixing anything.
#
# WHY ONE WORKFLOW
#
# These were four workflows, and each had to be started by hand with the tag the previous one
# produced: a form per stage, a chance per stage to type the tag wrong, and nothing in any run
# graph recording that they are a chain at all. The chain is four stages here because macOS
# genuinely fails in four different places - the installer, the wizard, Remote Login, the
# toolchain - and each is worth its own job and its own timeout. macOS 26 keeps two of them.
#
# EVERY JOB TAKES A TAG, AND THAT IS THE POINT
#
#     <job>_run          should this job run
#     <job>_from         the tag to pull; empty means "use what the job above produced"
#
# NO BOOTSTATE IS PASSED BETWEEN THESE JOBS, AND THAT IS DIFFERENT FROM WINDOWS.
#
# A Windows disk boots by a boot entry in its OVMF variables, so every stage there needs the run
# id that holds them. macOS does not: lib/opencore.build() writes a fresh copy of the firmware
# variables from a pinned template every time a machine starts, and OpenCore is booted from
# boot.img, which travels inside the disk's own directory. The tag is the whole handoff.
#
# `if: always() && ...` on every downstream job is what lets one start in the middle: `needs`
# alone skips a job when the one above was skipped, and that is exactly the case of starting
# from a tag. The real precondition is that there is a tag to pull, so that is what it tests.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      # --- what to run ---------------------------------------------------------------
      setup_run:
        description: "Install macOS 26 and stop at the Setup Assistant (~60 minutes)"
        type: boolean
        default: true

      # --- where each job starts -----------------------------------------------------
      desktop_run:
        description: "Drive the Setup Assistant to a desktop - ~45 minutes"
        type: boolean
        default: true

      # --- where each job starts -----------------------------------------------------
      setup_from:
        description: "setup: pull this tag instead of installing"
        default: ""
      desktop_from:
        description: "desktop: pull this tag instead of the setup job's output"
        default: ""

      # --- setup ----------------------------------------------------------------------
      release:
        description: "setup: macOS release"
        default: "26"
      disk_size:
        description: "setup: guest disk size"
        default: "128G"
      install_timeout:
        description: "setup: seconds the installer may run"
        default: "7200"
      assistant_timeout:
        description: "setup: seconds the Setup Assistant driver may run"
        default: "2700"

      # --- desktop ---------------------------------------------------------------------
      wizard_timeout:
        description: >-
          setup: seconds to wait for the installer to finish and the wizard to appear. This
          is the copy and the first boot, not the wizard - the pane itself says ~45 minutes.
        default: "7200"
      desktop_timeout:
        description: "desktop: seconds to wait for the desktop after the wizard"
        default: "1800"
      inspect_after:
        description: "desktop: stop this many seconds after the wizard and publish nothing"
        default: ""

      # --- ssh / dev -------------------------------------------------------------------
      #
      # THERE IS NO SSH STAGE ON macOS 26. Its inputs are gone with the job: ssh_run, ssh_from,
      # ssh_port, boot_timeout and ssh_publish_tag would be a form asking for settings that
      # drive nothing. The reason the stage cannot exist is at the top of this file.
      publish_tag:
        description: "the tag to publish under; empty for macos26-setup"
        default: ""
      desktop_publish_tag:
        description: "desktop: tag to publish under; empty for macos26-desktop"
        default: ""

concurrency:
  group: macos26-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # SETUP - install to the Setup Assistant and stop there.
  # ===========================================================================
  setup:
    if: inputs.setup_run || inputs.setup_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.setup_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos26-setup-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: bake
        if: inputs.setup_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos26-setup
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL="${{ inputs.snapshot_interval || '1' }}"
            export RECORD_FPS=1
            export MACOS_USER=vmuser
            export MACOS_PASSWORD=admin

            export MACOS_RELEASE=26
            python3 macos/26/bake.py \
              --out "out/macos26.qcow2" \
              --release "26" \
              --disk-size "${{ inputs.disk_size || '128G' }}" \
              --timeout "${{ inputs.install_timeout || '7200' }}" \
              --assistant-timeout "${{ inputs.assistant_timeout || '2700' }}" \
              --wizard-timeout "${{ inputs.wizard_timeout || '7200' }}" \
              --desktop-timeout 1800

      - name: keep the recording
        if: always() && inputs.setup_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: macos26-setup-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the last frame
        if: always() && inputs.setup_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: macos26-setup-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      # THE BOOTSTATE GOES WITH THE DISK. OpenCore's boot entry and the firmware variables live
      # in the work directory, not on the disk and not in the tag.
      # A PLAIN `run:` STEP, BECAUSE THIS IS WHERE THE NEXT JOB'S TAG COMES FROM. GITHUB_OUTPUT
      # is the runner's own mechanism; routing it through a third-party action would make the
      # chain depend on how that action treats the variable.
      - name: push the disk
        if: success() && inputs.setup_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos26.qcow2
          kind: macos26-setup
          tag: ${{ inputs.publish_tag || 'macos26-setup' }}
          token: ${{ github.token }}
  desktop:
    needs: setup
    if: |
      always() && inputs.desktop_run
      && (inputs.desktop_from != '' || needs.setup.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      # WHAT THE RUN REPORTS AS ITS RESULT. There is no stage after this one to hand a tag
      # to - see the note at the top: a macOS 26 disk does not boot back to this desktop, so
      # publishing one would publish a disk that hangs. The output is kept because the push
      # step still produces the tag, and a reader looking for "where did macos26-desktop go"
      # should find the answer here rather than in the absence of a field.
      tag: ${{ inputs.desktop_publish_tag || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos26-desktop-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: pull the setup disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.desktop_from || needs.setup.outputs.tag }}
          dest: out
          token: ${{ github.token }}
      - name: drive the Setup Assistant
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          # THE NAME CARRIES THE RUN, BECAUSE TWO WORKFLOWS SHARE THIS SUITE.
          #
          # macos15.yml and macos26.yml both run this stage under the name `desktop-drive`,
          # and both were dispatched against the same commit - so the two check runs had the
          # same name, the same sha and the same repository. Reading one, there was no way to
          # tell which run it belonged to, and an hour was spent reading macos26's log while
          # looking for macos15's. run 42280638394 was the cost.
          #
          # github.run_id is unique per dispatch and is what the rest of the workflow already
          # uses to key its artifacts.
          name: desktop-drive-${{ github.run_id }}
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=1
            export MACOS_USER=vmuser
            export MACOS_PASSWORD=admin

            export MACOS_RELEASE=26
            DISK=$(ls out/*.qcow2 | head -1)
            echo "setup disk: $DISK"
            python3 macos/15/desktop.py \
              --disk "$DISK" \
              --out out/macos26-desktop.qcow2 \
              --release 26 \
              --assistant-timeout "${{ inputs.assistant_timeout || '2700' }}" \
              --desktop-timeout "${{ inputs.desktop_timeout || '1800' }}" \
              ${{ inputs.inspect_after != '' && format('--inspect-after {0}', inputs.inspect_after) || '' }}

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos26-desktop-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos26-desktop-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos26-desktop.qcow2
          kind: macos26-desktop
          tag: ${{ inputs.desktop_publish_tag || 'macos26-desktop' }}
          token: ${{ github.token }}


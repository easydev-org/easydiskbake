name: macos26

# macOS 26: recovery -> Setup Assistant. The desktop, ssh and dev stages are not here yet.
#
#     setup
#
# WHY ONLY ONE JOB
#
# 15 has four stages and 26 has one, because that is what exists. macos/26/ has bake.py and
# install.py - its own coordinates, measured from Tahoe's own panes - and no desktop.py, ssh.py
# or dev.py. Writing those job definitions now would be writing the sequence before the
# positions are measured, which is the mistake every earlier macOS run was: a plausible
# coordinate and a recording that disagreed with it.
#
# The other three stages join this file when they have something to run.
#
# WHY ONE WORKFLOW
#
# These were four workflows, and each had to be started by hand with the tag the previous one
# produced: a form per stage, a chance per stage to type the tag wrong, and nothing in any run
# graph recording that they are a chain at all. The chain is four stages here because macOS
# genuinely fails in four different places - the installer, the wizard, Remote Login, the
# toolchain - and each is worth its own job and its own timeout.
#
# EVERY JOB TAKES A TAG, AND THAT IS THE POINT
#
#     <job>_run          should this job run
#     <job>_from         the tag to pull; empty means "use what the job above produced"
#
# NO BOOTSTATE IS PASSED BETWEEN THESE JOBS, AND THAT IS DIFFERENT FROM WINDOWS.
#
# A Windows disk boots by a boot entry in its OVMF variables, so every stage there needs the run
# id that holds them. macOS does not: lib/opencore.build() writes a fresh copy of the firmware
# variables from a pinned template every time a machine starts, and OpenCore is booted from
# boot.img, which travels inside the disk's own directory. The tag is the whole handoff.
#
# `if: always() && ...` on every downstream job is what lets one start in the middle: `needs`
# alone skips a job when the one above was skipped, and that is exactly the case of starting
# from a tag. The real precondition is that there is a tag to pull, so that is what it tests.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      # --- what to run ---------------------------------------------------------------
      setup_run:
        description: "Install macOS 26 and stop at the Setup Assistant (~60 minutes)"
        type: boolean
        default: true

      # --- where each job starts -----------------------------------------------------
      desktop_run:
        description: "Drive the Setup Assistant to a desktop - ~45 minutes"
        type: boolean
        default: true

      # --- where each job starts -----------------------------------------------------
      setup_from:
        description: "setup: pull this tag instead of installing"
        default: ""
      desktop_from:
        description: "desktop: pull this tag instead of the setup job's output"
        default: ""

      # --- setup ----------------------------------------------------------------------
      release:
        description: "setup: macOS release"
        default: "26"
      disk_size:
        description: "setup: guest disk size"
        default: "128G"
      install_timeout:
        description: "setup: seconds the installer may run"
        default: "7200"
      assistant_timeout:
        description: "setup: seconds the Setup Assistant driver may run"
        default: "2700"

      # --- desktop ---------------------------------------------------------------------
      wizard_timeout:
        description: >-
          setup: seconds to wait for the installer to finish and the wizard to appear. This
          is the copy and the first boot, not the wizard - the pane itself says ~45 minutes.
        default: "7200"
      desktop_timeout:
        description: "desktop: seconds to wait for the desktop after the wizard"
        default: "1800"
      inspect_after:
        description: "desktop: stop this many seconds after the wizard and publish nothing"
        default: ""

      # --- ssh / dev -------------------------------------------------------------------
      publish_tag:
        description: "the tag to publish under; empty for macos26-<stage>"
        default: ""
      desktop_publish_tag:
        description: "desktop: tag to publish under; empty for macos26-desktop"
        default: ""
      ssh_publish_tag:
        description: "ssh: tag to publish under; empty for macos26-ssh"
        default: ""
      ssh_run:
        description: "Turn Remote Login on, prove it answers, and clean - ~40 minutes"
        type: boolean
        default: true
      ssh_from:
        description: "ssh: pull this tag instead of the desktop job's output"
        default: ""
      ssh_port:
        # 2222, THE SAME PORT EVERY OTHER SYSTEM USES. It was 2223 for no reason that
        # survives inspection: each job is its own container on its own network, so a
        # macOS run and a Linux run forwarding 2222 are forwarding to two different
        # loopback interfaces. The odd number only meant a reader had to remember which
        # system was special.
        description: "ssh: host port forwarded to the guest's sshd"
        default: "2222"
      boot_timeout:
        description: "ssh: seconds to wait for the desktop, and for each boot after"
        default: "900"

concurrency:
  group: macos26-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # SETUP - install to the Setup Assistant and stop there.
  # ===========================================================================
  setup:
    if: inputs.setup_run || inputs.setup_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.setup_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos26-setup-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: bake
        if: inputs.setup_from == ''
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos26-setup
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL="${{ inputs.snapshot_interval || '1' }}"
            export RECORD_FPS=1
            export MACOS_USER=docker
            export MACOS_PASSWORD=admin
            python3 macos/26/bake.py \
              --out "out/macos26.qcow2" \
              --release "26" \
              --disk-size "${{ inputs.disk_size || '128G' }}" \
              --timeout "${{ inputs.install_timeout || '7200' }}" \
              --assistant-timeout "${{ inputs.assistant_timeout || '2700' }}" \
              --wizard-timeout "${{ inputs.wizard_timeout || '7200' }}" \
              --desktop-timeout 1800

      - name: keep the recording
        if: always() && inputs.setup_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: macos26-setup-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the last frame
        if: always() && inputs.setup_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: macos26-setup-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      # THE BOOTSTATE GOES WITH THE DISK. OpenCore's boot entry and the firmware variables live
      # in the work directory, not on the disk and not in the tag.
      # A PLAIN `run:` STEP, BECAUSE THIS IS WHERE THE NEXT JOB'S TAG COMES FROM. GITHUB_OUTPUT
      # is the runner's own mechanism; routing it through a third-party action would make the
      # chain depend on how that action treats the variable.
      - name: push the disk
        if: success() && inputs.setup_from == ''
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos26.qcow2
          kind: macos26-setup
          tag: ${{ inputs.publish_tag || 'macos26-setup' }}
          token: ${{ github.token }}
  desktop:
    needs: setup
    if: |
      always() && inputs.desktop_run
      && (inputs.desktop_from != '' || needs.setup.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      # WHAT THE SSH JOB PULLS WHEN IT IS NOT GIVEN A TAG. Without this, a full run's ssh
      # stage has no disk to start from and skips - which is what the workflow could not do
      # before: it ended at desktop, so nothing ever turned Remote Login on and nothing ever
      # cleaned a macOS 26 disk.
      tag: ${{ inputs.desktop_publish_tag || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos26-desktop-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: pull the setup disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.desktop_from || needs.setup.outputs.tag }}
          dest: out
          token: ${{ github.token }}
      - name: drive the Setup Assistant
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: desktop-drive
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=1
            export MACOS_USER=docker
            export MACOS_PASSWORD=admin
            DISK=$(ls out/*.qcow2 | head -1)
            echo "setup disk: $DISK"
            python3 macos/15/desktop.py \
              --disk "$DISK" \
              --out out/macos26-desktop.qcow2 \
              --assistant-timeout "${{ inputs.assistant_timeout || '2700' }}" \
              --wizard-timeout "${{ inputs.wizard_timeout || '7200' }}" \
              --desktop-timeout "${{ inputs.desktop_timeout || '1800' }}" \
              ${{ inputs.inspect_after != '' && format('--inspect-after {0}', inputs.inspect_after) || '' }}

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos26-desktop-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos26-desktop-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos26-desktop.qcow2
          kind: macos26-desktop
          tag: ${{ inputs.desktop_publish_tag || 'macos26-desktop' }}
          token: ${{ github.token }}

  # ===========================================================================
  # SSH - turn Remote Login on, prove it answers, then clean.
  # ===========================================================================
  #
  # THIS JOB DID NOT EXIST. macOS 26's chain ended at desktop, so no macOS 26 disk ever had
  # an sshd - which means no stage after it could be driven, and NO CLEAN COULD RUN AT ALL.
  # lib/clean_disk reaches a guest over ssh; a disk with no sshd cannot be cleaned by it.
  #
  # It reuses macos/15/ssh.py, which is the same decision macos/26/install.py already makes:
  # the Setup Assistant, the driver and the Recovery class are macos/15's, and macos/26 keeps
  # only the measurements that differ.
  ssh:
    needs: desktop
    if: |
      always() && inputs.ssh_run
      && (inputs.ssh_from != '' || needs.desktop.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write
    outputs:
      tag: ${{ inputs.ssh_from || steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          disk-gb: '80'
          token: ${{ github.token }}

      - name: prepare
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos26-ssh-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix macos-

      - name: pull the desktop disk
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: ${{ inputs.ssh_from || needs.desktop.outputs.tag }}
          dest: out
          token: ${{ github.token }}

      - name: enable Remote Login
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-enable
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=1
            export MACOS_USER=docker
            export MACOS_PASSWORD=admin
            DISK=$(ls out/*.qcow2 | head -1)
            python3 macos/15/ssh.py \
              --disk "$DISK" \
              --out out/macos26-ssh.qcow2 \
              --ssh-port "${{ inputs.ssh_port || '2222' }}" \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      - name: clean the disk
        # NOW THAT sshd ANSWERS. This is the only place a macOS 26 disk can be cleaned: setup
        # and desktop both finish with a machine that has never had Remote Login on.
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: macos26-ssh-clean
          interval: "20"
          command: |
            set -euo pipefail
            python3 lib/clean_step.py \
              --disk out/macos26-ssh.qcow2 \
              --kind macos \
              --work out/macos26-ssh-clean-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '1800' }}" \
              --mem 8192

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos26-ssh-recording
          path: |
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos26-ssh-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      - name: push the disk
        if: success()
        id: publish
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: out/macos26-ssh.qcow2
          kind: macos26-ssh
          tag: ${{ inputs.ssh_publish_tag || 'macos26-ssh' }}
          token: ${{ github.token }}

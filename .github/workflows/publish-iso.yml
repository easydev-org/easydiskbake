name: publish-iso

# Download the pinned installer images once, verify them, and push each to this
# repository's own ghcr package.
#
#     ghcr.io/easydev-org/easydiskbake:iso-windows11
#     ghcr.io/easydev-org/easydiskbake:iso-windows11-enterprise-eval
#     ghcr.io/easydev-org/easydiskbake:iso-virtio-win
#     ghcr.io/easydev-org/easydiskbake:iso-mx
#     ghcr.io/easydev-org/easydiskbake:iso-alpine
#
# One workflow for every platform, because lib/iso.py pulls all of them with the same
# three registry calls and the same tag scheme. Splitting by platform would mean two
# places to look when an image is missing.
#
# WHY THIS IS ITS OWN WORKFLOW
#
# A bake used to download 7.2 GiB from Microsoft as its first step. That made every
# bake a 90-minute job whose first half was a transfer with its own failure modes, and a
# re-run paid for it again even when nothing had changed.
#
# Here the download is a job with its own messages, and the bake pulls from a CDN. More
# importantly, when a vendor rotates a build this job fails and says so, and the bake
# never starts - instead of a bake failing at minute forty inside a container.
#
# WHEN A PIN EXPIRES
#
#     [publish] FAILED iso-windows11: sha256 mismatch:
#       expected d141f60...
#       actual   <something else>
#     The vendor has probably published a new build; update lib/images.py.
#
# Update url, sha256, size and wim index in lib/images.py, commit, run this again.
# windows/11/bake.py reads the same table, so the two cannot disagree.
#
# MANUAL ONLY: downloading 7.2 GiB and overwriting a tag every bake depends on is a
# decision, not a side effect.

on:
  workflow_dispatch:
    inputs:
      which:
        description: "Which image(s) to publish"
        type: choice
        options:
          - iso-windows11
          - iso-virtio-win
          - iso-windows11-enterprise-eval
          - iso-mx
          - iso-alpine
          - all
        # Not "all" by default: that is 18 GiB of downloads, and the two images a
        # Windows bake needs are the first two. "all" is there for a deliberate refresh.
        default: iso-windows11

concurrency:
  group: publish-iso-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-24.04
    # In the image, like every other job here: it carries oras, curl and aria2, and
    # a publish that runs in a different environment from the bake is one more
    # difference to explain when an image is missing.
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: publish-iso-prepare
          interval: "10"
          command: |
            set -euo pipefail
            # A check, not a cleanup: the runner reported 121 GB free. See ci.py.
            python3 lib/ci.py free-disk --need 30
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            python3 lib/publish_iso.py --list

      - name: publish
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: publish-iso
          interval: "20"
          command: |
            set -euo pipefail
            # GITHUB_TOKEN is what lib/iso.py uses to authenticate when a bake pulls
            # the image back; the vendor download does not need it. The selection is
            # resolved in Python so the workflow has no branching of its own.
            export GITHUB_TOKEN="${{ github.token }}"
            export PUBLISH_WHICH="${{ inputs.which || 'all' }}"
            python3 lib/publish_iso.py --repository "${{ github.repository }}"

      - name: what is in the package
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: publish-iso-tags
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix iso- || true

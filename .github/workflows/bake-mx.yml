name: bake-mx

# Install MX Linux by driving its graphical installer, and record it.
#
# The record is the point of this run. Every previous attempt at MX was diagnosed from
# log lines, and a log line is a summary of something that already happened - while the
# questions that actually cost time (is a dialog waiting, did the pane change, is
# lightdm up) are answered by a picture and by nothing else.
#
# Every step runs through log-stream so the run is readable while it happens.
#
# MANUAL ONLY: 90 minutes of a KVM runner for a disk that changes only when the
# distribution does.

on:
  workflow_dispatch:
    inputs:
      mx_version:
        description: "MX release"
        default: "25.3"
      mx_edition:
        description: "MX edition"
        default: "Xfce"
      drive_seconds:
        description: "How long the GUI driver may work"
        default: "1800"
      snapshot_interval:
        description: "Seconds between recorded frames"
        default: "1"

concurrency:
  group: bake-mx-${{ github.ref }}
  cancel-in-progress: false

env:
  BAKE_IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  bake:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm

      - name: bake
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: mx-bake
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out
            export MX_VERSION="${{ inputs.mx_version || '25.3' }}"
            export MX_EDITION="${{ inputs.mx_edition || 'Xfce' }}"
            export DRIVE_SECONDS="${{ inputs.drive_seconds || '1800' }}"
            export SNAPSHOT_INTERVAL="${{ inputs.snapshot_interval || '1' }}"
            export GITHUB_TOKEN="${{ github.token }}"
            export OUT="$PWD/out/mx.qcow2"
            python3 linux/mx/bake.py

      # The disk, if the install landed.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mx-disk
          path: out/mx.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # The recording, always - it is what explains a failed run. Not the VNC stream:
      # this ffmpeg has no vnc demuxer, so the frames are captured over QMP and encoded
      # at the end of the bake.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mx-recording
          path: |
            out/install.mp4
            out/frames/bake.log
            out/frames/shots/snapshots.log
            out/console.log
            out/smoke/smoke.log
          if-no-files-found: warn
          retention-days: 14

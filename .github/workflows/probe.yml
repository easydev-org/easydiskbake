name: probe

# Ask the shipped image what it can actually do about recording, rather than reading
# release notes about what it ought to be able to do.
#
# The question: `ffmpeg -f vnc` fails with "Unknown input format: 'vnc'". Four ways to
# get a video of a guest, and each is settled by one command against this image. The
# answers are in lib/probe.py so they can be re-run locally.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: what the binaries can do
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: probe
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/probe.py

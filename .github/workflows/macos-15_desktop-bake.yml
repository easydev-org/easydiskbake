name: macos-15_desktop-bake

# Take a macOS disk from the Setup Assistant to its desktop, and publish it.
#
# THE STAGE BOUNDARY
#
#   macos-15_setup-bake      recovery -> macOS installed, boots into the Setup Assistant
#   macos-15_desktop-bake    THIS: the wizard answered -> a disk that reaches a desktop
#   macos-15_ssh-bake        Remote Login turned on
#   macos-15_dev-bake        the developer toolchain
#
# The setup bake publishes a disk that stops at the wizard, on purpose: the wizard is a
# GUI with no unattended form, so answering it is a different kind of work (coordinates,
# a driver, a recording to look at) from installing the system.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      setup_tag:
        description: "The setup-stage disk in this package"
        default: "macos15-setup"
      publish_tag:
        description: "Tag to publish under, or empty for a timestamped one"
        default: ""
      assistant_timeout:
        description: "Seconds the Setup Assistant driver may run"
        default: "2700"
      desktop_timeout:
        description: "Seconds to wait for a desktop after the wizard"
        default: "1800"
      inspect_after:
        description: >-
          Stop this many seconds after the wizard's last click, keep the recording and
          publish nothing. For looking at what the wizard actually did instead of waiting
          out desktop_timeout. Empty means the normal run.
        default: ""

concurrency:
  group: macos-15-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: desktop-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # the disk, its copy, and the compressed output beside it
            python3 lib/ci.py free-disk --need 80
            python3 lib/ci.py tags --prefix macos-asset-

      - name: pull the setup disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: desktop-pull
          interval: "10"
          command: |
            set -euo pipefail
            mkdir -p out
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            # A 28 GiB BLOB OVER HTTP/2 GETS RESET, AND oras pull HAS NO RETRY.
            #
            # Run 41767232221 spent six minutes twenty-five seconds downloading
            # macos15-setup and then failed with
            #
            #     copy failed: stream error: stream ID 1; PROTOCOL_ERROR;
            #     received from peer
            #
            # which is the registry dropping a long transfer, not a bad artifact.
            # lib/pull_disk.py retries it and keeps the partial file between
            # attempts, so the second try resumes instead of starting over.
            python3 lib/pull_disk.py \
              "${{ inputs.setup_tag || 'macos15-setup' }}" --dest out

      - name: drive the Setup Assistant
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: desktop-drive
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export SNAPSHOT_INTERVAL=1
            export MACOS_USER=docker
            export MACOS_PASSWORD=admin
            DISK=$(ls out/*.qcow2 | head -1)
            echo "setup disk: $DISK"
            python3 macos/15/desktop.py \
              --disk "$DISK" \
              --out out/macos15-desktop.qcow2 \
              --assistant-timeout "${{ inputs.assistant_timeout || '2700' }}" \
              --desktop-timeout "${{ inputs.desktop_timeout || '1800' }}" \
              ${{ inputs.inspect_after != '' && format('--inspect-after {0}', inputs.inspect_after) || '' }}

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-recording
          path: |
            out/install.mp4
            out/last-frame.png
            out/frames/shots/frames.txt
          if-no-files-found: warn
          retention-days: 14

      # THE LAST FRAME, ON ITS OWN, ON EVERY OUTCOME.
      #
      # `keep the recording` already carries out/last-frame.png inside the mp4's artifact,
      # which is fine while the video is there and useless when it is not: a run cancelled
      # mid-install, or one whose encoder never ran, leaves the frame as the only image of
      # the pane the driver stopped on. The two setup stages already publish it separately;
      # these three did not, and there is no reason for the difference.
      #
      # 300 KiB, and it is the file a person opens first when a stage fails.
      - name: keep the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-last-frame
          path: out/last-frame.png
          if-no-files-found: warn
          retention-days: 7

      - name: upload the disk
        uses: actions/upload-artifact@v4
        with:
          name: macos15-desktop-qcow2
          path: out/macos15-desktop.qcow2
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: push the disk
        if: ${{ success() && (inputs.publish == true || inputs.publish == null) }}
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: desktop-publish
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            TAG="${{ inputs.publish_tag }}"
            if [ -z "$TAG" ]; then
              python3 lib/publish_disk.py out/macos15-desktop.qcow2 --kind macos15-desktop
            else
              python3 lib/publish_disk.py out/macos15-desktop.qcow2 --tag "$TAG" \
                --kind macos15-desktop
            fi

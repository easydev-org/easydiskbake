name: redox-desktop_575-bake

# Turn the published Redox image into a disk this repository can log in to.
#
# WHAT THIS SYSTEM IS, AND WHY THERE IS NO INSTALLER HERE
#
# Redox publishes a `.img.zst` that is not an installer: it is a complete, bootable Redox
# with Orbital and its package manager already on it. `redox_installer_tui` exists to copy
# that system onto another disk, which would produce the same system under a different name
# and answer nothing.
#
# So the bake is not an installation. It is the five things that turn a vendor image into a
# gold disk, all done from the system's own console:
#
#     1. an account this repository can log in as   /etc/users.toml, not /etc/passwd
#     2. openssh                                    NOT in the desktop image at all
#     3. a host key                                 sshd will not start without one
#     4. an init.d entry                            there is no systemd, and no rustysd
#     5. proof all of it works                      sshd started, account logged in
#
# WHY THE CONSOLE IS TYPED AT AND READ BACK
#
# Redox's desktop image has no serial console - there is no ttyS0 in it - and no ssh, since
# that is what is being installed. What is left is the keyboard through QMP and the screen
# as a screenshot. Every command is followed by a marker the console echoes, and a step
# whose marker never appears stops the run instead of retrying into a console that moved.
#
# THE CPU STRING IS REDOX'S OWN. Its documentation gives
# "Broadwell,-pcid,-x2apic,-tsc-deadline,-hle,-rtm,-invpcid" because the kernel does not
# handle those six features, and the symptom of getting it wrong is a boot that stops with
# nothing on screen. The probe established it, and every stage here uses it.
#
# THE IMAGE IS PINNED BY SHA256. Redox publishes a daily build, so an unpinned URL would
# silently change under the bake - and a disk whose subject changed is not reproducible.
#
# MANUAL ONLY.

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "The tag to publish under (empty for a timestamped one)"
        default: "redox-desktop"
      boot_timeout:
        description: "Seconds to wait for the console and the shell"
        default: "900"
      mem:
        description: "Guest memory in MB"
        default: "2048"
      cpus:
        description: "Guest CPUs"
        default: "2"

concurrency:
  group: bake-redox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # the raw image is 650 MiB, the qcow2 beside it about the same, the recording
            # small; 8 GiB leaves room for the compressor's output
            python3 lib/ci.py free-disk --need 8
            # zstd decompresses the vendor's .img.zst; it is NOT lib/compress.py's zstd,
            # which goes through qemu-img and needs no binary
            zstd --version | head -1
            # the screen is read, so the reader has to exist
            command -v tesseract >/dev/null || { echo "no tesseract: the console cannot be read"; exit 1; }
            tesseract --version 2>&1 | head -1

      - name: bake
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-bake
          interval: "20"
          command: |
            set -euo pipefail
            mkdir -p out
            python3 redox/bake.py \
              --out out/redox.qcow2 \
              --work out/redox-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --mem "${{ inputs.mem || '2048' }}" \
              --cpus "${{ inputs.cpus || '2' }}"

      # THE FRAMES AND THE RECORDING ARE THE EVIDENCE. "It worked" is not something this
      # stage can claim from an exit code: the console is what was typed at, and the video
      # is what a person looks at when a marker did not appear.
      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-bake
          path: |
            out/bake.txt
            out/install.mp4
            out/last-frame.png
          if-no-files-found: warn
          retention-days: 14

      - name: keep the disk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-disk
          path: out/redox.qcow2
          if-no-files-found: warn
          retention-days: 7

      - name: publish
        if: success()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-publish
          interval: "15"
          command: |
            set -euo pipefail
            TAG="${{ inputs.publish_tag }}"
            if [ -z "$TAG" ]; then
              TAG="redox-desktop-$(date -u +%Y%m%d-%H%M%S)"
            fi
            echo "publishing as $TAG"
            python3 lib/publish_disk.py out/redox.qcow2 --tag "$TAG"

      - name: the verdict
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: redox-verdict
          interval: "10"
          command: |
            set -euo pipefail
            echo "=== redox ==="
            if [ -f out/bake.txt ]; then cat out/bake.txt; else echo "no verdict was written"; fi

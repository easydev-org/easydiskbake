name: windows-11_ssh-bake

# Take the published gold disk and give it an SSH server.
#
# WHAT IT DOES
#
#     pulls :windows-base-<stamp> (or a tag given as input)
#     boots it, waits for the desktop
#     opens PowerShell through the keyboard (Esc, Win+R) and runs:
#         winget install Microsoft.OpenSSH.Preview
#         sshd on port 22, password auth, firewall rule
#     proves sshd answers - a real TCP connect and an SSH banner, not a screenshot
#     shuts the guest down through ACPI and publishes :windows-ssh-<stamp>
#
# WHY THIS IS A SEPARATE WORKFLOW FROM bake-windows
#
# The bake is 25 minutes and fails for reasons about installation: an answer file, a
# driver, an ISO. This is 10 minutes and fails for reasons about a package: a winget id
# that moved, a firewall rule, a config line. One job doing both reports "failed" for
# either, and the interesting part is which.
#
# It also starts from a disk that is already known good, so when only this half changes a
# re-run costs minutes instead of half an hour.
#
# WHY THE INPUT IS A TAG AND NOT AN UPLOAD
#
# The gold disk is 10 GiB. An artifact round-trip of that is slower than pulling it from
# the same registry the bake pushed it to, and artifacts expire.
#
# MANUAL ONLY, like every other workflow here.

on:
  workflow_dispatch:
    inputs:
      gold_tag:
        description: "The gold disk to build on (a tag in this package)"
        default: "windows-base-20261102-155400"
      bootstate_run:
        description: "The bake run that produced gold_tag; its artifact carries the
          UEFI variables and TPM state, without which the disk will not boot"
        default: "41472136224"
      publish_tag:
        description: "Tag to publish under, or empty for windows-ssh-<stamp>"
        default: ""
      boot_timeout:
        description: "Seconds to wait for the guest's desktop"
        default: "900"

concurrency:
  group: bake-windows-ssh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ssh:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            # 10 GiB in, 10 GiB out, and a compressed copy.
            python3 lib/ci.py free-disk --need 30
            python3 lib/ci.py tags --prefix windows-base-

      - name: pull the gold disk
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-pull
          interval: "15"
          command: |
            set -euo pipefail
            mkdir -p out
            export GITHUB_TOKEN="${{ github.token }}"
            python3 windows/11/pull.py "${{ inputs.gold_tag }}" out/windows11-gold.qcow2

      # THE DISK AND ITS BOOTSTATE COME FROM THE SAME RUN, and that is why this input is a
      # run id rather than a tag: ghcr holds the qcow2, the artifact store holds the few
      # hundred KiB that make the qcow2 start, and pulling one without the other produces
      # a machine that drops into the firmware shell.
      - name: pull the bootstate
        if: inputs.bootstate_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows11-bootstate
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.bootstate_run }}

      - name: install ssh
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ssh-install
          interval: "15"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            export WINDOWS_ADMIN_PASSWORD=admin
            python3 windows/11/ssh.py \
              --gold out/windows11-gold.qcow2 \
              --out out/windows11-ssh.qcow2 \
              --bootstate out/windows11.qcow2.bootstate.tar.gz \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}"

      # THE PUBLISHED DISK AND ITS BOOTSTATE ARE RENAMED THE SAME WAY, and this step is
      # the rename. bake.py publishes `windows11.qcow2` beside
      # `windows11.qcow2.bootstate.tar.gz`, but this stage pulls the disk from ghcr as
      # `windows11-gold.qcow2`, so the two names diverge the moment the disk lands.
      #
      # The previous version of the step above passed
      # `out/windows11-gold.qcow2.bootstate.tar.gz` - a name nothing creates - and run
      # 41480134822 failed with
      #
      #     no bootstate archive at .../ssh-work/disk.qcow2.bootstate.tar.gz
      #
      # ssh.py's --bootstate is the archive as it arrives (windows11.qcow2.bootstate...);
      # bootstate.adopt() moves it to the working disk's name. Passing the rename on the
      # command line skipped the move.

      - name: keep the swtpm log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-swtpm
          path: out/ssh-work/swtpm.log
          if-no-files-found: ignore
          retention-days: 7

      - name: keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-recording
          path: |
            out/ssh-work/shots/*.ppm
            out/ssh-work/console.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      # Passed on to bake-windows-dev, which needs the same firmware state to start it.
      - name: keep the bootstate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ssh-bootstate
          path: out/windows11-ssh.qcow2.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30

      # THE DISK IS HANDED TO THE CLEAN JOB, NOT PUBLISHED HERE.
      #
      # This stage used to publish directly, which meant a cleaned disk and an uncleaned one
      # were indistinguishable in the package - the clean was a line in this job's log. The
      # artifact below is the handoff: the clean job pulls it, boots it, cleans it, and
      # publishes the result under the tag this workflow was asked for.
      - name: upload the disk
        uses: actions/upload-artifact@v4
        with:
          name: windows-ssh-disk
          path: |
            out/windows11-ssh.qcow2
            out/windows11-ssh.qcow2.bootstate.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # CLEANING IS ITS OWN JOB, AND IT PUBLISHES.
  #
  # The reason it is a separate job rather than a step: it has to BOOT the disk and talk to
  # it over ssh, which is a whole machine's worth of work and has nothing to do with
  # installing OpenSSH. Keeping them apart means a cleaning change does not re-run the
  # install, and the run graph shows which of the two failed.
  #
  # IT IS ALSO THE ONLY THING THAT PUBLISHES. A disk that was not cleaned never reaches the
  # package, so "the tag exists" implies "it was cleaned".
  clean:
    needs: ssh
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: prepare
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: clean-prepare
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py kvm
            python3 lib/ci.py free-disk --need 60
            if ! command -v sshpass >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -qq sshpass
            fi
            sshpass -V | head -1

      # THE DISK AND ITS FIRMWARE STATE, TOGETHER, straight from the job above - not from a
      # tag, because nothing has been published yet. That is what makes the two a sequence
      # rather than a pipeline with a registry in the middle.
      #
      # THEY TRAVEL IN ONE ARTIFACT BECAUSE THEY ARE ONE THING. A disk without its vars file
      # boots to a firmware that finds no boot entry, and two artifacts is two chances for
      # one of them to be missing.
      - name: pull the disk
        uses: actions/download-artifact@v4
        with:
          name: windows-ssh-disk
          path: out/clean-work

      - name: clean it
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: clean-disk
          interval: "20"
          command: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ github.token }}"
            DISK=$(ls out/clean-work/*.qcow2 | head -1)
            echo "disk: $DISK"
            # --disk, NOT --tag: this disk was built by the job above and has never been
            # published. clean_disk.py copies it into --work, boots it there, cleans it and
            # writes --out, so the artifact the ssh job produced is left untouched.
            #
            # --bootstate-run IS NOT PASSED. The vars file arrived beside the disk in the
            # same artifact, and clean_disk.py adopts it by name; a run id here would send it
            # looking for a second copy of something it already has.
            python3 lib/clean_disk.py \
              --disk "$DISK" \
              --kind windows \
              --out out/windows11-ssh.qcow2 \
              --work out/clean-work \
              --artifacts out \
              --boot-timeout "${{ inputs.boot_timeout || '900' }}" \
              --mem 6144

      - name: keep the bootstate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ssh-bootstate-final
          path: out/clean-work/*.bootstate.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: keep the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-record
          path: out/clean.txt
          if-no-files-found: warn
          retention-days: 14

      - name: publish
        if: success()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: clean-publish
          interval: "15"
          command: |
            set -euo pipefail
            python3 lib/ci.py install-oras
            python3 lib/ci.py login --registry ghcr.io
            TAG="${{ inputs.publish_tag }}"
            if [ -z "$TAG" ]; then
              python3 lib/publish_disk.py out/windows11-ssh.qcow2 --kind windows-ssh
            else
              python3 lib/publish_disk.py out/windows11-ssh.qcow2 \
                --kind windows-ssh --tag "$TAG"
            fi

      - name: what is in the package
        if: always()
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ github.token }}
          name: clean-tags
          interval: "10"
          command: |
            set -euo pipefail
            python3 lib/ci.py tags --prefix windows-

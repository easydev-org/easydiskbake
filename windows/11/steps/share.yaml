# A host directory the guest can reach, and a logon hook that runs a script from it.
#
#     python3 lib/steps.py windows/11/steps/share.yaml --ssh-port 2222
#
# WHY THIS IS ITS OWN STAGE, BEFORE THE TOOLCHAIN
#
# Because the share needs nothing installed. SMB is native to Windows and the launcher is
# PowerShell 5.1, which ships with Windows 11 - so this runs on a disk straight out of `bake.py`,
# and a failure here is about the share rather than about a 17.14.44 Visual Studio download.
#
# WHAT THE LOGON HOOK RUNS IS `\\<host>\shared\bootstrap.ps1`, WHICH THE PERSON PUTS THERE.
# Nothing on this disk is required to make it work.
#
# THIS FILE INSTALLS NOTHING ELSE.

name: windows 11 - host share and logon hook
resolution: [1920, 1080]

vars:
  user:
    from: args.user
    default: docker
  password:
    from: args.password
    default: admin
  # THE SERVER, SO THE COMMANDS BELOW DO NOT HARD-CODE AN ADDRESS.
  #
  # The default below is this container's end of the bridge: true of every run here and not
  # true of anything else. A literal typed into an ssh command would bake the CI network into
  # a published disk, which is the mistake this variable exists to prevent - so the address is
  # written ONCE, here, and read everywhere.
  host:
    from: args.host
    default: 172.30.0.1
  # AND THE SHARE'S OWN ACCOUNT, for the same reason.
  smb_user:
    from: args.smb_user
    default: guest
  smb_pass:
    from: args.smb_pass
    default: admin

ssh_user: docker
ssh_port: 2222

steps:
  - name: wait for sshd
    require_ssh: true
    ssh_probe: echo ok
    timeout: 900

  # THE SHARE, ESTABLISHED FOR THIS SESSION ONLY.
  #
  # There is nothing to persist, and that took three runs to accept:
  #
  #     net use Z: \\host\share        0, then "The system cannot find the path"
  #     net use   \\host\share         0, then "user name or password is incorrect"
  #     cmdkey /add:host ...           "Credentials cannot be saved from this logon session"
  #
  # The last one is Microsoft's own limitation, not a setting: CredWriteW answers
  # ERROR_NO_SUCH_LOGON_SESSION with "Network logon sessions do not have an associated credential
  # set.", and Win32-OpenSSH hardcodes LOGON32_LOGON_NETWORK_CLEARTEXT with no way to change it.
  #
  # So the share is a SESSION, and the step below supplies the credential again in its own command
  # rather than inheriting this one's - which is also exactly what the logon hook does.
  - name: mount the host share
    share_mount: true
    share_family: windows
    timeout: 180

  # THE SHARE REALLY IS READABLE AND WRITABLE, WITH THE CREDENTIAL SUPPLIED IN THIS COMMAND.
  #
  # Deliberately a SEPARATE ssh session from the mount above, and deliberately passing the
  # credential again: a session established by one ssh command does not carry over, so if this
  # passes it is because the credential works, not because a previous command left something
  # behind. That is the same thing the logon hook has to do, so passing here is the real proof.
  #
  # `>nul 2>&1` on the net use because a second session reporting "already connected" is not a
  # failure - what is being tested is the dir that follows it.
  - name: prove the share is readable and writable
    ssh: |
      cmd /c "net use \\{{ host }}\shared {{ smb_pass }} /user:{{ smb_user }} /persistent:no >nul 2>&1 & dir \\{{ host }}\shared & echo written-by-this-session > \\{{ host }}\shared\from-guest.txt & type \\{{ host }}\shared\from-guest.txt"
    timeout: 120

  # THE LOGON HOOK: a Task Scheduler task at ONLOGON, running the launcher through
  # `powershell.exe -WindowStyle Hidden` so no console flashes on the desktop.
  - name: install the bootstrap launcher
    bootstrap_install: true
    share_family: windows
    timeout: 300

  # THE TASK HAS TO EXIST AND HAS TO NAME THE LAUNCHER. A registration that failed prints an
  # error, but a registration that succeeded and named the wrong path prints nothing until the
  # next logon - which is a whole publish cycle away. `schtasks /Query /V` prints the action.
  - name: prove the logon task is registered
    ssh: |
      cmd /c "schtasks /Query /TN easydiskbake-bootstrap /V /FO LIST | findstr /i \"TaskName Task_To_Run Status\""
    timeout: 60

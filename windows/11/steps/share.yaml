# A host directory the guest can reach, and a logon hook that runs a script from it.
#
#     python3 lib/steps.py windows/11/steps/share.yaml --ssh-port 2222
#
# WHY THIS IS ITS OWN STAGE, BEFORE THE TOOLCHAIN
#
# Because the share needs nothing installed. SMB is native to Windows and the launcher is
# PowerShell 5.1, which ships with Windows 11 - so this runs on a disk straight out of `bake.py`,
# and a failure here is about the share rather than about a 17.14.44 Visual Studio download.
#
# WHAT THE LOGON HOOK RUNS IS `\\<host>\shared\bootstrap.ps1`, WHICH THE PERSON PUTS THERE.
# Nothing on this disk is required to make it work.
#
# THIS FILE INSTALLS NOTHING ELSE.

name: windows 11 - host share and logon hook
resolution: [1920, 1080]

vars:
  user:
    from: args.user
    default: docker
  password:
    from: args.password
    default: admin
  # THE SERVER, SO THE PROOF BELOW DOES NOT HARD-CODE AN ADDRESS.
  #
  # The default below is this container's end of the bridge: true of every run here and not
  # true of anything else. A literal typed into an ssh command would bake the CI network into
  # a published disk, which is the mistake this variable exists to prevent - so the address is
  # written ONCE, here, and read everywhere.
  host:
    from: args.host
    default: 172.30.0.1

ssh_user: docker
ssh_port: 2222

steps:
  - name: wait for sshd
    require_ssh: true
    ssh_probe: echo ok
    timeout: 900

  # THE SHARE. `cmdkey` puts the credential in the account's vault and the `net use` that follows
  # only checks it works - because a CONNECTION, with or without a drive letter, belongs to the
  # logon session that made it, and every `ssh host command` starts a new one. Runs
  # 42737785611 and 42744898001 failed on exactly that, one on the drive letter and one on the
  # deviceless form. The credential is the thing that survives.
  - name: mount the host share
    share_mount: true
    share_family: windows
    timeout: 180

  # A MOUNT THAT REPORTED SUCCESS AND A SHARE THIS SESSION CAN ACTUALLY USE ARE DIFFERENT FACTS.
  #
  # This runs as a SEPARATE ssh command from the mount above on purpose: if it passed only
  # because the mount's own session was still open, it would prove nothing about the logon hook,
  # which runs in a session of its own.
  - name: prove the share is readable and writable
    ssh: cmd /c "dir \\{{ host }}\shared & echo written-by-this-session > \\{{ host }}\shared\from-guest.txt & type \\{{ host }}\shared\from-guest.txt"
    timeout: 120

  # AND THE CREDENTIAL ITSELF, because that is what the next logon depends on. `cmdkey /list`
  # names the target it will answer for; a mapping would have vanished by then.
  - name: prove the credential is in the vault
    ssh: cmd /c "cmdkey /list | findstr /i {{ host }} & echo --- & cmdkey /list | findstr /i guest"
    timeout: 60

  # THE LOGON HOOK: a Task Scheduler task at ONLOGON, running the launcher through
  # `powershell.exe -WindowStyle Hidden` so no console flashes on the desktop.
  - name: install the bootstrap launcher
    bootstrap_install: true
    share_family: windows
    timeout: 300

  # THE TASK HAS TO EXIST AND HAS TO POINT AT THE LAUNCHER. A registration that failed prints an
  # error, but a registration that succeeded and named the wrong path prints nothing until the
  # next logon - which is a whole publish cycle away.
  - name: prove the logon task is registered
    ssh: cmd /c "schtasks /Query /TN easydiskbake-bootstrap /FO LIST"
    timeout: 60

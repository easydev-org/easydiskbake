# Windows 11 stage three: a developer toolchain on THIS disk, and a compiler that runs.
#
#     python3 lib/steps.py windows/11/steps/dev.yaml --qmp /work/drive.sock.qmp --ssh-port 2222
#
# WHAT THIS STAGE IS FOR, AND WHY IT IS FOUR PACKAGES AND THREE PROOFS
#
# The disk's job is to compile things. "The SDK installed" and "the toolchain works" are
# different claims, and only the second one matters to whoever boots it - so the last three
# steps here build and run a C program through vcvars64, build and run a console app through
# the .NET SDK, and print the pwsh version. Each is a script copied in and run by path,
# because a verification that has to be quoted through ssh -> cmd -> program is a verification
# nobody can read when it fails.
#
# WHY A PINNED WINGET VERSION ON THE BUILD TOOLS
#
# Two other routes were tried and both failed, and the comments where these numbers came from
# are in windows/11/devtools.py. In short: 17.9.7's manifest caps the supported OS at
# 10.0.22000 and this guest is 10.0.26200, so every component is "not applicable" and the
# installer exits 1 while printing a version range that reads like a configuration problem;
# and aka.ms/vs/17/release/vs_BuildTools.exe extracted an empty directory. 17.14.44's manifest
# has no such cap.
#
# WHY THE BUILD TOOLS INSTALL IS A SCRIPT AND THE OTHER THREE ARE NOT
#
# Its --override carries a workload list, spaces and quotes. A package with an --override also
# cannot take --accept-package-agreements - override replaces winget's own switch set - and the
# override string does not survive being passed through ssh and cmd, where the quotes are eaten.
# So the whole command is written to a .bat on the host, copied up, and run by path: the same
# answer as the C and .NET checks below, for the same reason.
#
# THE REST HAVE NO OVERRIDE AND ARE PLAIN `ssh:` STEPS, so a failure names the package.

name: windows 11 - dev toolchain
resolution: [1920, 1080]

vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin

ssh_user: vmuser
ssh_port: 2222

# 25 minutes each is not generous, it is measured: the BuildTools installer alone takes most of
# it, and a timeout that fires during a successful install is indistinguishable from a failure.
steps:
  # THE ARRIVAL CHECK IS SSHD, NOT A DESKTOP. The stage before this one already proved the disk
  # reaches a desktop and answers ssh; what this stage needs is the service, and a TCP banner is
  # a better answer than a picture.
  - name: wait for sshd
    require_ssh: true
    ssh_probe: echo ok
    timeout: 900

  # WINGET IS NOT ON THE PATH AN SSH SESSION SEES, AND SEVEN INSTALLS DIED BEFORE ANYONE ASKED.
  #
  # Run 42964952432, the first time this stage ever ran:
  #
  #     === install the build tools
  #       'winget' is not recognized as an internal or external command,
  #     === install the windows sdk
  #       'winget' is not recognized as an internal or external command,
  #     ... seven times, and then === prove python node and git
  #       MISSING python / MISSING node / MISSING git
  #     === THE THREE THE macOS DISK ALSO HAS ARE NOT ALL HERE ===
  #
  # The last line is true and useless: nothing was installed, so nothing is present. The failure
  # it reports is three missing tools when the fact is ONE MISSING COMMAND, and the seven
  # installs above had already said so and been told it did not matter.
  #
  # WHY winget IS INVISIBLE HERE AND VISIBLE TO THE BAKE. `winget` is an alias under
  # %LOCALAPPDATA%\Microsoft\WindowsApps, a reparse point registered per-user, and it is not on
  # the MACHINE PATH. windows/11/steps/ssh.yaml installs OpenSSH by typing into a real PowerShell
  # window on the console - a full user session, where that path IS set - and this stage is the
  # first to run winget over `ssh:`, where sshd starts a shell with the environment it captured.
  #
  # `windows/11/probe.ps1` already documents the same mechanism for `pwsh`, found the same way
  # and for the same reason: a product installed five seconds ago is not in this session's PATH,
  # but it is in the machine's.
  #
  # SO THE PATH IS RESOLVED ONCE, HERE, AND THE EIGHTEEN STEPS BELOW USE $env:WINGET.
  # WINGET IS NOT ON THE PATH AN SSH SESSION SEES, AND SEVEN INSTALLS DIED BEFORE ANYONE ASKED.
  #
  # Run 42964952432, the first time this stage ever ran:
  #
  #     === install the build tools
  #       'winget' is not recognized as an internal or external command,
  #     === install the windows sdk
  #       'winget' is not recognized as an internal or external command,
  #     ... seven times, and then === prove python node and git
  #       MISSING python / MISSING node / MISSING git
  #     === THE THREE THE macOS DISK ALSO HAS ARE NOT ALL HERE ===
  #
  # The last line is true and useless: nothing was installed, so nothing is present. It reports
  # three missing tools when the fact is ONE MISSING COMMAND, and the seven installs above had
  # already said so and been told - by `optional: true` - that it did not matter.
  #
  # WHY winget IS INVISIBLE HERE AND VISIBLE TO THE BAKE. `winget` is an alias under
  # %LOCALAPPDATA%\Microsoft\WindowsApps, a reparse point registered per-user, and it is NOT on
  # the machine PATH. windows/11/steps/ssh.yaml installs OpenSSH by typing into a real PowerShell
  # window on the console - a full user session, where that path IS set - and this stage is the
  # first to run winget over `ssh:`, where sshd starts a shell with the environment it captured.
  #
  # IT IS ALSO THE ONLY STAGE WHERE IT MATTERS, which is why the fix is here and not in the
  # answer file: every other component this chain installs arrives with the OS image.
  #
  # WHY setx AND NOT JUST $env:Path. `ssh exec` starts a NEW process for every step, and a new
  # process reads the environment sshd captured - which setx does not change. So this step does
  # both: it finds the directory, and it puts that directory on the MACHINE path so an sshd that
  # restarts picks it up, while printing the absolute path so the failure message below can name
  # it if the search comes up empty.
  #
  # THE SEARCH IS THE ONE windows/11/probe.ps1 ALREADY USES for `pwsh`, for the same reason: a
  # product installed five seconds ago is not in this session's PATH, but it is in the machine's
  # (and in the user's, which is where winget lives).
  - name: install the build tools
    script: |
      # WINGET IS AN ALIAS UNDER %LOCALAPPDATA%\Microsoft\WindowsApps AND IS NOT ON THE MACHINE
      # PATH, so an `ssh exec` shell - which gets the environment sshd captured, not the user's
      # profile - cannot name it. Resolved here, per step, because every step is a new process.
      $winget = $null
      $dirs = @()
      foreach ($scope in @('Machine', 'User')) {
        try { $dirs += ([Environment]::GetEnvironmentVariable('Path', $scope) -split ';') } catch { }
      }
      $dirs += (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps')
      foreach ($dir in ($dirs | Where-Object { $_ })) {
        $cand = Join-Path $dir 'winget.exe'
        if (Test-Path $cand) { $winget = $cand; break }
      }
      if (-not $winget) {
        Write-Output 'WINGET_NOT_FOUND'
        exit 1
      }
      # THE PINNED VERSION AND THE WORKLOAD ARE WHY THIS IS A SCRIPT AND NOT A ONE-LINER: the
      # `--override` string carries spaces, quotes and a comma-free workload list, and by the
      # time it has been through ssh and cmd the quotes are gone. windows/11/devtools.py holds
      # the measurements that chose 17.14.44 over 17.9.7 and over the aka.ms bootstrapper.
      # `--quiet`, `--wait` AND `--norestart` ARE NOT ALLOWED BESIDE `--override`, and the file
      # already said so eight hundred lines up: "a package with an --override also cannot take
      # --accept-package-agreements - override replaces winget's own switch set". Run 42965954028
      # proved it for three more of them:
      #
      #     Argument name was not recognized for the current command: '--quiet'
      #
      # The override string is passed to the Visual Studio bootstrapper itself, so the switches
      # that would have controlled winget are carried INSIDE it instead:
      #
      #     --quiet --wait --norestart
      #
      # and `--disable-interactivity` is winget's own and stays outside, because it is what stops
      # a first-run agreement prompt from waiting for a console that does not exist.
      & $winget install --id Microsoft.VisualStudio.2022.BuildTools --exact --source winget `
        --scope machine --version 17.14.44 --accept-source-agreements --disable-interactivity `
        --override "--quiet --wait --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
      exit $LASTEXITCODE
    script_shell: powershell
    script_name: install-buildtools.ps1
    timeout: 3600

  - name: install the windows sdk
    script: |
      # WINGET IS AN ALIAS UNDER %LOCALAPPDATA%\Microsoft\WindowsApps AND IS NOT ON THE MACHINE
      # PATH, so an `ssh exec` shell - which gets the environment sshd captured, not the user's
      # profile - cannot name it. This is the same lookup windows/11/probe.ps1 does for `pwsh`,
      # for the same reason. Resolved in THIS process so no state has to survive between steps.
      $winget = $null
      $dirs = @()
      foreach ($scope in @('Machine', 'User')) {
        try { $dirs += ([Environment]::GetEnvironmentVariable('Path', $scope) -split ';') } catch { }
      }
      $dirs += (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps')
      foreach ($dir in ($dirs | Where-Object { $_ })) {
        $cand = Join-Path $dir 'winget.exe'
        if (Test-Path $cand) { $winget = $cand; break }
      }
      if (-not $winget) {
        Write-Output 'WINGET_NOT_FOUND'
        exit 1
      }
      & $winget install --id Microsoft.WindowsSDK.10.0.26100 --exact --source winget --scope machine `
        --accept-source-agreements --accept-package-agreements --disable-interactivity
      # THE EXIT CODE IS READ ON THE LINE IMMEDIATELY AFTER THE NATIVE CALL, and that placement
      # is itself a fix. The first version read it after a twenty-line comment block and printed
      # nothing at all:
      #
      #     script install-the-windows-sdk.ps1 (powershell) -> 43
      #     Found an existing package already installed. ...
      #
      # with no `ALREADY_PRESENT`, so the `if` never saw the 43 that the exit status carried.
      # `$LASTEXITCODE` belongs to the last native command; read it adjacent or do not trust it.
      $rc = $LASTEXITCODE
      #
      # "ALREADY INSTALLED" IS A SUCCESS, AND WINGET REPORTS IT AS EXIT CODE 43.
      #
      # Run 42966695727: the BuildTools install took 13m42s and exited 0 - the VCTools workload
      # brought the Windows SDK with it, which is what this file says it does ("The Windows SDK
      # and CMake come with the workload, which is why they are not installed separately here").
      # The next step then asked winget for the SDK and got:
      #
      #     Found an existing package already installed. Trying to upgrade ...
      #     No available upgrade found.
      #     No newer package versions are available from the configured sources.
      #     -> 43
      #
      # 43 is APPINSTALLER_CLI_ERROR_UPDATE_NOT_APPLICABLE: the package is present and there is
      # nothing to do. Treating that as a failure makes this stage impossible to pass on a disk
      # that already has the toolchain - which is the state THIS STAGE ITSELF creates.
      #
      # `windows/11/devtools.py` holds this judgement in Python already. The YAML had no
      # equivalent, so the rule lived in one place and its duplicates did not.
      #
      # ANY OTHER NON-ZERO IS STILL A FAILURE, named rather than swallowed:
      # THE VALUE IS PRINTED UNCONDITIONALLY, BECAUSE THE FIRST TWO ATTEMPTS AT THIS CHECK
      # COULD NOT BE READ. The script exited 43 - so the 43 reached `exit` - and `ALREADY_PRESENT`
      # never appeared, which admits two explanations and the log could not tell them apart:
      # the branch did not run, or its output was cut off by the forty-line cap `lib/steps.py`
      # puts on a script's output. One line removes the ambiguity, and it is cheap enough to
      # keep: the next reader should not have to reconstruct this from an exit code.
      Write-Output ("WINGET_EXIT=" + $rc)
      # COMPARED ON THE LOW BYTE, BECAUSE $LASTEXITCODE IS NOT THE NUMBER THE SHELL REPORTS.
      #
      # Three attempts failed here on `$rc -eq 43`. The printed value, added this time, is what
      # finally said why:
      #
      #     WINGET_EXIT=-1978335189
      #
      # -1978335189 is 0x8A15002B: winget's HRESULT for APPINSTALLER_CLI_ERROR_UPDATE_NOT_APPLICABLE,
      # as PowerShell carries it (signed 32-bit). `-1978335189 & 0xFF` is 0x2B, which is 43 - the
      # number a POSIX shell would have reported, and the number `lib/steps.py` logs as `-> 43`.
      #
      # So the exit status in the log and the value in the variable are the same fact spelled two
      # ways, and the branch compared one against the other. `0x8A15002B` AND `43` are not equal
      # and never were.
      #
      # THE MASK IS THE RULE, NOT A WORKAROUND FOR THIS ONE CODE: `$LASTEXITCODE` in PowerShell is
      # an int32 carrying an HRESULT when the program returns one, and every winget error would
      # have hit the same trap.
      $low = $rc -band 0xFF
      if ($low -eq 43) {
        Write-Output 'ALREADY_PRESENT (winget 0x8A15002B: no upgrade applicable)'
        exit 0
      }
      exit $rc
    script_shell: powershell
    script_name: install-the-windows-sdk.ps1
    timeout: 2400

